:root {
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, monospace;

  --fs-row: 12px;
  --fs-head: 12px;
  --fs-meta: 11px;

  /* density-driven */
  --row-h: 21px;
  --row-gap: 1px;
  --head-h: 26px;
  --col-pad: 4px;      /* inset gutter each side of a row */
  --gutter: 10px;      /* space between columns — where the trail lives */
  --radius: 5px;
  --spine-w: 34px;

  /* light palette */
  --accent:        #2f6df6;
  --accent-weak:   color-mix(in srgb, var(--accent) 13%, transparent);
  --accent-soft:   color-mix(in srgb, var(--accent) 30%, transparent);
  --accent-ink:    color-mix(in srgb, var(--accent) 88%, #000 12%);

  --chrome:        #e7e7ec;   /* window / gutter background */
  --surface:       #ffffff;   /* focused column */
  --surface-2:     #fbfbfd;   /* preview */
  --ink:           #16171a;
  --ink-2:         #55575e;   /* secondary text */
  --ink-3:         #8b8d96;   /* tertiary / counts */
  --hairline:      rgba(0,0,0,.085);
  --hairline-2:    rgba(0,0,0,.14);
  --hover:         rgba(0,0,0,.045);
  --shadow-col:    0 0 0 .5px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.05);
  --recede:        #000;      /* what ancestors fade toward */
  --recede-amt:    3.2%;      /* per-level recession */
}

:root[data-density="comfortable"] {
  --row-h: 26px; --head-h: 30px; --fs-row: 13px; --radius: 7px;
  --col-pad: 5px; --gutter: 13px;
}

:root[data-theme="dark"] {
  --accent:      #5b8dff;
  --accent-ink:  color-mix(in srgb, var(--accent) 92%, #fff 8%);
  --chrome:      #1b1d21;
  --surface:     #26292e;
  --surface-2:   #22252a;
  --ink:         #e9eaee;
  --ink-2:       #a4a8b2;
  --ink-3:       #71757f;
  --hairline:    rgba(255,255,255,.075);
  --hairline-2:  rgba(255,255,255,.13);
  --hover:       rgba(255,255,255,.06);
  --shadow-col:  0 0 0 .5px rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.35);
  --recede:      #000;
  --recede-amt:  4.5%;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: var(--fs-row);
  color: var(--ink); background: var(--chrome);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}

/* ── App shell ─────────────────────────────────────────────────────────── */
#shell { display: flex; flex-direction: column; height: 100%; }

/* ── Breadcrumb / toolbar ──────────────────────────────────────────────── */
#bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 2px;
  height: 36px; padding: 0 8px 0 10px;
  background: color-mix(in srgb, var(--chrome) 70%, var(--surface));
  border-bottom: 1px solid var(--hairline);
  font-size: var(--fs-head);
}
#crumbs { display: flex; align-items: center; gap: 1px; min-width: 0; overflow: hidden; }
.crumb {
  padding: 3px 7px; border-radius: 5px; color: var(--ink-2); cursor: pointer;
  white-space: nowrap;
}
.crumb:hover { background: var(--hover); color: var(--ink); }
.crumb.here { color: var(--ink); font-weight: 590; }
.crumb-sep { color: var(--ink-3); opacity: .55; user-select: none; }
.spacer { flex: 1; }

/* Shown only by the server build, while a local folder has replaced the served
   tree — the one state where the address bar cannot describe what you see. */
#local-badge {
  display: flex; align-items: center; gap: 5px; margin-right: 6px;
  padding: 2px 4px 2px 7px; border-radius: 11px; white-space: nowrap;
  font-size: var(--fs-meta); color: var(--ink-2);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
}
#local-badge[hidden] { display: none; }
#local-badge svg { width: 12px; height: 12px; fill: var(--accent); }
#local-badge button {
  font: inherit; line-height: 1; color: var(--ink-3); cursor: pointer;
  background: transparent; border: 0; border-radius: 50%; padding: 2px 4px;
}
#local-badge button:hover { background: var(--hover); color: var(--ink); }

/* ── Toolbar buttons ───────────────────────────────────────────────────── */
.tb {
  font: inherit; font-size: var(--fs-head); line-height: 1; color: var(--ink-2);
  background: transparent; border: 0; border-radius: 6px;
  height: 24px; padding: 0 8px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.tb:hover, .tb[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
.tb-ico { width: 14px; height: 14px; fill: currentColor; opacity: .8; }
#gear { width: 26px; padding: 0; justify-content: center; font-size: 14px; }
#settings {
  position: absolute; top: 34px; right: 8px; z-index: 40; min-width: 210px;
  padding: 5px; border-radius: 9px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline);
  box-shadow: 0 8px 28px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.06);
}
#settings[hidden] { display: none; }
#settings .grp {
  padding: 6px 9px 3px; font-size: 10px; letter-spacing: .5px;
  text-transform: uppercase; color: var(--ink-3);
}
#settings button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  font: inherit; font-size: var(--fs-head); text-align: left; color: inherit;
  background: transparent; border: 0; border-radius: 6px;
  padding: 5px 9px; cursor: pointer;
}
#settings button:hover { background: var(--hover); }
#settings button .tick { width: 13px; color: var(--accent); opacity: 0; }
#settings button[aria-checked="true"] .tick { opacity: 1; }
#settings hr { border: 0; border-top: 1px solid var(--hairline); margin: 5px 4px; }

/* ═══════════════════════════════════════════════════════════════════════════
   Horizontal scroll = condensing control.
   #finder scrolls; #rail supplies the scroll range; #stage sticks to the
   viewport so nothing actually translates — the scroll position is read as a
   0–100% dial that folds columns from the left.
   ═══════════════════════════════════════════════════════════════════════════ */
#finder {
  flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin; scrollbar-color: var(--hairline-2) transparent;
}
#finder::-webkit-scrollbar { height: 9px; }
#finder::-webkit-scrollbar-thumb {
  background: var(--hairline-2); border-radius: 5px;

<!-- The page is built by core/shell.js — one copy of the chrome for both the
     static build and the server build. See src/adapters/README.md.

     core/ is the shared UI and knows nothing about where its nodes come from;
     adapters/ chooses. Swap the four adapter lines and the same app browses a
     server instead — that is exactly what the pykofinder page does.
     Load order is dependency order; only app-*.js runs anything at load time. -->
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   The chrome — top bar, stage, status strip, welcome screen.

   In JavaScript rather than in the HTML file because there are two HTML files
   (a static one and one the server emits) and this markup has to be the same
   in both. A shared *file* would need a build step or a fetch; the static build
   can afford neither, since it has to keep running unbuilt from src/ and, once
   bundled, from a file:// page with no network at all.

   So: one page structure, emitted before anything queries it. Every id below is
   part of the contract core/ relies on — state.js takes its element handles the
   moment it loads, which is why this script comes first.
   ═══════════════════════════════════════════════════════════════════════════ */
document.body.insertAdjacentHTML("afterbegin", `
<div id="shell">
  <div id="bar">
    <div id="crumbs"></div>
    <div class="spacer"></div>
    <span id="local-badge" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.4 3.2h4.1l1.3 1.7h7.8c.6 0 1 .4 1 1v7c0 .6-.4 1-1 1H1.4c-.6 0-1-.4-1-1V4.2c0-.6.4-1 1-1z"/></svg>
      <span class="nm"></span>
      <button id="leave-local" title="Back to the served folder">✕</button>

    <button class="tb" id="open" title="Open a folder on this machine">

      Open Folder…</button>
    <button class="tb" id="gear" aria-expanded="false" title="Settings">⚙</button>
    <div id="settings" hidden>
      <div class="grp">View</div>
      <button id="s-dot"     role="menuitemcheckbox" aria-checked="false"><span class="tick">✓</span>Show dotfiles</button>
      <button id="s-density" role="menuitemcheckbox" aria-checked="true"><span class="tick">✓</span>Compact rows</button>
      <hr>
      <div class="grp">Appearance</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Ports — the three seams between the shared UI and whatever is behind it.

   Everything in core/ is source-agnostic: it knows about nodes, columns and
   keystrokes, never about the File System Access API, HTTP, or a URL scheme.
   The three objects below are what an adapter fills in. Pick a different set
   and the same UI browses a server instead of a local folder.

   ── FS ─ the filesystem ────────────────────────────────────────────────────
   A node is  { name, dir, kids }  plus whatever the adapter needs to fetch it:
       kids === null        directory, not read yet   → spinner
       kids === []          read, and empty (or unreadable — see .denied)
       kids === [Node…]     read
       node.denied          string; shown in place of the rows
       node.meta            { size, mod, type } once loadMeta has run
       node.lastSel         UI scratch — written by the UI, never by an adapter

     ensureLoaded(node) → Promise   fills node.kids (idempotent, debounced)
     loadMeta(node)     → Promise   fills node.meta  (may be a no-op if the
                                    listing already carried the metadata)

   ── PREVIEW ─ the preview body ─────────────────────────────────────────────
     render(node) → Promise<string|null>
         HTML for the preview body, or null for "no inline preview". The pane's
         chrome — header, hero, size/modified list — is core's, and so is the
         staleness guard: a provider may take as long as it likes.
     revoke()  → void                optional; release object URLs

   ── ROUTER ─ the address bar ───────────────────────────────────────────────
     read()          → {root, path:[names…]} | null    the location right now
     write(state)    → void                            reflect state, no reload
     onNavigate(cb)  → void                            back/forward pressed
     Set to null to run with no URL syncing at all.
   ═══════════════════════════════════════════════════════════════════════════ */
let FS = null, PREVIEW = null, ROUTER = null;

const useFilesystem = a => { FS = a; };
const usePreview    = p => { PREVIEW = p; };
const useRouter     = r => { ROUTER = r; };
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Icons — Seti UI font (MIT), extension map generated by build-seti-map.py.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Seti has glyphs for these but mapping.less never binds them to an extension. */
const SUPP = { nix: ["e019","#519aba"], db: ["e022","#dd4b78"], sqlite: ["e022","#dd4b78"],
               lock: ["e05d","#7fae42"], desktop: ["e019","#6d8086"] };
const FOLDER_PATH =
  '<path d="M1.4 3.2h4.1l1.3 1.7h7.8c.6 0 1 .4 1 1v7c0 .6-.4 1-1 1H1.4c-.6 0-1-.4-1-1V4.2c0-.6.4-1 1-1z"/>';
const FOLDER_SVG = `<svg viewBox="0 0 16 16">${FOLDER_PATH}</svg>`;

function iconHTML(node) {
  /* An adapter may name its own glyph — a virtual filesystem's tables and rows
     are not files and have no extension to look up. */
  if (node.icon) return `<span class="ico glyph">${esc(node.icon)}</span>`;
  if (node.dir) return `<span class="ico dir">${FOLDER_SVG}</span>`;
  const lower = node.name.toLowerCase(), ext = lower.split(".").pop();
  const e = SETI.name[lower] || SETI.ext[ext] || SUPP[ext] || SETI.default;
  const color = (root.dataset.theme === "light" && SETI.light[ext]) || e[1];
  return `<span class="ico seti" style="color:${color}">&#x${e[0]};</span>`;
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════════════════ */
const root    = document.documentElement;
const finder  = document.getElementById("finder");
const rail    = document.getElementById("rail");
const stage   = document.getElementById("stage");
const strip   = document.getElementById("strip");
const trail   = document.getElementById("trail");
const welcome = document.getElementById("welcome");

let path = [];                                           // node chain, [0] = root
let sel  = [];                                           // per-column selected name
let focusCol = 0;
let cursor = {};                                         // col index -> row index
let widths = [];                                         // natural width per column
let folded = 0;                                          // columns currently folded
let pvToken = 0;                                         // guards async preview fills
const state = { dotfiles: false };

const GUTTER = () => parseInt(getComputedStyle(root).getPropertyValue("--gutter"));
const SPINE  = () => parseInt(getComputedStyle(root).getPropertyValue("--spine-w"));

const visibleKids = node =>
  (node.kids || []).filter(k => state.dotfiles || !k.name.startsWith("."))
    .sort((a,b) => (!!b.dir - !!a.dir) || a.name.localeCompare(b.name, undefined, {numeric:true}));

const fmtSize = b =>
  b < 1024 ? `${b} B`
  : b < 1024 ** 2 ? `${(b / 1024).toFixed(b < 10240 ? 1 : 0)} KB`
  : b < 1024 ** 3 ? `${(b / 1024 ** 2).toFixed(1)} MB`
  : `${(b / 1024 ** 3).toFixed(2)} GB`;

const fmtDate = ms => new Date(ms).toLocaleString(undefined,
  { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

const splitName = name => {
  const i = name.lastIndexOf(".");
  return (i > 0) ? [name.slice(0,i), name.slice(i)] : [name, ""];
};

const previewNode = () => {
  const last = path[path.length - 1], s = sel[path.length - 1];
  const n = s && (last.kids || []).find(k => k.name === s);
  return (n && !n.dir) ? n : null;
};

/* target reading width for the preview — the thing scrolling tries to protect */
const previewTarget = () => previewNode()
  ? Math.min(760, Math.max(420, Math.round(stage.clientWidth * 0.45)))
  : 300;

function measure(node) {
  /* content-driven width, clamped — no manual resizing, no wasted space */
  const c = (measure._c ||= document.createElement("canvas").getContext("2d"));
  const cs = getComputedStyle(root);
  c.font = `${cs.getPropertyValue("--fs-row").trim()} ${cs.getPropertyValue("--font")}`;
  let w = 0;
  for (const k of visibleKids(node)) w = Math.max(w, c.measureText(k.name).width);
  c.font = `600 ${cs.getPropertyValue("--fs-head").trim()} ${cs.getPropertyValue("--font")}`;
  w = Math.max(w, c.measureText(node.name).width + 34);
  /* 380 not 268: a vault of 80-character page titles needs the room, and the
     dial makes wide columns affordable — fold what you are not reading. */
  return Math.min(380, Math.max(148, Math.ceil(w) + 58));
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════════════════════════════ */
/* Building a column is O(entries), and real directories hold thousands of them
   — far too expensive to redo on every arrow key. A column's DOM is therefore
   built once per (node, entry list) and cached; a re-render only re-applies the
   state that actually changed: depth, selection, cursor, width.
   Anything that alters how a row *looks* (dotfile filter, density, theme icon
   colours) is part of the signature and drops the whole cache. */
const colCache = new Map();
let cacheSig = null;
const CACHE_MAX = 24;

/* Writing the value a property already holds still dirties it — and a width or
   custom-property write on a column relays out every row inside it. Guard the
   writes and a re-render of an unchanged column costs nothing. */
const set = (obj, key, value) => { if (obj[key] !== value) obj[key] = value; };
const setVar = (el, name, value) => {
  if (el.style.getPropertyValue(name) !== value) el.style.setProperty(name, value);
};

function buildCol(node) {
  const kids = visibleKids(node);
  const el = document.createElement("div");
  el.className = "col";
  el.innerHTML = `
    <div class="col-head">
      <span class="name"><span>${esc(node.name)}</span></span>
      <span class="count">${node.kids === null ? "" : kids.length}</span>
    </div>
    <div class="col-body"></div>
    <div class="spine-label" title="${esc(node.name)} — click to unfold">
      <span class="dot"></span>
      <span class="txt">${esc(node.name)}</span>
    </div>`;

  const body = el.querySelector(".col-body");
  if (node.kids === null) {
    body.innerHTML = `<div class="col-note"><span class="spinner"></span>Reading…</div>`;
  } else if (node.denied) {
    body.innerHTML = `<div class="col-note">⚠ ${esc(node.denied)}</div>`;
  } else if (!kids.length) {
    body.innerHTML = `<div class="col-note">Empty</div>`;
  }
  /* a folded column hides its rows, so the click lands on the column itself —
     that is what makes the advertised "click a spine to unfold" work */
  el.onclick = () => { if (el.classList.contains("spine")) unfoldTo(+el.dataset.i); };

  const rows = kids.map((k, ri) => {
    const [stem, ext] = splitName(k.name);
    const row = document.createElement("div");
    row.className = "row" + (k.name.startsWith(".") ? " dotfile" : "");
    row.title = k.name;   /* the full name is always one hover away */
    row.innerHTML = iconHTML(k)
      + `<span class="label">${esc(stem)}<span class="dim">${esc(ext)}</span></span>`
      + (k.dir ? `<span class="chev">›</span>` : "");
    /* read the index off the element: the same node keeps its DOM across
       re-renders, and its column position is only known at render time */
    row.onclick = () => choose(+el.dataset.i, k, ri);
    body.appendChild(row);
    return row;
  });
  body.onscroll = paintTrail;

  return { el, body, kids, rows, kidsRef: node.kids,
           dot: el.querySelector(".dot"), width: measure(node) };
}

function columnFor(node) {
  let c = colCache.get(node);
  if (c && c.kidsRef !== node.kids) c = null;      /* directory finished reading */
  if (!c) c = buildCol(node);
  colCache.delete(node);                            /* re-insert = most recently used */
  colCache.set(node, c);
  for (const k of colCache.keys()) {
    if (colCache.size <= CACHE_MAX) break;
    if (!path.includes(k)) colCache.delete(k);
  }
  return c;
}

function render(keepScroll) {
  if (!path.length) return;
  const sig = `${state.dotfiles}|${root.dataset.density}|${root.dataset.theme}`;
  if (sig !== cacheSig) { colCache.clear(); cacheSig = sig; }

  widths = [];
  const cols = path.map((node, i) => {
    const c = columnFor(node);
    widths.push(c.width);

    set(c.el, "className", "col " +
      (i < focusCol ? "ancestor" : i > focusCol ? "descendant" : "focus"));
    set(c.el.dataset, "depth", String(Math.min(5, Math.max(0, focusCol - i))));
    set(c.el.dataset, "i", String(i));
    set(c.el.style, "width", c.width + "px");

    if (c.dotFor !== sel[i]) {                 /* spine icon of the chosen child */
      const chosen = c.kids.find(k => k.name === sel[i]);
      c.dot.innerHTML = chosen ? iconHTML(chosen) : "";
      c.dotFor = sel[i];
    }
    c.rows.forEach((row, ri) => {
      row.classList.toggle("sel", c.kids[ri].name === sel[i]);
      row.classList.toggle("cursor", i === focusCol && cursor[i] === ri);
    });
    return c;
  });

  /* Reconcile instead of replaceChildren: re-inserting an element detaches it,
     which throws away the style and layout of every row underneath it. Columns
     that keep their slot must not be touched at all. */
  const want = [...cols.map(c => c.el), renderPreview()];
  want.forEach((el, i) => {
    if (strip.childNodes[i] !== el) strip.insertBefore(el, strip.childNodes[i] || null);
  });
  while (strip.childNodes.length > want.length) strip.lastChild.remove();
  for (const c of cols)
    c.el.classList.toggle("scrollable-down", c.body.scrollHeight > c.body.clientHeight + 4);
  renderCrumbs();
  layout(keepScroll);
  syncURL();
}

function renderPreview() {
  const n = previewNode();
  const pv = document.createElement("div");
  pv.id = "preview";
  PREVIEW.revoke?.();
  if (!n) {
    pv.innerHTML = `<div class="pv-empty"><div class="glyph">◫</div>
                    <div>Select a file to preview</div></div>`;
    return pv;
  }
  const [stem, ext] = splitName(n.name);
  pv.innerHTML = `
    <div class="col-head"><span class="name"><span>${esc(n.name)}</span></span></div>
    <div class="pv-body">
      <div class="pv-hero">
        ${iconHTML(n)}
        <div><h2>${esc(stem)}<span style="color:var(--ink-3)">${esc(ext)}</span></h2>
             <div class="sub" id="pv-sub">reading…</div></div>
      </div>
      <div id="pv-content"></div>
      <dl class="meta">
        <dt>Where</dt><dd>${esc(path.map(p => p.name).join(" / "))}</dd>
        <dt>Size</dt><dd id="pv-size">—</dd>
        <dt>Modified</dt><dd id="pv-mod">—</dd>
      </dl>
    </div>`;
  fillPreview(n);
  return pv;
}

/* Metadata and contents arrive after the layout is already on screen; the token
   makes sure a slow read for a file you have since navigated away from is
   dropped. That guard lives here, not in the provider, so a provider is free to
   be as slow as it needs to be — a server round-trip, a WASM highlighter. */
async function fillPreview(n) {
  const token = ++pvToken;
  await FS.loadMeta(n);
  if (token !== pvToken) return;
  const m = n.meta || {};
  const sub  = document.getElementById("pv-sub");
  if (!sub) return;
  if (m.error) { sub.textContent = "unreadable"; return; }
  /* Not everything a column can hold is a file. A row inside a database has no
     size and no mtime, and inventing them prints "0 B · 1 Jan 1970" — so leave
     the fields at their dashes and go straight to the body. */
  if (m.size == null) {
    sub.textContent = "";
  } else {
    sub.textContent = `${fmtSize(m.size)} · modified ${fmtDate(m.mod)}`;
    document.getElementById("pv-size").textContent = `${fmtSize(m.size)} (${m.size.toLocaleString()} bytes)`;
    document.getElementById("pv-mod").textContent  = fmtDate(m.mod);
  }

  let html = null;
  try {
    html = await PREVIEW.render(n);
  } catch (err) {
    html = `<p class="pv-err">Preview failed: ${esc(String(err.message || err))}</p>`;
  }
  if (token !== pvToken) return;
  const host = document.getElementById("pv-content");
  if (!host) return;
  host.innerHTML = html ?? `<p>No inline preview for this file type.</p>`;
  paintTrail();
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Layout + the scroll dial

   scrollLeft is not a translation — it is a 0–100% condensing dial:
     0%       every column unfolded; preview overflows off the right edge
     k·unit   the leftmost k columns folded to spines   (unit = 99% / ncols)
     99%      every column folded; preview fills what is left
     99–100%  the spine strip itself slides away; at 100% the preview is alone
   ═══════════════════════════════════════════════════════════════════════════ */
function stripSpan(k) {                     /* width of the column strip with k folded */
  const g = GUTTER(), n = path.length;
  const cols = widths.reduce((a, w, i) => a + (i < k ? SPINE() : w), 0);
  return cols + g * (n + 1);                /* padding either side + inter-column gaps */
}
const foldUnit = () => 0.99 / path.length;
const range    = () => Math.max(1, stripSpan(0) - GUTTER());

function layout(keepScroll) {
  const stageW = finder.clientWidth;
  setVar(root, "--stage-w", stageW + "px");
  setVar(root, "--preview-w", previewTarget() + "px");
  rail.style.width = (stageW + range()) + "px";

  if (!keepScroll) {
    /* default: the least folding that still gives the preview its full width */
    let k = 0;
    while (k < path.length && stripSpan(k) + previewTarget() > stageW) k++;
    finder.scrollLeft = Math.round(k * foldUnit() * range());
  }
  applyScroll();
}

function applyScroll() {
  if (!path.length) return;
  const max = Math.max(1, rail.clientWidth - finder.clientWidth);
  const p = Math.min(1, finder.scrollLeft / max);
  const n = path.length;

  /* the epsilon absorbs sub-pixel scrollLeft rounding at the fold boundaries */
  const raw = p / foldUnit() + 0.002;
  folded = Math.min(n, Math.floor(raw));
  /* how far into folding the next column is — 0 = full width, 1 = a spine */
  const t = Math.min(1, Math.max(0, raw - folded));

  [...strip.querySelectorAll(".col")].forEach((col, i) => {
    col.classList.toggle("spine", i < folded);
    col.classList.toggle("folding", i === folded && folded < n);
    if (i < folded) { set(col.style, "width", ""); return; }
    set(col.dataset, "fold", String(i === folded ? t : 0));
    setVar(col, "--fold", col.dataset.fold);   /* custom props need setProperty */
    set(col.style, "width", (i === folded
      ? Math.round(widths[i] + (SPINE() - widths[i]) * t)
      : widths[i]) + "px");
  });

  /* last 1%: slide the spine strip itself off the left edge. Widening the strip
     by the same amount keeps the preview's flex-grow filling to the right edge. */
  const tail  = p > 0.99 ? (p - 0.99) / 0.01 : 0;
  const shift = tail * n * (SPINE() + GUTTER());
  set(strip.style, "minWidth", (finder.clientWidth + shift) + "px");
  set(strip.style, "transform", `translateX(${-shift}px)`);

  document.getElementById("st-fold").textContent =
    folded ? `${folded}/${n} folded` : "";
  paintTrail();
}

finder.addEventListener("scroll", applyScroll, { passive: true });
addEventListener("resize", () => render());
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   The trail: an elbow from each selected row into the next column's header.
   The vertical run sits on the centre line of the gutter between the columns.
   ═══════════════════════════════════════════════════════════════════════════ */
function paintTrail() {
  const fr = stage.getBoundingClientRect();
  trail.setAttribute("viewBox", `0 0 ${fr.width} ${fr.height}`);
  trail.style.width = fr.width + "px"; trail.style.height = fr.height + "px";
  let out = "";

  /* a column past the crossfade midpoint anchors on its spine icon, not its rows */
  const asSpine = el => el.classList.contains("spine") || +(el.dataset.fold || 0) > 0.5;

  const cols = [...strip.querySelectorAll(".col")];
  cols.forEach((col, i) => {
    const next = cols[i + 1] || document.getElementById("preview");
    if (!next) return;
    const cr = col.getBoundingClientRect(), nr = next.getBoundingClientRect();

    /* start: right edge of the selected pill, or the spine's icon when folded */
    let x1, y1;
    if (asSpine(col)) {
      const dot = col.querySelector(".dot").getBoundingClientRect();
      x1 = cr.right - fr.left; y1 = dot.top + dot.height / 2 - fr.top;
    } else {
      const selRow = col.querySelector(".row.sel");
      if (!selRow) return;
      const rr = selRow.getBoundingClientRect();
      const br = col.querySelector(".col-body").getBoundingClientRect();
      const cy = rr.top + rr.height / 2;
      if (cy < br.top + 2 || cy > br.bottom - 2) return;   /* scrolled out of view */
      x1 = rr.right - fr.left; y1 = cy - fr.top;
    }
    if (x1 < 0) return;   /* origin has slid off the left edge — no dangling hook */

    /* end: the next column's header — or its spine icon when that one is folded */
    const anchor = asSpine(next)
      ? next.querySelector(".dot") : next.querySelector(".col-head");
    const ar = anchor && anchor.getBoundingClientRect();
    const x2 = nr.left - fr.left;
    const y2 = ar ? ar.top + ar.height / 2 - fr.top : nr.top + 15 - fr.top;

    /* the vertical run bisects the gutter, not the pill-to-column span */
    const mx = (cr.right + nr.left) / 2 - fr.left;
    const r  = Math.min(6, Math.abs(y2 - y1) / 2, Math.abs(mx - x1), Math.abs(x2 - mx));
    const s  = Math.sign(y2 - y1) || 1;
    const dp = Math.abs(y2 - y1) < 1
      ? `M${x1},${y1} L${x2},${y2}`
      : `M${x1},${y1} L${mx - r},${y1} Q${mx},${y1} ${mx},${y1 + s*r}` +
        ` L${mx},${y2 - s*r} Q${mx},${y2} ${mx + r},${y2} L${x2},${y2}`;

    out += `<path class="${+col.dataset.i === focusCol ? "" : "thread"}" d="${dp}"/>`;
  });
  trail.innerHTML = out;
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Navigation

   Focus follows the *selection*, not the newly opened column: selecting a
   directory opens its column as a preview but keeps you where you are, so ↑/↓
   keep walking the current column. → is what moves you in, ← what moves out.
   ═══════════════════════════════════════════════════════════════════════════ */
/* How long a column may stay unopened while its directory is read. Long enough
   that a local read of any ordinary size lands first, short enough to pass for
   an instant response. */
const OPEN_GRACE = 50;

let navSeq = 0;   /* a read that outlives its selection must not repaint */

async function choose(colIdx, node, rowIdx) {
  const seq = ++navSeq;
  path = path.slice(0, colIdx + 1);
  sel  = sel.slice(0, colIdx);
  sel[colIdx] = node.name;
  cursor = { [colIdx]: rowIdx };
  focusCol = colIdx;
  path[colIdx].lastSel = node.name;   /* → returns to where you were last time */
  if (!node.dir) return void render();

  const reading = node.kids === null ? FS.ensureLoaded(node) : null;
  if (reading) {
    /* Highlight the row at once, but hold its column back for a moment: a
       column measures the names it holds, and one built before the read lands
       measures empty — it would open at the minimum width and jump wider a
       frame later. Most directories arrive well inside the grace; a slower one
       opens on the spinner, which is honest about the wait. */
    render();
    await Promise.race([reading, new Promise(r => setTimeout(r, OPEN_GRACE))]);
    if (seq !== navSeq) return;       /* selection moved on while it was read */
  }
  path.push(node);
  render();
  if (reading) {
    await reading;
    if (seq === navSeq && path.includes(node)) render();   /* still up? repaint */
  }
}

/* clicking a spine scrolls back just far enough to unfold it */
function unfoldTo(i) {
  finder.scrollTo({ left: Math.round(i * foldUnit() * range()), behavior: "smooth" });
}

function renderCrumbs() {
  const el = document.getElementById("crumbs");
  el.textContent = "";
  path.forEach((p, i) => {
    if (i) el.insertAdjacentHTML("beforeend", `<span class="crumb-sep">›</span>`);
    const b = document.createElement("span");
    b.className = "crumb" + (i === path.length - 1 ? " here" : "");
    b.textContent = p.name;
    b.onclick = () => { path = path.slice(0, i+1); sel = sel.slice(0, i); focusCol = i; render(); };
    el.appendChild(b);
  });
  document.getElementById("st-path").textContent =
    path.map(p => p.name).join(" / ") + (sel[path.length-1] ? " / " + sel[path.length-1] : "");
}

/* Entering a column: the row it was left on, else the one it remembers, else
   the first. The column may still be reading, so this can run twice. */
function enterColumn(i) {
  const c = colCache.get(path[i]);
  if (!c || !c.rows.length) return;
  let ri = cursor[i];
  if (ri == null) ri = c.kids.findIndex(k => k.name === path[i].lastSel);
  cursor[i] = ri = Math.max(0, Math.min(c.rows.length - 1, ri < 0 ? 0 : ri));
  c.rows[ri].click();
  c.rows[ri].scrollIntoView({ block: "nearest" });
}

/* Stepping right into a column that has no rows would move focus with nothing
   to highlight — the screen would not change, yet ↑/↓ would go dead. Stay put.
   columnFor rebuilds the column if it finished reading since the last render. */
function stepInto(node) {
  const i = path.indexOf(node);
  if (i < 0) return;                    /* moved on while it was still reading */
  if (!columnFor(node).rows.length) return;
  focusCol = i;
  enterColumn(i);
}

document.addEventListener("keydown", e => {
  if (!welcome.hidden) return;
  /* the cached column knows its rows — never re-query them, a directory can
     hold tens of thousands and this runs on every keystroke */
  const c = colCache.get(path[focusCol]);
  if (!c) return;
  const rows = c.rows;
  let ci = cursor[focusCol] ?? c.kids.findIndex(k => k.name === sel[focusCol]);
  if (ci < 0) ci = 0;

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!rows.length) return;
    /* a freshly entered column has a cursor but no selection yet — the first
       press should commit that row, not skip past it */
    if (sel[focusCol] !== undefined)
      ci = Math.max(0, Math.min(rows.length - 1, ci + (e.key === "ArrowDown" ? 1 : -1)));
    rows[ci].click();
    rows[ci].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Home" || e.key === "End") {
    e.preventDefault();
    if (!rows.length) return;
    const ri = e.key === "Home" ? 0 : rows.length - 1;
    rows[ri].click();
    rows[ri].scrollIntoView({ block: "nearest" });
  } else if (e.key === "ArrowRight" || e.key === "Enter") {
    e.preventDefault();
    const next = path[focusCol + 1];
    /* nothing open to the right: commit the cursor row, which opens it when it
       is a directory — a second → then steps into that column */
    if (!next) return void rows[ci]?.click();
    if (next.kids === null) FS.ensureLoaded(next).then(() => { render(); stepInto(next); });
    else stepInto(next);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (focusCol > 0) { focusCol--; if (folded > focusCol) unfoldTo(focusCol); render(true); }
  } else if (e.key === "Escape") {
    closeSettings();
  }
});
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Deep links — turning the selection into a path and back.

   Shared verbatim between the static build and the server build; only the
   ROUTER differs (a hash in one, a real URL path in the other). Everything
   here speaks in *names below the root*:

       path = [workspace, src, core]      →   ["src", "core", "state.js"]
       sel  = ["src", "core", "state.js"]

   The last segment is the selection in the deepest open column, which is the
   thing the address bar should name — a file when a file is selected, and the
   directory itself when one is open with nothing chosen inside it.
   ═══════════════════════════════════════════════════════════════════════════ */

/* render() runs on resize and on every keystroke, so writing the URL from it is
   only safe if an unchanged location is left alone — otherwise Back fills up
   with duplicates. applying is the re-entrancy guard: a URL being *read* must
   not be immediately re-written from the half-built state it produces. */
let applying = false;

function currentPath() {
  const names = path.slice(1).map(p => p.name);
  const leaf = sel[path.length - 1];
  if (leaf !== undefined) names.push(leaf);
  return names;
}

/* Walking a column with ↑/↓ is one selection change per keystroke — pushing a
   history entry for each would make Back useless. What counts as a navigation
   is *entering* a column, not opening one: selecting a folder opens its column
   without moving focus (that is the whole focus model), and ↑/↓ down a list of
   folders would otherwise push an entry per row. So the history key is the
   chain up to the focused column, and everything else rewrites in place.
   Back then steps back out of folders, which is what it looks like it does. */
let lastKey = null;

function syncURL() {
  if (applying || !ROUTER || !path.length) return;
  const key = path.slice(0, focusCol + 1).map(p => p.name).join("/");
  ROUTER.write({ root: path[0].name, path: currentPath() }, lastKey === key);
  lastKey = key;
}

/* Walk down from the root, opening each directory in turn. Stops at the first
   segment that is not there — a link into a folder that has since been renamed
   still gets you as far as it can rather than showing nothing. */
async function applyPath(names) {
  if (!path.length) return false;
  names = (names || []).filter(Boolean);

  /* a link to a dotfile has to reveal dotfiles, or visibleKids would hide the
     very thing the URL asked for */
  if (!state.dotfiles && names.some(n => n.startsWith("."))) {
    state.dotfiles = true;
    const b = document.getElementById("s-dot");
    if (b) b.setAttribute("aria-checked", "true");
  }

  applying = true;
  try {
    const rootNode = path[0];
    path = [rootNode]; sel = []; cursor = { 0: 0 }; focusCol = 0;
    await FS.ensureLoaded(rootNode);
    let complete = true;

    for (let i = 0; i < names.length; i++) {
      const parent = path[i];
      const kids = visibleKids(parent);
      const ri = kids.findIndex(k => k.name === names[i]);
      if (ri < 0) { complete = false; break; }

      const node = kids[ri];
      sel[i] = node.name;
      cursor[i] = ri;
      focusCol = i;                  /* focus stays on the column holding it */
      parent.lastSel = node.name;
      if (!node.dir) break;
      await FS.ensureLoaded(node);
      path.push(node);
    }
    return complete;
  } finally {
    applying = false;
    render();
    scrollCursorIntoView();
  }
}

/* A restored selection can be thousands of rows down a column; the row exists
   but nothing has ever scrolled to it. */
function scrollCursorIntoView() {
  for (let i = 0; i < path.length; i++) {
    const c = colCache.get(path[i]);
    const ri = cursor[i];
    if (c && ri != null && c.rows[ri]) c.rows[ri].scrollIntoView({ block: "nearest" });
  }
}

/* Wire Back/Forward once a root is mounted — and only once, however many roots
   are opened after it, or one Back would replay through every listener. */
let routing = false;

function startRouting() {
  if (routing || !ROUTER) return;
  routing = true;
  ROUTER.onNavigate(loc => {
    /* Only the path is honoured: a Back that lands on a different root cannot
       remount it without a user gesture, so it would silently walk the wrong
       tree. Leaving the columns where they are is the honest outcome. */
    if (loc && (!loc.root || loc.root === path[0]?.name)) applyPath(loc.path);
  });
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Settings popover
   ═══════════════════════════════════════════════════════════════════════════ */
const gear = document.getElementById("gear"), panel = document.getElementById("settings");
const closeSettings = () => { panel.hidden = true; gear.setAttribute("aria-expanded", "false"); };
gear.onclick = e => {
  e.stopPropagation();
  panel.hidden = !panel.hidden;
  gear.setAttribute("aria-expanded", String(!panel.hidden));
};
document.addEventListener("click", e => { if (!panel.contains(e.target)) closeSettings(); });

const toggle = (id, get, set) => {
  const b = document.getElementById(id);
  b.onclick = () => { set(!get()); b.setAttribute("aria-checked", String(get())); render(true); };
  b.setAttribute("aria-checked", String(get()));
};
toggle("s-dot",     () => state.dotfiles,                    v => state.dotfiles = v);
toggle("s-density", () => root.dataset.density === "compact",
                    v => root.dataset.density = v ? "compact" : "comfortable");
toggle("s-theme",   () => root.dataset.theme === "dark",
                    v => root.dataset.theme = v ? "dark" : "light");
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Filesystem adapter — File System Access API, read-only, one level at a time.

   Fills the FS port (see core/ports.js). Nodes carry the handle they came
   from; nothing else in the app ever touches it.
   ═══════════════════════════════════════════════════════════════════════════ */
const fsaNode = (name, handle) => ({
  name, handle,
  dir: handle.kind === "directory",
  kids: handle.kind === "directory" ? null : undefined,
});

const FSA = {
  node: fsaNode,

  async ensureLoaded(node) {
    if (!node.dir || node.kids !== null) return;
    if (node.loading) return node.loading;        /* debounce concurrent calls */
    node.loading = (async () => {
      const kids = [];
      try {
        for await (const [name, handle] of node.handle.entries()) kids.push(fsaNode(name, handle));
      } catch (err) {
        node.denied = err.name === "NotAllowedError" ? "No permission to read" : String(err.message || err);
      }
      node.kids = kids;
      node.loading = null;
    })();
    return node.loading;
  },

  /* File metadata is a separate round-trip per file — only fetched on preview. */
  async loadMeta(node) {
    if (node.dir || node.meta) return;
    try {
      const file = await node.handle.getFile();
      node.meta = { size: file.size, mod: file.lastModified, type: file.type };
      node.file = file;
    } catch (err) {
      node.meta = { error: String(err.message || err) };
    }
  },

  /* The preview providers read bytes through this, so they never need to know
     whether the node came from a handle or a URL. */
  async blob(node) {
    await FSA.loadMeta(node);
    return node.file || null;
  },
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Preview provider — in-browser, zero dependencies.

   Fills the PREVIEW port (see core/ports.js). Everything here works from the
   bytes alone, so it costs nothing in the bundle and works with no network:

     images   → object URL
     PDF      → object URL in an <iframe>; Chromium renders it natively, so a
                PDF viewer is not something this has to carry
     .desktop → the same link card the server build shows, parsed in 20 lines
     text     → escaped <pre>, clipped

   Rich rendering (Markdown, syntax highlighting, docx, pptx) is a *different
   provider*, not a bigger version of this one: see preview-http.js for the
   server-rendered variant, and the "full" build profile for a bundled one.
   ═══════════════════════════════════════════════════════════════════════════ */
const TEXT_RE = /\.(txt|md|markdown|log|json|jsonc|ya?ml|toml|ini|cfg|conf|csv|tsv|xml|svg|html?|css|scss|less|js|mjs|cjs|jsx|ts|tsx|py|rb|rs|go|java|kt|c|h|cpp|hpp|cs|sh|bash|zsh|fish|sql|nix|lua|php|pl|swift|r|tex|gitignore|env)$/i;
const IMG_RE  = /\.(png|jpe?g|gif|webp|avif|bmp|ico|svg)$/i;
const TEXT_MAX = 512 * 1024, TEXT_CHARS = 8000;

let pvURL = null;

/* .desktop is an INI file; only Type=Link entries have anything to show. */
function desktopCard(text) {
  const e = {};
  let inEntry = false;
  for (const line of text.split(/\r?\n/)) {
    const s = line.trim();
    if (s.startsWith("[")) { inEntry = s === "[Desktop Entry]"; continue; }
    if (!inEntry || !s || s.startsWith("#")) continue;
    const i = s.indexOf("=");
    if (i > 0) e[s.slice(0, i).trim()] = s.slice(i + 1).trim();
  }
  if (e.Type !== "Link" || !e.URL) return null;
  const url = esc(e.URL);
  return `<div class="pv-link">
      <h3>${esc(e.Name || "")}</h3>
      ${e.Comment ? `<p class="sub">${esc(e.Comment)}</p>` : ""}
      <p>🔗 <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a></p>
    </div>`;
}

const PreviewLocal = {
  revoke() { if (pvURL) { URL.revokeObjectURL(pvURL); pvURL = null; } },

  async render(node) {
    const blob = await FS.blob(node);
    if (!blob) return null;

    if (IMG_RE.test(node.name)) {
      pvURL = URL.createObjectURL(blob);
      return `<img class="pv-img" src="${pvURL}" alt="">`;
    }
    if (/\.pdf$/i.test(node.name)) {
      pvURL = URL.createObjectURL(blob.slice(0, blob.size, "application/pdf"));
      return `<iframe class="pv-pdf" src="${pvURL}" title="${esc(node.name)}"></iframe>`;
    }
    if (/\.desktop$/i.test(node.name) && blob.size <= TEXT_MAX)
      return desktopCard(await blob.text()) ?? null;

    if (TEXT_RE.test(node.name) && blob.size <= TEXT_MAX) {
      const text = await blob.slice(0, TEXT_MAX).text();
      const clipped = text.length > TEXT_CHARS;
      return `<pre class="pv-text">${esc(text.slice(0, TEXT_CHARS))}${clipped ? "\n…" : ""}</pre>`;
    }
    return null;
  },
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Router — the fragment, for the static build.

       #r=workspace&p=src/core/state.js

   A hash and not a query string, because the static build has to survive being
   opened from anywhere: a `file://` page, a bare `python3 -m http.server`, a
   gist, a USB stick. A path-shaped URL needs a server that rewrites; a query
   string needs one that ignores it. A hash needs nothing.

   `r` names the *root folder*, and it has to be there because a
   FileSystemDirectoryHandle is not a path: the URL cannot name a folder the
   browser has not already granted. It is matched against the remembered roots
   in IndexedDB, so a link only re-opens a folder you have opened before — by
   design, since the alternative would be a page that can name arbitrary
   directories on your disk. Folder *names* are what is matched, so two
   different folders with the same basename resolve to the more recent one.
   ═══════════════════════════════════════════════════════════════════════════ */
const encSeg = s => encodeURIComponent(s).replace(/%2F/gi, "%2F");

/* A file:// page has an opaque origin and pushState throws SecurityError on it.
   That page cannot open a folder either (see showBlocked), so there is nothing
   to address — but the test suite does mount a fake tree there, and a throw on
   every render would be fatal. Fail once, then stay quiet. */
let dead = false;

const RouterHash = {
  read() {
    const h = location.hash.replace(/^#/, "");
    if (!h) return null;
    const q = new URLSearchParams(h);
    const p = q.get("p") || "";
    return {
      root: q.get("r") || null,
      path: p.split("/").filter(Boolean).map(decodeURIComponent),
    };
  },

  write({ root, path }, replace) {
    if (dead) return;
    const q = "#r=" + encSeg(root) + (path.length ? "&p=" + path.map(encSeg).join("/") : "");
    if (q === location.hash) return;
    /* history.*State, not an assignment to location.hash: assigning always
       pushes, and it fires hashchange, which would loop straight back in
       through onNavigate. */
    try { history[replace ? "replaceState" : "pushState"](null, "", q); }
    catch (err) { dead = true; }
  },

  onNavigate(cb) {
    addEventListener("hashchange", () => cb(RouterHash.read()));
  },
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Remembering folders across sessions.

   FileSystemHandle is structured-cloneable, so the picked roots survive in
   IndexedDB and the OS folder dialog is not needed twice for the same folder.
   What does NOT survive is the *permission*: Chrome usually downgrades it to
   "prompt" when the tab session ends, and requestPermission() needs a user
   gesture. So a remembered folder is either re-mounted silently (still
   'granted') or offered as a one-click button on the welcome screen.
   ═══════════════════════════════════════════════════════════════════════════ */
const RECENT_MAX = 8;

const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open("filemill", 1);
  r.onupgradeneeded = e => e.target.result.createObjectStore("kv");
  r.onsuccess = e => res(e.target.result);
  r.onerror   = e => rej(e.target.error);
});

const kvGet = (db, key) => new Promise((res, rej) => {
  const r = db.transaction("kv", "readonly").objectStore("kv").get(key);
  r.onsuccess = () => res(r.result);
  r.onerror   = () => rej(r.error);
});

const kvPut = (db, key, value) =>
  db.transaction("kv", "readwrite").objectStore("kv").put(value, key);

async function rememberRoot(handle) {
  try {
    const db = await idb();
    const kept = [];
    for (const h of (await kvGet(db, "recent")) || [])
      if (!(await h.isSameEntry(handle))) kept.push(h);   /* same folder, one entry */
    kvPut(db, "recent", [handle, ...kept].slice(0, RECENT_MAX));
  } catch (err) { console.warn("could not remember folder:", err); }
}

async function recallRoots() {
  try {
    const db = await idb();
    return (await kvGet(db, "recent")) || [];
  } catch (err) { return []; }         /* private mode, file://, … — just ask */
}

async function forgetRoots() {
  try { kvPut(await idb(), "recent", []); } catch (err) { /* nothing to forget */ }
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Static build — boot, folder picker, welcome screen.

   The only file that knows this is the local-folder flavour of the app. It
   picks the adapters (fsa + preview-local + router-hash, all loaded before
   this) and owns the one entry point into the tree, mount().
   ═══════════════════════════════════════════════════════════════════════════ */

/* Adapters define themselves; the app entry is what chooses. Selecting here
   rather than at the bottom of each adapter file means a page may load more
   than one of them — which the server build does — without script order
   silently deciding which wins. */
useFilesystem(FSA);
usePreview(PreviewLocal);
useRouter(RouterHash);

/* A deep link read at startup, held until a root is mounted that can satisfy
   it — the URL names a folder, but a folder is not browsable until the browser
   has granted it. */
let pendingLoc = null;

async function mount(handle, loc) {
  const node = FS.node(handle.name, handle);
  colCache.clear();
  path = [node]; sel = []; focusCol = 0; cursor = { 0: 0 };
  welcome.hidden = true;
  document.title = handle.name + " — filemill";
  render();
  await FS.ensureLoaded(node);

  const want = loc ?? takePending(handle.name);
  if (want && want.path.length) await applyPath(want.path);
  else render();
  startRouting();
}

/* A pending link only applies to the root it named — mounting some other folder
   must not try to walk that folder's path into it. */
function takePending(rootName) {
  const p = pendingLoc;
  pendingLoc = null;
  return p && (!p.root || p.root === rootName) ? p : null;
}

async function pickFolder() {
  if (!window.showDirectoryPicker) return showBlocked("unsupported");
  try {
    const handle = await window.showDirectoryPicker({ mode: "read", id: "filemill" });
    await rememberRoot(handle);
    await mount(handle);
  } catch (err) {
    if (err.name === "AbortError") return;
    /* Chrome refuses the picker on an opaque origin — i.e. a file:// page */
    if (err.name === "SecurityError") return showBlocked("file");
    console.error(err);
  }
}

/* Opening a remembered folder. 'granted' mounts straight away; anything else
   needs requestPermission(), which is only allowed from this click. */
async function openRemembered(handle) {
  const perm = await handle.queryPermission({ mode: "read" });
  if (perm === "granted" || await handle.requestPermission({ mode: "read" }) === "granted")
    return mount(handle);
}

function renderRecents(handles) {
  const box = document.getElementById("w-recent");
  const list = box.querySelector(".rec-list");
  list.textContent = "";
  handles.forEach(h => {
    const b = document.createElement("button");
    b.className = "rec";
    b.innerHTML = `<svg viewBox="0 0 16 16" aria-hidden="true">${FOLDER_PATH}</svg>`;
    b.appendChild(document.createTextNode(h.name));
    b.onclick = () => openRemembered(h);
    list.appendChild(b);
  });
  box.hidden = !handles.length;
}

/* Both failure modes end at the welcome screen, since there is nothing to show
   without a folder. Keep the wording actionable — the fix differs per case. */
function showBlocked(why) {
  welcome.hidden = false;
  document.getElementById("w-pick").hidden = why === "unsupported";
  document.getElementById("w-recent").hidden = true;
  document.getElementById("w-msg").innerHTML = why === "unsupported"
    ? "This browser has no File System Access API, so local folders cannot be opened. " +
      "Try Chrome, Edge or another Chromium-based desktop browser."
    : "Chrome blocks folder access on <code>file://</code> pages. Serve this file over " +
      "localhost instead:<br><code>python3 -m http.server -d " +
      "&lt;folder containing index.html&gt;</code><br>then open " +
      "<code>http://localhost:8000/index.html</code>.";
}

document.getElementById("open").onclick = pickFolder;
document.getElementById("w-pick").onclick = pickFolder;

(async function start() {
  if (!window.showDirectoryPicker) return showBlocked("unsupported");
  if (location.protocol === "file:") return showBlocked("file");

  pendingLoc = ROUTER.read();
  const handles = await recallRoots();
  if (!handles.length) return;

  /* A link names its root, so prefer that folder over the most recent one —
     otherwise reopening a bookmark would silently browse the wrong tree. */
  const wanted = pendingLoc?.root
    ? handles.find(h => h.name === pendingLoc.root) : null;
  const first = wanted || handles[0];

  /* queryPermission needs no gesture, so a folder still granted from an earlier
     visit opens with no dialog at all */
  if (await first.queryPermission({ mode: "read" }) === "granted") return mount(first);
  renderRecents(handles);
})();

document.fonts.ready.then(() => render(true));
</script>
</body>
