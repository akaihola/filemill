# Test both editions, then publish the static one to GitHub Pages.
#
# Pages is the natural home for this deliverable, and not only because it is one
# static file: `showDirectoryPicker()` requires a secure context, so a
# downloaded index.html opened from disk shows the "serve me over localhost"
# screen instead of a folder picker. An https:// page just works — which makes
# "browse a folder on your own machine, install nothing" a single link.
#
# Nothing published here can read anything: the app has no backend, and the
# folder is only ever read in the visitor's browser, after they grant it.

name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new run supersedes an older one of the same ref only, so a pull request
# cannot cancel main or another pull request. Only main publishes, and its
# runs share one group, which keeps Pages deployments serialized.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          prune-cache: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.6.8

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Check the shared UI
        run: |
          test "$(deno --version | head -1)" = "deno 2.6.8 (stable, release, x86_64-unknown-linux-gnu)"
          deno fmt --check ui/
          deno lint ui/
          deno run --allow-read=ui/core/model ui/core/model/test.mjs

      # index.html is generated from ui/ and committed, so it can go stale
      # without anything else noticing — and a stale one would be published.
      # The server edition needs no matching check: ui/ is a symlink into its
      # package, so there is no second copy that could drift.
      - name: The committed bundle matches ui/
        run: ./build-index.py --check
        working-directory: static

  test:
    needs: lint
    runs-on: ubuntu-latest
    name: Test ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: static-bundle
            command: uv run --project server pytest static --durations=20
            directory: .
          - suite: static-development
            command: uv run --project server pytest static --dev --durations=20
            directory: .
          - suite: server
            command: uv run pytest --cov=src/filemill --cov-branch --cov-report=term-missing --durations=20
            directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          prune-cache: true

      # The tests run under `uv run --project server`, so the browsers must be
      # the ones that project's locked Playwright asks for. A pip install of a
      # version pinned here once drifted from the lock and lost every browser
      # test at BrowserType.launch ("Executable doesn't exist").
      #
      # `playwright install` is correct here and forbidden on the NixOS dev
      # machines, where the browsers come from the store and the pinned version
      # has to match them — see AGENTS.md.
      - name: Install the locked Playwright's browsers
        run: uv run --project server playwright install --with-deps chromium

      # The server shells out to ripgrep for content search; the runner image
      # does not ship it, and without it every search test gets a 503.
      - name: Install ripgrep
        if: matrix.suite == 'server'
        run: sudo apt-get install -y ripgrep

      # The same ui/, driven against a real server — this is what would catch a
      # change that suits one project and breaks the other.
      - name: Run ${{ matrix.suite }} suite
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

  publish:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Only the one file. Nothing under ui/ is needed at runtime — that is the
      # point of the bundle — and shipping it would invite links to the unbuilt
      # entry point, which loads a dozen separate scripts.
      - name: Collect the bundle
        run: |
          mkdir -p _site
          cp static/index.html _site/index.html
          cp static/manifest.json static/sw.js static/icon-192.png static/icon-512.png static/icon.svg _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
