repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --project server ruff check server
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uv run --project server ruff format --check server/src server/tests
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --project server mypy --disable-error-code import-untyped --disable-error-code attr-defined server/src
        language: system
        pass_filenames: false
      - id: deno-fmt
        name: deno fmt
        entry: deno fmt --check ui/
        language: system
        pass_filenames: false
      - id: deno-lint
        name: deno lint
        entry: deno lint ui/
        language: system
        pass_filenames: false
      - id: build-index
        name: build-index.py --check
        entry: static/build-index.py --check
        language: system
        pass_filenames: false
