[project]
name = "filemill"
version = "0.1.0"
description = "Filemill — a Miller-columns file explorer and previewer, served locally"
requires-python = ">=3.12"
dependencies = [
    "python-fasthtml>=0.12",
    "markdown-it-py",
    "mdit-py-plugins",
    "pygments",
    "mammoth",
    "python-pptx",
    "typer",
    "linkify-it-py>=2.1.0",
]

[project.scripts]
filemill = "filemill.cli:entry_point"

[build-system]
requires = ["uv_build>=0.6.6,<0.7"]
build-backend = "uv_build"

# ../ui is a symlink to src/filemill/ui: the shared frontend lives inside the
# package because a wheel cannot reach outside itself at runtime. The static
# edition's entry module and the two adapters only it imports stay out of the
# wheel; everything ui/entry-server.js reaches must be in it, because one
# missing module fails the whole import graph. preview-rich.js is in that graph
# (app-http.js takes withPptxPreview from it), so it ships — its CDN fetch only
# happens when a rich renderer is asked for, which the server edition never
# does; tests/test_browser_new_ui.py::test_nothing_is_fetched_from_a_cdn checks.
# The excluded files remain in the sdist, which is the whole source tree.
[tool.uv.build-backend]
wheel-exclude = [
    "ui/entry-static.js",
    "ui/adapters/app-fsa.js",
    "ui/adapters/router-hash.js",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.11",
    "mypy>=1.15",
    # Pinned, not floored. A Playwright release carries one browser revision, and
    # the Nix bundle at $PLAYWRIGHT_BROWSERS_PATH carries one too: chromium-1228
    # and chromium_headless_shell-1228. Only 1.61.x matches. Measured on this
    # host: 1.57.0 asks for chromium_headless_shell-1200 and 1.62.0 asks for
    # 1234, and both die at BrowserType.launch with "Executable doesn't exist at
    # ..." plus a banner telling you to run `playwright install`. Do not run it;
    # it would download a revision Nix already provides. Re-pin instead:
    #   uv lock --upgrade-package "$(grep -E '^playwright[=<>~!]' "$UV_CONSTRAINT")"
    "playwright~=1.61.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# The preview/VFS pipelines deliberately catch Exception per file: one unreadable
# or malformed document must degrade to a "Preview error" card, never take down
# the route that was listing a directory. That is the design, not an oversight.
ignore = ["BLE001"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that launch a real browser or server process",
]
