[project]
name = "filemill"
version = "0.1.0"
description = "Filemill — a Miller-columns file explorer and previewer, served locally"
requires-python = ">=3.12"
dependencies = [
    "starlette",
    "uvicorn",
    "pygments",
    "docutils",
    "typer",
    # providers/archive.py uses compression.zstd on Python 3.14+, otherwise
    # this package (b91a3d8c). The reason for the 0.23 floor is unverified.
    "zstandard>=0.23 ; python_full_version < '3.14'",
]

[project.scripts]
filemill = "filemill.cli:entry_point"

[build-system]
# Unchanged since 26d515b9: permits 0.6.x from 0.6.6 and excludes 0.7+.
# The compatibility reasons for both endpoints are unverified; this is not
# evidence of testing at the minimum or of a known failure with 0.7.
requires = ["uv_build>=0.6.6,<0.7"]
build-backend = "uv_build"

# ../ui is a symlink to src/filemill/ui: the shared frontend lives inside the
# package because a wheel cannot reach outside itself at runtime. The static
# edition's entry module and the two adapters only it imports stay out of the
# wheel; everything ui/entry-server.js reaches must be in it, because one
# missing module fails the whole import graph. preview-rich.js renders Markdown
# and .docx in this edition too, from the pinned modules in ui/vendor/, which
# therefore ship as well for browser-side rich previews.
# tests/test_browser_new_ui.py::test_nothing_is_fetched_from_a_cdn checks that
# every other preview stays local.
# The excluded files remain in the sdist, which is the whole source tree.
[tool.uv.build-backend]
wheel-exclude = [
    "ui/entry-static.js",
    "ui/entry-native.js",
    "ui/adapters/app-native.js",
    "ui/adapters/native.js",
    "ui/adapters/app-fsa.js",
    "ui/adapters/router-hash.js",
]

[dependency-groups]
# Floors, not exact pins. pytest/httpx/pytest-cov appear in eec53713 and were
# inherited in e01a40b4. Ruff/mypy were added in 3b9ca9d1, PyYAML in 2a9944c3,
# pytest-asyncio in 587752b4. Those changes do not establish why the minimums are
# required. Their compatibility rationale and minimum-version testing are
# unverified. uv.lock selects the versions used by the development environment.
dev = [
    "pytest>=8",
    "python-pptx",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.11",
    "mypy>=1.15",
    # mypy checks the compatibility import even on Python 3.14.
    "zstandard>=0.23",
    # Pin Playwright so tests use a reproducible browser revision. Managed
    # bundles selected by PLAYWRIGHT_BROWSERS_PATH must match this release.
    "playwright~=1.63.0",
    "pyyaml>=6",
    "pytest-asyncio>=1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# The preview/VFS pipelines deliberately catch Exception per file: one unreadable
# or malformed document must degrade to a "Preview error" card, never take down
# the route that was listing a directory. That is the design, not an oversight.
ignore = ["BLE001"]

[tool.mypy]
ignore_missing_imports = true
