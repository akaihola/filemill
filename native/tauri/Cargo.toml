[package]
name = "filemill-tauri-comparison"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
base64 = "0.22"
tauri = { version = "2", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
