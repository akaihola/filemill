[tool.uv.workspace]
members = ["server"]

[dependency-groups]
# Mirrors the server development tools in the shared workspace (587752b4).
# See server/pyproject.toml for constraint evidence and unverified minimums.
dev = [
    "filemill",
    "pytest>=8",
    "pytest-xdist>=3",
    "python-pptx",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.11",
    "mypy>=1.15",
    # mypy checks the compatibility import even on Python 3.14.
    "zstandard>=0.23",
    # server/pyproject.toml owns the Playwright pin in the shared lock.
    "playwright",
    "pyyaml>=6",
    "pytest-asyncio>=1",
    "types-docutils>=0.23.0.20260923",
    "types-pygments>=2.21.0.20260819",
]

[tool.uv.sources]
filemill = { workspace = true }
