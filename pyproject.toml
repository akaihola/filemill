[tool.uv.workspace]
members = ["server"]

[dependency-groups]
dev = [
    "filemill",
    "pytest>=8",
    "python-pptx",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.11",
    "mypy>=1.15",
    # mypy checks the compatibility import even on Python 3.14.
    "zstandard>=0.23",
    # server/pyproject.toml owns the Playwright pin in the shared lock.
    "playwright",
    "pyyaml>=6",
    "pytest-asyncio>=1",
]

[tool.uv.sources]
filemill = { workspace = true }
