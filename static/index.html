   history entry for each would make Back useless. What counts as a navigation
   is *entering* a column, not opening one: selecting a folder opens its column
   without moving focus (that is the whole focus model), and ↑/↓ down a list of
   folders would otherwise push an entry per row. So the history key is the
   chain up to the focused column, and everything else rewrites in place.
   Back then steps back out of folders, which is what it looks like it does. */
let lastKey = null;

function syncURL() {
  if (applying || !ROUTER || !path.length) return;
  const key = path.slice(0, focusCol + 1).map((p) => p.name).join("/");
  const names = currentPath();
  const node = previewNode();
  const view = node && !node.dir
    ? document.documentElement.dataset.filemill === "highlight"
      ? "highlight"
      : "render"
    : undefined;
  ROUTER.write({ root: path[0].name, path: names, view }, lastKey === key);
  lastKey = key;
}

/* Walk down from the root, opening each directory in turn. Stops at the first
   segment that is not there — a link into a folder that has since been renamed
   still gets you as far as it can rather than showing nothing. Returns whether
   every segment was found, which is how a caller learns the chain was cut.

   `wantFocus` is for the callers that already know where the user was looking:
   a refresh must not move focus to the deepest column just because it re-walked
   the chain to get there. A link has no such opinion and omits it. */
async function applyPath(names, wantFocus) {
  if (!path.length) return false;
  names = (names || []).filter(Boolean);

  /* a link to a dotfile has to reveal dotfiles, or visibleKids would hide the
     very thing the URL asked for */
  if (!state.dotfiles && names.some((n) => n.startsWith("."))) {
    state.dotfiles = true;
    const b = document.getElementById("s-dot");
    if (b) b.setAttribute("aria-checked", "true");
  }

  applying = true;
  try {
    const rootNode = path[0];
    setState({ path: [rootNode], sel: [], focusCol: 0 });
    await FS.ensureLoaded(rootNode);
    let complete = true;

    for (let i = 0; i < names.length; i++) {
      const parent = path[i];
      const kids = visibleKids(parent);
      const ri = kids.findIndex((k) => k.name === names[i]);
      if (ri < 0) {
        complete = false;
        break;
      }

      const node = kids[ri];
      sel[i] = node.name;
      setState({ focusCol: i }); /* focus stays on the column holding it */
      if (!node.dir) break;
      await FS.ensureLoaded(node);
      path.push(node);
    }
    return complete;
  } finally {
    applying = false;
    /* clamped: the chain may have come back shorter than the column that had
       focus, and focusing a column that is no longer open kills ↑/↓ */
    if (wantFocus != null) {
      setState({ focusCol: Math.max(0, Math.min(wantFocus, path.length - 1)) });
    }
    renderPage();
    scrollCursorIntoView();
  }
}

/* A restored selection can be thousands of rows down a column; the row exists
   but nothing has ever scrolled to it. */
function scrollCursorIntoView() {
  for (let i = 0; i < path.length; i++) {
    const c = colCache.get(path[i]);
    const ri = rowIndex(path[i], sel[i]);
    if (c && ri != null && c.rows[ri]) revealRow(c.rows[ri]);
  }
}

/* Wire Back/Forward once a root is mounted — and only once, however many roots
   are opened after it, or one Back would replay through every listener. */
let routing = false;

function startRouting() {
  if (routing || !ROUTER) return;
  routing = true;
  ROUTER.onNavigate((loc) => {
    /* Only the path is honoured: a Back that lands on a different root cannot
       remount it without a user gesture, so it would silently walk the wrong
       tree. Leaving the columns where they are is the honest outcome. */
    if (loc && (!loc.root || loc.root === path[0]?.name)) applyPath(loc.path);
  });
}

/* ═══ core/limits.js ═══ */
const TEXT_MAX = 512 * 1024;
const IMAGE_EXTENSIONS = [
  "png",
  "jpe?g",
  "gif",
  "webp",
  "avif",
  "bmp",
  "ico",
  "svg",
];

/* ═══ core/render.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════════════════════════════ */

/* Building a column is O(entries), and real directories hold thousands of them
   — far too expensive to redo on every arrow key. A column's DOM is therefore
   built once per (node, entry list) and cached; a re-render only re-applies the
   state that actually changed: depth, selection, width.
   Anything that alters how a row *looks* (dotfile filter, density, theme icon
   colours) is part of the signature and drops the whole cache. */
const colCache = new Map();
let cacheSig = null;
const CACHE_MAX = 24; // Retain enough nearby columns without growing memory unbounded.
const COLUMN_WIDTH_RATIO = 2 / 3; // Leave room for adjacent columns on narrow screens.
const MAX_DEPTH = 5; // Keep depth styling within the available visual scale.
const SCROLL_HINT_PADDING = 4; // Show the affordance only when content exceeds the viewport.
const EDIT_MAX = TEXT_MAX;
const EDIT_MAX_LINE = 10_000; // Avoid unusably wide editor lines.

/* Writing the value a property already holds still dirties it — and a width or
   custom-property write on a column relays out every row inside it. Guard the
   writes and a re-render of an unchanged column costs nothing. */
let actions;
const setActions = (value) => actions = value;

function buildCol(node) {
  const kids = visibleKids(node);
  const el = document.createElement("div");
  el.className = "col";
  el.innerHTML = `
    <div class="col-head">
      <span class="name"><span>${esc(node.name)}</span></span>
      <span class="count">${node.kids === null ? "" : kids.length}</span>
      <button class="rf" tabindex="-1" title="Re-read this folder (F5)"
              aria-label="Refresh ${esc(node.name)}">⟳</button>
    </div>
    <div class="col-body"></div>
    <div class="spine-label" title="${esc(node.name)} — click to unfold">
      <span class="dot"></span>
      <span class="txt">${esc(node.name)}</span>
    </div>`;

  const body = el.querySelector(".col-body");
  if (node.kids === null) {
    body.innerHTML =
      `<div class="col-note"><span class="spinner"></span>Reading…</div>`;
  } else if (node.denied) {
    body.innerHTML = `<div class="col-note">⚠ ${esc(node.denied)}</div>`;
  } else if (!kids.length) {
    body.innerHTML = `<div class="col-note">Empty</div>`;
  }
  if (node.pages > 1) {
    const pager = document.createElement("div");
    pager.className = "pager";
    pager.innerHTML =
      `<button type="button" aria-label="Previous page">‹</button>
      <span>Page ${node.page} of ${node.pages}</span>
      <button type="button" aria-label="Next page">›</button>`;
    const [prev, next] = pager.querySelectorAll("button");
    prev.disabled = node.page === 1;
    next.disabled = node.page === node.pages;
    prev.onclick = (e) => {
      e.stopPropagation();
      FS.loadPage(node, node.page - 1);
    };
    next.onclick = (e) => {
      e.stopPropagation();
      FS.loadPage(node, node.page + 1);
    };
    el.appendChild(pager);
  }
  /* a folded column hides its rows, so the click lands on the column itself —
     that is what makes the advertised "click a spine to unfold" work */
  el.onclick = () => {
    if (el.classList.contains("spine")) actions.unfoldTo(+el.dataset.i);
  };
  /* Read the index off the element for the same reason a row does: the node
     keeps its DOM across re-renders, and only render time knows its column.
     stopPropagation, or a ⟳ on a folded spine would unfold it instead. */
  el.querySelector(".rf").onclick = (e) => {
    e.stopPropagation();
    actions.refreshColumn(+el.dataset.i);
  };

  const rows = kids.map((k, ri) => {
    const [stem, ext] = splitName(k.name);
    const row = document.createElement("div");
    row.className = "row" + (k.name.startsWith(".") ? " dotfile" : "");
    row.title = k.name; /* the full name is always one hover away */
    row.setAttribute("aria-label", k.name);
    row.innerHTML = iconHTML(k) +
      `<span class="label"><span class="stem">${
        esc(stem)
      }</span><span class="dim">${esc(ext)}</span></span>` +
      (k.dir ? `<span class="chev">›</span>` : "");
    /* read the index off the element: the same node keeps its DOM across
       re-renders, and its column position is only known at render time */
    row.onclick = () => actions.choose(+el.dataset.i, k);
    body.appendChild(row);
    return row;
  });
  body.onscroll = paintTrail;

  return {
    el,
    body,
    kids,
    rows,
    kidsRef: node.kids,
    metaRef: !!node.metaDone,
    dot: el.querySelector(".dot"),
    width: measure(node),
  };
}

function columnFor(node) {
  let c = colCache.get(node);
  /* Two ways this DOM stops being the column: the directory was re-read, or a
     metadata sweep landed and re-ordered the rows under it. Same test, one
     field along. */
  if (c && (c.kidsRef !== node.kids || c.metaRef !== !!node.metaDone)) c = null;
  if (!c) c = buildCol(node);
  colCache.delete(node); /* re-insert = most recently used */
  colCache.set(node, c);
  for (const k of colCache.keys()) {
    if (colCache.size <= CACHE_MAX) break;
    if (!path.includes(k)) colCache.delete(k);
  }
  return c;
}

function render(keepScroll) {
  if (!path.length) return;
  const sig =
    `${state.dotfiles}|${root.dataset.density}|${root.dataset.theme}` +
    `|${state.sort.key}|${state.sort.desc}`;
  if (sig !== cacheSig) {
    colCache.clear();
    cacheSig = sig;
  }

  setState({ widths: [] });
  const cols = path.map((node, i) => {
    /* Before columnFor, so a directory that needs no fetch — the server build,
       or one a preview has already read — is built once in the sorted order
       rather than built and rebuilt. */
    sweepMeta(node);
    const c = columnFor(node);
    const selectedRow = rowIndex(node, sel[i]);
    /* No column may be wider than two-thirds of the live finder. The fold cap keeps the
       touched column unfolded and applyScroll's pan slides it into view, but
       neither can show a full-width column on a narrow phone —
       the row would still lose its right edge. Clamped here rather than in
       measure() because columnFor caches the built column: a width measured
       against the old viewport would survive a rotation, while `widths` is
       rebuilt by every render, including the one `resize` fires.

       Measured against #finder, not #stage, because the stage is one render
       behind: its width is `--stage-w`, which layout() writes *after* this
       loop has already chosen the widths. Turning a phone from 568 px to 375
       therefore clamped this render against 568 — oversized columns on a 375 px
       screen, and the pan can only choose which edge to lose, so the tapped
       row sat 10 px past the right one until the next render healed it.
       #finder is `flex: 1` in the viewport, so it is the live number, and it
       is the one layout() reads to set --stage-w in the first place. */
    const w = Math.min(
      c.width,
      Math.floor(finder.clientWidth * COLUMN_WIDTH_RATIO),
    );
    widths.push(w);

    /* `sorting` goes in the class string rather than on classList, because this
       write replaces the whole attribute and would drop it a frame later. */
    set(
      c.el,
      "className",
      "col " +
        (i < focusCol ? "ancestor" : i > focusCol ? "descendant" : "focus") +
        (node.metaLoading ? " sorting" : ""),
    );
    set(
      c.el.dataset,
      "depth",
      String(Math.min(MAX_DEPTH, Math.max(0, focusCol - i))),
    );
    set(c.el.dataset, "i", String(i));
    set(c.el.style, "width", w + "px");

    if (c.dotFor !== sel[i]) {
      /* spine icon of the chosen child */
      const chosen = c.kids.find((k) => k.name === sel[i]);
      c.dot.innerHTML = chosen ? iconHTML(chosen) : "";
      c.dotFor = sel[i];
    }
    c.rows.forEach((row, ri) => {
      row.classList.toggle("sel", c.kids[ri].name === sel[i]);
      row.classList.toggle("cursor", i === focusCol && selectedRow === ri);
    });
    return c;
  });

  /* Reconcile instead of replaceChildren: re-inserting an element detaches it,
     which throws away the style and layout of every row underneath it. Columns
     that keep their slot must not be touched at all. */
  const want = [...cols.map((c) => c.el), renderPreview()];
  want.forEach((el, i) => {
    if (strip.childNodes[i] !== el) {
      strip.insertBefore(el, strip.childNodes[i] || null);
    }
  });
  while (strip.childNodes.length > want.length) strip.lastChild.remove();
  if (previewNode()) setupPreviewActions(previewNode());
  for (const c of cols) {
    c.el.classList.toggle(
      "scrollable-down",
      c.body.scrollHeight > c.body.clientHeight + SCROLL_HINT_PADDING,
    );
  }
  actions.renderCrumbs();
  sortSay(sortStatus());
  layout(keepScroll);
  syncURL();
}

function renderPreview() {
  const n = previewNode();
  const selected = selectedNode();
  const pv = document.createElement("div");
  pv.id = "preview";
  pv.tabIndex = 0;
  pv.setAttribute("aria-label", "File preview");
  PREVIEW.revoke?.();
  if (!n && !selected) {
    pv.innerHTML = `<div class="pv-empty"><div class="glyph">◫</div>
                    <div>Select a file to preview</div></div>`;
    return pv;
  }
  const target = n || selected;
  const [stem, ext] = splitName(target.name);
  const rawPath = "/" + currentPath().map(encodeURIComponent).join("/") +
    "?filemill=raw";
  pv.innerHTML = `
    <div class="col-head pv-head"><span class="name"><span>${
    esc(target.name)
  }</span></span>
      <span class="pv-actions">
        ${
    ROUTER
      ? `<a id="pv-raw" class="pv-action" href="${rawPath}" title="View raw file">Raw</a>`
      : ""
  }
        <span id="pv-md-views" hidden role="group" aria-label="Markdown view">
          <button id="pv-md-rendered" class="pv-action" type="button">Rendered</button>
          <button id="pv-md-raw" class="pv-action" type="button">Raw</button>
        </span>
        <span id="pv-vtt-views" hidden role="group" aria-label="WebVTT view">
          <button id="pv-vtt-transcript" class="pv-action" type="button">Transcript</button>
          <button id="pv-vtt-raw" class="pv-action" type="button">Raw</button>
        </span>
        <button id="pv-view" class="pv-action" type="button"></button>
        <button id="pv-delete" class="pv-action" type="button"
                title="Delete selected item">Delete</button>
        <button id="pv-fullscreen" class="pv-action" type="button" aria-pressed="${pvFullscreen}"
                title="Toggle fullscreen preview">Fullscreen</button>
      </span>
    </div>
    <div class="pv-body">
      <div class="pv-hero">
        ${iconHTML(target)}
        <div><h2>${esc(stem)}<span style="color:var(--ink-3)">${
    esc(ext)
  }</span></h2>
             <div class="sub" id="pv-sub">reading…</div></div>
        <button id="pv-edit" hidden>Edit</button>
      </div>
      <div id="pv-content" class="pv-content"></div>
    </div>`;
  if (n) fillPreview(n);
  pv.classList.toggle("pv-is-fullscreen", pvFullscreen);
  return pv;
}

const RENDERED_RE = /\.(md|markdown|rst|docx|pptx|html?|desktop)$/i;
const MARKDOWN_RE = /\.(md|markdown)$/i;
let markdownView = "rendered";
let vttView = "transcript";

async function rawMarkdown(node) {
  try {
    const blob = await FS.blob(node);
    return blob ? `<pre class="pv-text">${esc(await blob.text())}</pre>` : null;
  } catch (_) {
    return null;
  }
}

function previewView() {
  const view = new URL(location.href).searchParams.get("filemill") ||
    document.documentElement.dataset.filemill || "raw";
  return view === "highlight"
    ? "highlight"
    : view === "render"
    ? "render"
    : "raw";
}

function setPreviewView(view) {
  if (!location.pathname) return;
  const url = new URL(location.href);
  url.searchParams.set("filemill", view);
  location.href = url.pathname + url.search + url.hash;
}

function setupPreviewActions(n) {
  const view = previewView();
  const toggle = document.getElementById("pv-view");
  const mdViews = document.getElementById("pv-md-views");
  const vttViews = document.getElementById("pv-vtt-views");
  const name = String(n.name || "");
  const markdown = MARKDOWN_RE.test(name);
  const vtt = /\.vtt$/i.test(n.name);
  const applicable = RENDERED_RE.test(name);
  if (mdViews) {
    mdViews.hidden = !markdown;
    for (
      const [id, mode, label] of [
        ["pv-md-rendered", "rendered", "View rendered Markdown"],
        ["pv-md-raw", "raw", "View raw Markdown source"],
      ]
    ) {
      const button = document.getElementById(id);
      if (!button) continue;
      button.setAttribute("aria-pressed", String(markdownView === mode));
      button.setAttribute("aria-label", label);
      button.title = label;
      button.onclick = () => {
        if (markdownView === mode) return;
        markdownView = mode;
        fillPreview(n);
        setupPreviewActions(n);
      };
    }
  }
  if (vttViews) {
    vttViews.hidden = !vtt || view === "highlight";
    for (
      const [id, mode, label] of [
        ["pv-vtt-transcript", "transcript", "View WebVTT transcript"],
        ["pv-vtt-raw", "raw", "View raw WebVTT source"],
      ]
    ) {
      const button = document.getElementById(id);
      if (!button) continue;
      button.setAttribute("aria-pressed", String(vttView === mode));
      button.setAttribute("aria-label", label);
      button.title = label;
      button.onclick = () => {
        if (vttView === mode) return;
        vttView = mode;
        fillPreview({ ...n, previewFormat: mode });
        setupPreviewActions(n);
      };
    }
  }
  if (toggle) {
    toggle.hidden = !markdown && !applicable;
    toggle.textContent = view === "render" ? "Source" : "Rendered";
    toggle.title = view === "render"
      ? "View highlighted source"
      : "View rendered preview";
    toggle.setAttribute("aria-label", toggle.title);
    toggle.onclick = () => {
      setPreviewView(view === "render" ? "highlight" : "render");
    };
  }
  const full = document.getElementById("pv-fullscreen");
  if (full) {
    full.onclick = () => {
      setState({ pvFullscreen: !pvFullscreen });
      root.classList.toggle("pv-fullscreen", pvFullscreen);
      full.setAttribute("aria-pressed", pvFullscreen);
      full.textContent = pvFullscreen ? "Exit fullscreen" : "Fullscreen";
      full.title = full.textContent;
    };
    full.textContent = pvFullscreen ? "Exit fullscreen" : "Fullscreen";
  }
  const del = document.getElementById("pv-delete");
  if (del) {
    del.hidden = !FS.remove || !!n.vpath;
    del.onclick = async () => {
      if (
        !window.confirm(
          `Delete “${n.name}”${n.dir ? " and its contents" : ""}?`,
        )
      ) return;
      del.disabled = true;
      try {
        await FS.remove(n);
        await actions.refreshColumn(path.length - 1);
      } catch (err) {
        actions.saySt(
          "st-refresh",
          `Delete failed: ${String(err.message || err)}`,
          false,
        );
        del.disabled = false;
      }
    };
  }
}

/* Metadata and contents arrive after the layout is already on screen; the token
   makes sure a slow read for a file you have since navigated away from is
   dropped. That guard lives here, not in the provider, so a provider is free to
   be as slow as it needs to be — a server round-trip, a WASM highlighter. */
async function fillPreview(n) {
  const token = nextPvToken();
  await FS.loadMeta(n);
  if (token !== pvToken) return;
  const m = n.meta || {};
  const sub = document.getElementById("pv-sub");
  if (!sub) return;
  if (m.error) {
    sub.textContent = "unreadable";
    return;
  }
  /* Not everything a column can hold is a file. A row inside a database has no
     size and no mtime, and inventing them prints "0 B · 1 Jan 1970" — so leave
     the sub-line empty and go straight to the body. */
  if (m.size == null) {
    sub.textContent = "";
  } else {
    sub.textContent = `${fmtSize(m.size)} · modified ${fmtDate(m.mod)}`;
  }

  let html = null;
  try {
    html = MARKDOWN_RE.test(n.name) && markdownView === "raw"
      ? (await rawMarkdown(n) || await PREVIEW.render(n))
      : /\.vtt$/i.test(n.name) && previewView() !== "highlight"
      ? await PREVIEW.render({ ...n, previewFormat: vttView })
      : await PREVIEW.render(n);
  } catch (err) {
    html = `<p class="pv-err">Preview failed: ${
      esc(String(err.message || err))
    }</p>`;
  }
  if (token !== pvToken) return;
  const host = document.getElementById("pv-content");
  if (!host) return;
  host.innerHTML = html ?? `<p>No inline preview for this file type.</p>`;
  hlFences(host);
  const btn = document.getElementById("pv-edit");
  if (btn) {
    btn.hidden = true;
    if (await editableText(n) !== null) {
      btn.hidden = false;
      btn.onclick = () => openEditor(n);
    }
  }
  paintTrail();
}

/* ── Edit mode ──────────────────────────────────────────────────────────────
   A plain textarea over FS.write — see ports.js. The gate mirrors the text
   preview in adapters/preview-local.js (same extensions, same cap), but it is
   core's own copy: a build picks its preview provider freely, and Edit has to
   work with any of them. Keep the two lists in step. */
const NON_EDIT_RE = new RegExp(
  `\\.(desktop|docx|pptx|pdf|html?|${IMAGE_EXTENSIONS.join("|")})$`,
  "i",
);

async function editableText(n) {
  if (
    !FS.write || n.dir || n.vpath || NON_EDIT_RE.test(n.name) ||
    (n.meta?.size ?? 0) > EDIT_MAX
  ) return null;
  const blob = await FS.blob(n);
  if (!blob || blob.size > EDIT_MAX) return null;
  try {
    const text = new TextDecoder("utf-8", { fatal: true }).decode(
      await blob.arrayBuffer(),
    );
    return !text.includes("\0") &&
        Math.max(...text.split(/\r?\n/).map((line) => line.length), 0) <=
          EDIT_MAX_LINE
      ? text
      : null;
  } catch (_) {
    return null;
  }
}

async function openEditor(n) {
  const token = pvToken;
  const blob = await FS.blob(n);
  if (token !== pvToken || !blob) return;
  /* Read again rather than lifting the text out of the pane: the preview is
     HTML by then, coloured and escaped, and un-escaping it back into source
     is a round trip that can only lose. Same bytes either way — EDIT_MAX and
     the provider's TEXT_MAX are the same 512 KB. */
  const text = await blob.text();
  const host = document.getElementById("pv-content");
  if (token !== pvToken || !host) return;
  document.getElementById("pv-edit").hidden = true;
  host.innerHTML = `
    <textarea id="pv-editor" spellcheck="false" aria-label="Edit ${
    esc(n.name)
  }"></textarea>
    <div class="pv-edit-bar">
      <button id="pv-save">Save</button>
      <button id="pv-cancel">Cancel</button>
      <span class="pv-err" id="pv-edit-err"></span>
    </div>`;
  const ta = document.getElementById("pv-editor");
  ta.value = text;
  ta.focus();
  ta.setSelectionRange(0, 0);
  ta.scrollTop = 0;
  document.getElementById("pv-cancel").onclick = () => fillPreview(n);
  document.getElementById("pv-save").onclick = async () => {
    try {
      await FS.write(n, ta.value);
    } catch (err) {
      const box = document.getElementById("pv-edit-err");
      if (box) box.textContent = String(err.message || err);
      return;
    }
    /* the pane may have moved on while the write was in flight */
    if (ta.isConnected) fillPreview(n);
  };
}

/* ═══ core/typeahead.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Type-ahead

   Typing letters jumps to a row in the focused column. In a folder of 400
   entries that is three keystrokes instead of 200 presses of ↓.

   Three rungs, tried in order over the whole column, first hit wins:

     1. prefix     "re" → readme.md
     2. substring  "notes" → beta-notes.md, when nothing *starts* with "notes"
     3. fuzzy      "arp" → Alpha Report.txt, the letters in order, gaps allowed

   The rung that matched also decides what gets marked, so the highlight is the
   explanation: a solid run for rungs 1 and 2, scattered characters for rung 3.

   Nothing here knows where the entries came from, so it is shared with the
   server build — a column is a list of names either way.
   ═══════════════════════════════════════════════════════════════════════════ */

/* How long the buffer survives a pause. 1.2 s is long enough to type "adme"
   after "re" without hurrying, short enough that a search you walked away from
   is gone before you touch the keyboard again. */
const TA_IDLE = 1200;

let taBuf = ""; /* what has been typed since the last pause */
let taTimer = null;
let taRow = null; /* the row wearing <mark> right now, so it can be undone */
let taName = ""; /* its plain name, to rebuild the label from */

const taLive = () => taBuf !== "";

/* A letter with Ctrl, ⌘ or Alt held belongs to the browser or to a command —
   ⌘C copies the path, ⌘R reloads. Swallowing those into a search is the kind
   of bug you notice only when reload stops working. Shift does not disqualify:
   capital letters are part of file names. Backspace counts only while a search
   is live, so it stays free for anything else to claim later. */
const taWants = (e) =>
  !e.ctrlKey && !e.metaKey && !e.altKey &&
  (e.key.length === 1 || (e.key === "Backspace" && taLive()));

/* All of `q` in `n`, in order, gaps allowed. No allocation: this runs once per
   entry per keystroke, and a column can hold thousands. */
const taFuzzy = (n, q) => {
  let qi = 0;
  for (let i = 0; i < n.length && qi < q.length; i++) if (n[i] === q[qi]) qi++;
  return qi === q.length;
};

/* Row index of the winner, or -1. Three passes, each stopping at its own first
   hit — a prefix match on row 2 never looks at rows 3…3000. A prefix match on
   row 2 800 still beats a substring match on row 3, which is the point of
   separate passes rather than one scan that scores. */
function taSearch(lower, q) {
  let i = lower.findIndex((n) => n.startsWith(q));
  if (i < 0) i = lower.findIndex((n) => n.includes(q));
  if (i < 0) i = lower.findIndex((n) => taFuzzy(n, q));
  return i;
}

/* Which characters of `lower` the query landed on: a contiguous run for prefix
   and substring, scattered ones for fuzzy. Runs once, on the winner only. */
function taHits(lower, q) {
  const hit = new Array(lower.length).fill(false);
  const at = lower.indexOf(q);
  if (at >= 0) {
    for (let k = 0; k < q.length; k++) hit[at + k] = true;
    return hit;
  }
  let qi = 0;
  for (let i = 0; i < lower.length && qi < q.length; i++) {
    if (lower[i] === q[qi]) {
      hit[i] = true;
      qi++;
    }
  }
  return qi === q.length ? hit : null;
}

/* Consecutive hits become one <mark>, so "notes" is a single pill and a fuzzy
   match is a row of beads. */
const taRuns = (text, hit, off) => {
  let out = "", open = false;
  for (let i = 0; i < text.length; i++) {
    const on = !!hit[off + i];
    if (on !== open) {
      out += on ? "<mark>" : "</mark>";
      open = on;
    }
    out += esc(text[i]);
  }
  return out + (open ? "</mark>" : "");
};

/* The same structure buildCol writes, so un-marking restores it exactly. */
const taLabel = (name, hit) => {
  const [stem, ext] = splitName(name);
  return hit
    ? taRuns(stem, hit, 0) +
      `<span class="dim">${taRuns(ext, hit, stem.length)}</span>`
    : `${esc(stem)}<span class="dim">${esc(ext)}</span>`;
};

const taSay = (msg) => {
  document.getElementById("st-find").textContent = msg;
};

function taUnmark() {
  if (taRow) taRow.querySelector(".label").innerHTML = taLabel(taName, null);
  taRow = null;
}

/* Only two rows are ever rewritten per keystroke: the one that was marked and
   the one that now is. Marking every matching row would be an innerHTML write
   per entry, which is the O(entries)-per-keystroke cost this app spent a lot of
   effort deleting (740 ms → 4–9 ms at 3 000 entries). */
function taMark(row, name, hit) {
  taUnmark();
  if (!hit) return;
  row.querySelector(".label").innerHTML = taLabel(name, hit);
  taRow = row;
  taName = name;
}

function taCancel() {
  clearTimeout(taTimer);
  taTimer = null;
  if (!taLive()) return;
  taBuf = "";
  taUnmark();
  taSay("");
}

/* One keystroke. `c` is the focused column's cache entry, which nav.js has
   already looked up — never re-query the rows, a directory can hold tens of
   thousands of them. */
function taType(key, c) {
  taBuf = key === "Backspace" ? taBuf.slice(0, -1) : taBuf + key;
  clearTimeout(taTimer);
  if (!taLive()) return void taSay("");
  taTimer = setTimeout(taCancel, TA_IDLE);

  /* The match runs on the rows the column already holds. A directory still
     being read has none, so nothing matches and the buffer waits — there is no
     re-run when the read lands, because by then you have typed more anyway. */
  if (!c.rows.length) return void taSay(`⌕ ${taBuf} — still reading`);

  /* Lower-cased names, cached beside the rows they were built from, so the two
     die together. Lower-casing 3 000 names costs ~1.4 ms; paying it once per
     column instead of once per keystroke is what keeps a search inside the
     budget the arrow keys set. */
  const lower = (c.lower ||= c.kids.map((k) => k.name.toLowerCase()));
  const q = taBuf.toLowerCase();
  const i = taSearch(lower, q);
  taSay(i < 0 ? `⌕ ${taBuf} — no match` : `⌕ ${taBuf}`);
  if (i < 0) return; /* keep the buffer: Backspace should undo the typo */

  const name = c.kids[i].name;
  taUnmark(); /* before the click, so the row it re-selects is clean */
  c.rows[i].click(); /* the ordinary selection path: preview, trail, URL */
  revealRow(c.rows[i]);
  /* toLowerCase can change a string's length ("İ" → two characters), and then
     the hit positions no longer index the original name. Skip the marks rather
     than paint them one character off. */
  taMark(
    c.rows[i],
    name,
    lower[i].length === name.length ? taHits(lower[i], q) : null,
  );
}

/* A real click means you went somewhere by hand, so the search is over. The
   click taType fires is untrusted, which is exactly the distinction needed —
   no flag to set and unset around it. */
document.addEventListener("click", (e) => {
  if (e.isTrusted) taCancel();
});

/* ═══ core/settings.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Settings popover
   ═══════════════════════════════════════════════════════════════════════════ */

const gear = document.getElementById("gear"),
  panel = document.getElementById("settings");
const closeSettings = () => {
  panel.hidden = true;
  gear.setAttribute("aria-expanded", "false");
};
const toggle = (id, get, set) => {
  const b = document.getElementById(id);
  b.onclick = () => {
    set(!get());
    b.setAttribute("aria-checked", String(get()));
    render(true);
  };
  b.setAttribute("aria-checked", String(get()));
};

/* Everything the old classic script did at load time. Called by the app
   module once every core module has been evaluated. */
function initSettings() {
  gear.onclick = (e) => {
    e.stopPropagation();
    panel.hidden = !panel.hidden;
    gear.setAttribute("aria-expanded", String(!panel.hidden));
  };
  document.addEventListener("click", (e) => {
    if (!panel.contains(e.target)) closeSettings();
  });

  root.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches
    ? "dark"
    : "light";

  toggle("s-dot", () => state.dotfiles, (v) => state.dotfiles = v);
  toggle(
    "s-density",
    () => root.dataset.density === "compact",
    (v) => root.dataset.density = v ? "compact" : "comfortable",
  );
  toggle(
    "s-theme",
    () => root.dataset.theme === "dark",
    (v) => root.dataset.theme = v ? "dark" : "light",
  );

  /* Radios rather than three toggles: one key is active, and a menu that lets you
     uncheck every one of them has no answer for what the column is ordered by.
     Direction is separate because it applies to whichever key is chosen — and
     because flipping it re-sorts what is already in memory, with no second sweep.
     setSort (core/sort.js) stores the choice and re-renders. */
  SORT_KEYS.forEach((k) => {
    document.getElementById(`s-sort-${k}`).onclick = () =>
      setSort(k, state.sort.desc);
  });
  document.getElementById("s-sort-desc").onclick = () =>
    setSort(state.sort.key, !state.sort.desc);
}

/* ═══ core/nav.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Navigation

   Focus follows the *selection*, not the newly opened column: selecting a
   directory opens its column as a preview but keeps you where you are, so ↑/↓
   keep walking the current column. → is what moves you in, ← what moves out.
   ═══════════════════════════════════════════════════════════════════════════ */

const OPEN_GRACE = 50; // Let ordinary local reads land before showing the column.
const STATUS_OK_MS = 1600; // Successful status messages need only a brief confirmation.
const STATUS_ERROR_MS = 8000; // Error status messages stay visible long enough to act on.
const PREVIEW_SCROLL_STEP = 40; // Arrow keys move the preview by a small readable increment.

let navSeq = 0; /* a read that outlives its selection must not repaint */

/* When a folder opens with nothing chosen inside it, dash-select its README
   (exact name first, then README.*, then index.html) so the preview shows it.
   Focus stays where it is — this is a preview, not a navigation. */
function autoPreview(node) {
  const i = path.length - 1;
  if (path[i] !== node || sel[i] !== undefined) return;
  const files = visibleKids(node).filter((k) => !k.dir);
  const pick = files.find((k) => k.name === "README") ||
    files.find((k) => k.name.startsWith("README.")) ||
    files.find((k) => k.name === "index.html");
  if (pick) sel[i] = pick.name;
}

async function choose(colIdx, node) {
  const seq = ++navSeq;
  setState({ path: path.slice(0, colIdx + 1), sel: sel.slice(0, colIdx) });
  sel[colIdx] = node.name;
  setState({ focusCol: colIdx });
  if (!node.dir) return void render();

  const reading = node.kids === null ? FS.ensureLoaded(node) : null;
  if (reading) {
    /* Highlight the row at once, but hold its column back for a moment: a
       column measures the names it holds, and one built before the read lands
       measures empty — it would open at the minimum width and jump wider a
       frame later. Most directories arrive well inside the grace; a slower one
       opens on the spinner, which is honest about the wait. */
    render();
    await Promise.race([
      reading,
      new Promise((r) => setTimeout(r, OPEN_GRACE)),
    ]);
    if (seq !== navSeq) return; /* selection moved on while it was read */
    if (!node.dir) {
      return void render(); /* a virtual wrapper declined the file */
    }
  }
  path.push(node);
  autoPreview(node); /* kids already in memory (revisit, fast read) */
  render();
  if (reading) {
    await reading;
    if (seq !== navSeq || !path.includes(node)) return; /* still up? repaint */
    autoPreview(node); /* kids landed after the grace period */
    render();
  }
}

/* ── Refresh ────────────────────────────────────────────────────────────────
   Neither port can tell the app that a directory changed. The File System
   Access API has no watch call at all, and the server one would need a socket
   the static build cannot open. So a folder read once stays as it was read
   until somebody asks again, and asking has to be a thing the user does.

   Refreshing is *not* a second way to load a directory. It empties node.kids
   and calls the same FS.ensureLoaded every other caller uses — one loading
   path, one debounce, one place where node.kids is written. A separate
   "reload" call would be two writers on one field, and the interleaving that
   loses is the one you never reproduce.

   Which columns it touches, and what survives:

     the focused column          re-read from the port
     columns open below it       re-read too — they are on screen, and a fresh
                                 column beside three stale ones is worse than
                                 the extra reads. Closed subtrees are untouched
     the selection at each level matched again by name: a re-read hands back
                                 new node objects, so the chain is re-walked
                                 rather than kept by identity
     a selected name that is gone the walk stops there, and nothing is selected —
                                 ↓ resumes at the top of the remaining rows, and
                                 the app never shows a selection that is not real
     columns below the stop      closed, because their parent no longer has the
                                 entry that opened them
     focus                       where it was, clamped to the new depth        */
async function refreshColumn(i) {
  const node = path[i];
  if (!node || !node.dir || !FS) return;

  const seq = ++navSeq; /* a click, a key or a second ⟳ overtakes */
  const names = currentPath();
  const keepFocus = focusCol;
  /* the ⟳ spins on the column that is on screen now; the re-render replaces
     that element, which is exactly when the spinning should stop */
  const spinning = colCache.get(node)?.el;
  spinning?.classList.add("busy");

  try {
    /* A read already in flight owns node.kids. Wait for it before invalidating:
       ensureLoaded hands a concurrent caller the in-flight promise, so asking
       now would return the very listing this refresh was called to replace,
       and two reads would race to write the same field. */
    if (node.loading) await node.loading;
    if (seq !== navSeq) return;

    const before = new Set(visibleKids(node).map((k) => k.name));
    node.kids = null;
    node.denied = undefined;
    /* The entries are about to be different objects, so what was swept is about
       to be about files that are no longer in this listing. A size sort re-reads
       them; a name sort never asked. */
    node.metaDone = false;
    /* Nothing renders between here and the read landing. The column cache still
       holds the previous DOM, so the screen keeps showing the old listing
       instead of flashing back to "Reading…" and losing its scroll position. */
    await FS.ensureLoaded(node);
    if (seq !== navSeq) return;

    const after = visibleKids(node);
    const added = after.reduce((n, k) => n + !before.has(k.name), 0);
    const gone = before.size - (after.length - added);

    /* The same walk a deep link uses: down from the root by name, stopping at
       the first segment that is not there. Three callers, one implementation —
       refresh, a pasted link, and a restored folder cannot disagree about what
       a half-valid chain means. */
    const complete = await applyPath(names, keepFocus);
    if (seq !== navSeq) return;

    if (complete) {
      saySt(
        "st-refresh",
        added || gone ? `⟳ ${added} new, ${gone} gone` : "⟳ no change",
        true,
      );
      return;
    }
    const stop = path.length - 1; /* where the walk ran out */
    const col = colCache.get(path[stop]);
    render(true);
    scrollCursorIntoView();
    saySt("st-refresh", `⟳ ${names[stop]} is gone`, false);
  } finally {
    spinning?.classList.remove("busy");
  }
}

/* clicking a spine scrolls back just far enough to unfold it */
function unfoldTo(i) {
  finder.scrollTo({
    left: Math.round(i * foldUnit() * range()),
    behavior: "smooth",
  });
}

/* Where you are, from the root down to the selected row. The first element is a
   folder *name*, not an absolute path: the File System Access API never hands
   one out, so this is everything the app knows about the location. */
function renderCrumbs() {
  const el = document.getElementById("crumbs");
  el.textContent = "";
  path.forEach((p, i) => {
    if (i) {
      el.insertAdjacentHTML("beforeend", `<span class="crumb-sep">›</span>`);
    }
    const b = document.createElement("span");
    b.className = "crumb" + (i === path.length - 1 ? " here" : "");
    b.textContent = p.name;
    b.onclick = () => {
      setState({
        path: path.slice(0, i + 1),
        sel: sel.slice(0, i),
        focusCol: i,
      });
      render();
    };
    el.appendChild(b);
  });
  /* "/" rather than the " / " this strip used to show: clicking it copies the
     string, and a fallback selection copies the characters on screen. The two
     have to be the same string or the fallback quietly hands over a path that
     no shell will take. */
  document.getElementById("st-path").textContent = currentPath().join("/");
}

/* ── Copy path ──────────────────────────────────────────────────────────────
   The status strip already shows where you are; ⌘C, or a click on it, puts that
   path on the clipboard.

   navigator.clipboard.writeText can be refused: a browser policy, a page the
   user has not touched yet, an insecure context with no clipboard object at
   all. A silent refusal is the worst outcome, because the next paste hands over
   whatever was on the clipboard before and nothing says so. So a refusal says
   so and selects the path, which leaves the browser's own ⌘C one keystroke
   away — the fallback needs no permission because the user presses it. */
/* One transient line in the status strip, per slot, cleared on a timer. A
   success can flash; a refusal or a loss stays long enough to be read and acted
   on, because it is asking the user to do something about it. */
function saySt(id, msg, ok) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.toggle("bad", !ok);
  clearTimeout((saySt.t ||= {})[id]);
  saySt.t[id] = setTimeout(() => {
    el.textContent = "";
    el.classList.remove("bad");
  }, ok ? STATUS_OK_MS : STATUS_ERROR_MS);
}

const sayCopy = (msg, ok) => saySt("st-copy", msg, ok);

function selectPath() {
  const r = document.createRange();
  r.selectNodeContents(document.getElementById("st-path"));
  const s = getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

async function copyPath() {
  const text = document.getElementById("st-path").textContent;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    sayCopy("copied", true);
  } catch (err) {
    selectPath();
    sayCopy(
      `clipboard refused (${err.name || "error"}) — press ${COPY_KEY} again`,
      false,
    );
  }
}

const MAC = /Mac|iP(hone|ad)/.test(
  navigator.userAgentData?.platform || navigator.platform || "",
);
const COPY_KEY = MAC ? "⌘C" : "Ctrl+C";
document.getElementById("kbd-copy").textContent = COPY_KEY;
document.getElementById("st-path").onclick = copyPath;

/* Entering a column: the row it was left on, else the one it remembers, else
   the first. The column may still be reading, so this can run twice. */
function enterColumn(i) {
  const c = colCache.get(path[i]);
  if (!c || !c.rows.length) return;
  const remembered = sel[i];
  let ri = rowIndex(path[i], remembered);
  ri = Math.max(0, Math.min(c.rows.length - 1, ri < 0 ? 0 : ri));
  c.rows[ri].click();
  revealRow(c.rows[ri]);
}

/* Stepping right into a column that has no rows would move focus with nothing
   to highlight — the screen would not change, yet ↑/↓ would go dead. Stay put.
   columnFor rebuilds the column if it finished reading since the last render. */
function stepInto(node) {
  const i = path.indexOf(node);
  if (i < 0) return; /* moved on while it was still reading */
  if (!columnFor(node).rows.length) return;
  setState({ focusCol: i });
  enterColumn(i);
}

function pageMove(c, dir, ci) {
  const body = c.rows[0]?.parentElement;
  if (!body || !c.rows.length) return;
  const edge = () => {
    const b = body.getBoundingClientRect();
    const visible = c.rows.filter((row) => {
      const r = row.getBoundingClientRect();
      return r.bottom > b.top && r.top < b.bottom;
    });
    return dir < 0 ? visible[0] : visible.at(-1);
  };
  let row = edge();
  if (!row) return;
  if (c.rows[ci] === row) {
    const h = row.offsetHeight;
    const lines = h ? Math.max(1, Math.floor(body.clientHeight / h)) : 1;
    body.scrollTop += dir * lines * h;
    row = edge();
  }
  row?.click();
  if (row) revealRow(row);
}

document.addEventListener("keydown", (e) => {
  /* a keystroke inside a form field (the preview editor) is typing, not
     navigation — leave it alone */
  if (
    e.target.matches?.("input, textarea, select") || e.target.isContentEditable
  ) {
    return;
  }
  if (!document.getElementById("welcome")?.hidden) return;
  if (e.target.closest?.("#preview")) {
    if (["ArrowUp", "ArrowDown", "PageUp", "PageDown"].includes(e.key)) {
      const body = document.querySelector("#preview .pv-body");
      e.preventDefault();
      body?.scrollBy({
        top: e.key === "ArrowUp"
          ? -PREVIEW_SCROLL_STEP
          : e.key === "ArrowDown"
          ? PREVIEW_SCROLL_STEP
          : (e.key === "PageUp" ? -1 : 1) * body.clientHeight,
      });
    }
    return;
  }
  /* the cached column knows its rows — never re-query them, a directory can
     hold tens of thousands and this runs on every keystroke */
  const c = colCache.get(path[focusCol]);
  if (!c) return;
  const rows = c.rows;
  let ci = rowIndex(path[focusCol], sel[focusCol]);
  if (ci < 0) ci = 0;

  /* ⌘C / Ctrl+C. A live text selection wins: the user highlighted something and
     asked for *that*, and after a refused copy the selected path is exactly
     what the second press has to reach. */
  if (e.key === "c" && (e.metaKey || e.ctrlKey) && !getSelection().toString()) {
    e.preventDefault();
    return void copyPath();
  }
  /* Letters go to the search unless an arrow, Home/End or Escape claimed the
     keystroke first — those four are the navigation model and type-ahead does
     not get to argue with them. Each of them also ends a live search. */
  if (taWants(e)) {
    e.preventDefault();
    return void taType(e.key, c);
  }
  if (e.key !== "Escape") taCancel();

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!rows.length) return;
    /* a freshly entered column has no selection yet — the first
       press should commit that row, not skip past it */
    if (sel[focusCol] !== undefined) {
      ci = Math.max(
        0,
        Math.min(rows.length - 1, ci + (e.key === "ArrowDown" ? 1 : -1)),
      );
    }
    rows[ci].click();
    revealRow(rows[ci]);
  } else if (e.key === "Home" || e.key === "End") {
    e.preventDefault();
    if (!rows.length) return;
    const ri = e.key === "Home" ? 0 : rows.length - 1;
    rows[ri].click();
    revealRow(rows[ri]);
  } else if (e.key === "PageUp" || e.key === "PageDown") {
    e.preventDefault();
    pageMove(c, e.key === "PageUp" ? -1 : 1, ci);
  } else if (e.key === "ArrowRight" || e.key === "Enter") {
    e.preventDefault();
    const next = path[focusCol + 1];
    /* nothing open to the right: commit the row, which opens it when it
       is a directory — a second → then steps into that column */
    if (!next) {
      const row = rows[ci];
      row?.click();
      if (e.key === "ArrowRight" && c.kids[ci] && !c.kids[ci].dir) {
        document.getElementById("preview")?.focus();
      }
      return;
    }
    if (next.kids === null) {
      FS.ensureLoaded(next).then(() => {
        render();
        stepInto(next);
      });
    } else stepInto(next);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (focusCol > 0) {
      setState({ focusCol: focusCol - 1 });
      unfoldTo(focusCol);
      render(true);
    }
  } else if (e.key === "F5" && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    /* Every desktop file manager reads F5 as "re-read this folder", and here a
       page reload is a far worse trade: it drops the mounted root, the whole
       column chain and the scroll position, then asks the browser for the
       folder again. ⌘R, Ctrl+R and Ctrl+F5 are left alone, so a real reload is
       still one keystroke away — the same rule type-ahead follows for ⌘R. */
    e.preventDefault();
    refreshColumn(focusCol);
  } else if (e.key === "Escape") {
    /* one Escape does one thing: abandon the search if there is one, otherwise
       close the popover. Both at once would make it impossible to tell which
       one the key just did. */
    if (taLive()) taCancel();
    else closeSettings();
  }
});

/* ═══ adapters/vfs-json.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   JSONL — a file of one JSON object per line, browsed as a column of rows.

   The client-side counterpart of the server's SQLite provider: a `.jsonl`
   file opens as a column, one row per line, and a row previews as its
   key/value pairs. Both builds get it by wrapping their FS and PREVIEW ports
   here — see adapters/app-fsa.js and adapters/app-http.js — so core/ still
   sees nothing but nodes.

   The row label is one key chosen once per file: unique across every record,
   preferring short text (title, name, description…) over other scalars
   (timestamp, id…), and falling back to the line number. Unique because the
   selection, the URL and applyPath all name a row by it.
   ═══════════════════════════════════════════════════════════════════════════ */

const JSONL_MAX = TEXT_MAX;
const JSONL_LABEL = 60; /* as the server's MAX_LABEL_LEN */
const JSONL_TEXT = ["title", "name", "description", "summary", "label"];
const JSONL_SCALAR = ["timestamp", "time", "ts", "id", "uuid", "key"];
const JSON_MAX = TEXT_MAX;

const isJsonl = (n) => /\.jsonl$/i.test(n.name);
const isJson = (n) => /\.jsonc?$/i.test(n.name);
const jsonlLabel = (v) =>
  ((s) => s.length > JSONL_LABEL ? s.slice(0, JSONL_LABEL - 1) + "…" : s)(
    String(v),
  );

/* The labels a key would give, or null when it cannot name every row. */
function jsonlLabels(records, key) {
  const seen = new Set();
  const out = [];
  for (const r of records) {
    const v = r[key];
    if (v === undefined || v === null || typeof v === "object") return null;
    const s = jsonlLabel(v);
    if (!s || s.startsWith(".") || seen.has(s)) {
      return null; /* dotfile filter */
    }
    seen.add(s);
    out.push(s);
  }
  return out;
}

function jsonlKey(records) {
  const keys = Object.keys(records[0] || {});
  const first = (pref) => [
    ...pref.filter((k) => keys.includes(k)),
    ...keys.filter((k) => !pref.includes(k)),
  ];
  const short = (k) =>
    records.every((r) =>
      typeof r[k] === "string" &&
      r[k].length <= JSONL_LABEL
    );
  for (const k of first(JSONL_TEXT)) {
    if (short(k) && jsonlLabels(records, k)) return k;
  }
  for (const k of first(JSONL_SCALAR)) if (jsonlLabels(records, k)) return k;
  return null;
}

function jsonlRows(node, records) {
  const key = jsonlKey(records);
  const labels = key
    ? jsonlLabels(records, key)
    : records.map((_, i) => `line ${i + 1}`);
  return records.map((record, i) => ({
    name: labels[i],
    dir: false,
    vpath: String(i + 1),
    icon: "📋",
    rel: node.rel,
    ordered: true,
    meta: { virtual: true },
    record,
  }));
}

function jsonlParse(text) {
  const records = [];
  const lines = text.split("\n");
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    let v;
    try {
      v = JSON.parse(lines[i]);
    } catch {
      v = null;
    }
    if (!v || typeof v !== "object" || Array.isArray(v)) {
      throw new Error(`Not valid JSONL: line ${i + 1}`);
    }
    records.push(v);
  }
  return records;
}

const withVirtual = (fs) => ({
  ...fs,
  async ensureLoaded(node) {
    if (!node.jsonl && !node.json) {
      await fs.ensureLoaded(node);
      for (const k of node.kids || []) {
        if (!k.dir && isJsonl(k)) {
          Object.assign(k, {
            dir: true,
            kids: null,
            jsonl: true,
            ordered: true,
          });
        }
        if (!k.dir && isJson(k)) {
          Object.assign(k, {
            dir: true,
            kids: null,
            json: true,
            ordered: true,
          });
        }
      }
      return;
    }
    if (node.json) {
      if (node.value !== undefined) {
        if (node.kids === null) node.kids = jsonKids(node, node.value);
        return;
      }
      if (node.loading) return node.loading;
      node.loading = (async () => {
        try {
          const blob = await fs.blob({ ...node, dir: false, vpath: "" });
          if (!blob) throw new Error("Cannot read file");
          if (blob.size > JSON_MAX) {
            throw new Error("Too large to browse (over 512 KB)");
          }
          const value = JSON.parse(await blob.text());
          if (value === null || typeof value !== "object") {
            node.dir = false;
            node.value = value;
            node.kids = undefined;
          } else {
            node.value = value;
            node.kids = jsonKids(node, value);
          }
        } catch (err) {
          node.jsonError = String(err.message || err);
          node.dir = false;
          node.kids = undefined;
        }
        node.loading = null;
      })();
      return node.loading;
    }
    if (node.kids !== null) return;
    if (node.loading) return node.loading;
    node.loading = (async () => {
      try {
        /* Decline before fetching where the listing carried a size: HTTP.blob
           buffers the whole response. The blob.size test stays for the port
           whose listing does not. */
        const big = "Too large to browse (over 512 KB)";
        if ((node.meta?.size ?? 0) > JSONL_MAX) throw new Error(big);
        /* The node is a directory to core; the port still reads it as the
           file it is (FSA.loadMeta skips directories). */
        const blob = await fs.blob({ ...node, dir: false });
        if (!blob) throw new Error("Cannot read file");
        if (blob.size > JSONL_MAX) throw new Error(big);
        node.kids = jsonlRows(node, jsonlParse(await blob.text()));
      } catch (err) {
        node.denied = String(err.message || err);
        node.kids = [];
      }
      node.loading = null;
    })();
    return node.loading;
  },
});

const withVirtualPreview = (provider) => ({
  revoke() {
    provider.revoke?.();
  },
  render(n) {
    if (n.record) {
      const cell = (v) =>
        v !== null && typeof v === "object" ? JSON.stringify(v) : String(v);
      const rows = Object.entries(n.record)
        .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(cell(v))}</td></tr>`)
        .join("");
      return Promise.resolve(
        `<div class="pv-rich"><table class="pv-kv">${rows}</table></div>`,
      );
    }
    if (!n.json || n.value === undefined) return provider.render(n);
    const text = typeof n.value === "string" ? n.value : JSON.stringify(n.value);
    return Promise.resolve(
      n.value !== null && typeof n.value === "object"
        ? null
        : `<pre class="pv-text pv-json-value">${esc(text)}</pre>`,
    );
  },
});

/* JSON documents use the same virtual-node contract as JSONL and SQLite. The
   value stays on each node so the preview can answer locally; vpath is only a
   stable address for the shared router and server-shaped nodes. */
function jsonValue(parent, name, value, vpath) {
  const container = value !== null && typeof value === "object";
  return {
    name,
    dir: container,
    kids: container ? null : undefined,
    vpath,
    icon: container ? "📁" : "◻",
    json: true,
    value,
    rel: parent.rel,
    ordered: true,
    meta: { virtual: true },
  };
}

function jsonKids(node, value) {
  if (
    Array.isArray(value) && value.length &&
    value.every((v) => v && typeof v === "object" && !Array.isArray(v))
  ) {
    const key = jsonlKey(value);
    const labels = key && jsonlLabels(value, key);
    return value.map((record, i) => ({
      name: labels?.[i] || `item ${i + 1}`,
      dir: false,
      vpath: node.vpath ? `${node.vpath}/${i}` : String(i),
      icon: "📋",
      rel: node.rel,
      ordered: true,
      meta: { virtual: true },
      record,
    }));
  }
  const entries = Array.isArray(value)
    ? value.map((v, i) => [String(i), v])
    : Object.entries(value);
  return entries.map(([name, value], i) =>
    jsonValue(node, name, value, node.vpath ? `${node.vpath}/${i}` : String(i))
  );
}

/* ═══ adapters/vfs-csv.js ═══ */
const CSV_MAX = TEXT_MAX;

function csvParse(text) {
  const rows = [], row = [];
  let cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') cell += '"', i++;
      else if (c === '"') quoted = false;
      else cell += c;
    } else if (c === '"' && !cell) quoted = true;
    else if (c === ",") row.push(cell), cell = "";
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell), rows.push(row.splice(0)), cell = "";
    } else cell += c;
  }
  if (quoted) throw new Error("Malformed CSV: unterminated quoted field");
  if (cell || row.length) row.push(cell), rows.push(row);
  if (!rows.length) return { headers: [], records: [] };
  const headers = rows.shift().map((v, i) => v || `column ${i + 1}`);
  if (new Set(headers).size !== headers.length) {
    throw new Error("Malformed CSV: duplicate header");
  }
  const records = rows.filter((r) => r.some(Boolean)).map((r, i) => {
    if (r.length !== headers.length) {
      throw new Error(`Malformed CSV: row ${i + 2}`);
    }
    return Object.fromEntries(headers.map((h, j) => [h, r[j]]));
  });
  return { headers, records };
}

const isCsv = (n) => /\.csv$/i.test(n.name);

function csvLabels(records, key) {
  const seen = new Set();
  const labels = [];
  for (const record of records) {
    const label = record[key];
    if (!label || label.startsWith(".") || seen.has(label)) return null;
    seen.add(label);
    labels.push(label);
  }
  return labels;
}

function csvRows(node, records, headers) {
  const key = headers.find((header) => csvLabels(records, header));
  const labels = key
    ? csvLabels(records, key)
    : records.map((_, i) => `row ${i + 1}`);
  return records.map((record, i) => ({
    name: labels[i],
    dir: false,
    vpath: String(i + 1),
    icon: "📋",
    rel: node.rel,
    ordered: true,
    meta: { virtual: true },
    record,
  }));
}

const withCsv = (fs) => ({
  ...fs,
  async ensureLoaded(node) {
    if (!node.csv) {
      await fs.ensureLoaded(node);
      for (const k of node.kids || []) {
        if (!k.dir && isCsv(k)) {
          Object.assign(k, { dir: true, kids: null, csv: true, ordered: true });
        }
      }
      return;
    }
    if (node.kids !== null || node.loading) return node.loading;
    node.loading = (async () => {
      try {
        if ((node.meta?.size ?? 0) > CSV_MAX) {
          throw new Error("Too large to browse (over 512 KB)");
        }
        const blob = await fs.blob({ ...node, dir: false });
        if (!blob || blob.size > CSV_MAX) {
          throw new Error("Too large to browse (over 512 KB)");
        }
        const parsed = csvParse((await blob.text()).replace(/^\uFEFF/, ""));
        node.headers = parsed.headers;
        if (!parsed.records.length) {
          node.dir = false;
          node.csvEmpty = true;
        }
        node.kids = csvRows(node, parsed.records, parsed.headers);
      } catch (err) {
        node.denied = String(err.message || err);
        node.dir = false;
        node.csvError = true;
        node.kids = [];
      }
      node.loading = null;
    })();
    return node.loading;
  },
});

const withCsvPreview = (provider) => ({
  revoke() {
    provider.revoke?.();
  },
  async render(n) {
    if (n.csv && !n.record) {
      await FS.ensureLoaded(n);
      if (n.csvEmpty) {
        return '<div class="preview-empty">CSV file is empty.</div>';
      }
      if (n.csvError) return provider.render(n);
    }
    if (!n.record) return provider.render(n);
    const rows = Object.entries(n.record).map(([k, v]) =>
      `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`
    ).join("");
    return Promise.resolve(
      `<div class="pv-rich"><table class="pv-kv">${rows}</table></div>`,
    );
  },
});

/* ═══ core/search.js ═══ */
/* Server-only content search. The control stays hidden in local FSA mode. */

/* The same attribute adapters/router-path.js reads; core must not import a
   server-only adapter, or the static bundle would carry it too. */
const SEARCH_BASE = (document.documentElement.dataset.base || "/").replace(
  /\/*$/,
  "/",
);
const searchForm = document.getElementById("search-form");
const searchInput = document.getElementById("search-bar");
const searchResults = document.getElementById("search-results");
let searchTimer;
let searchController;

const searchEsc = (value) => {
  const el = document.createElement("span");
  el.textContent = value;
  return el.innerHTML;
};

function showSearch(message, results = false) {
  searchResults.hidden = !message;
  searchResults.classList.toggle("search-list", results);
  searchResults.innerHTML = message;
}

async function runSearch() {
  const q = searchInput.value.trim();
  searchController?.abort();
  if (!q) return showSearch("");
  searchController = new AbortController();
  showSearch("Searching…");
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`, {
      signal: searchController.signal,
      headers: { Accept: "application/json" },
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `${r.status} ${r.statusText}`);
    if (!data.matches.length) return showSearch("No matches");
    showSearch(
      data.matches.map((m) =>
        `<button type="button" class="search-result" data-path="${
          searchEsc(m.path)
        }">` +
        `<span class="search-path">${searchEsc(m.path)}:${m.line}</span>` +
        `<span class="search-context">${searchEsc(m.context)}</span></button>`
      ).join(""),
      true,
    );
    searchResults.querySelectorAll(".search-result").forEach((button) => {
      button.onclick = () => {
        location.href = `${SEARCH_BASE}${
          button.dataset.path.split("/").map(encodeURIComponent).join("/")
        }`;
      };
    });
  } catch (err) {
    if (err.name !== "AbortError") {
      showSearch(`Search error: ${searchEsc(err.message)}`);
    }
  }
}

if (searchForm && document.documentElement.dataset.root) {
  searchForm.addEventListener("submit", (event) => {
    event.preventDefault();
    runSearch();
  });
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 250);
  });
} else {
  searchForm?.remove();
}

/* ═══ core/mount.js ═══ */
async function mountRoot(node, title = node.name) {
  colCache.clear();
  setState({ path: [node], sel: [], focusCol: 0 });
  document.title = title;
  render();
  await FS.ensureLoaded(node);
}

/* ═══ adapters/fsa.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Filesystem adapter — File System Access API, read-only, one level at a time.

   Fills the FS port (see core/ports.js). Nodes carry the handle they came
   from; nothing else in the app ever touches it.
   ═══════════════════════════════════════════════════════════════════════════ */
const fsaNode = (name, handle, parent = null) => ({
  name,
  handle,
  parent,
  dir: handle.kind === "directory",
  kids: handle.kind === "directory" ? null : undefined,
});

const FSA = {
  node: fsaNode,

  async ensureLoaded(node) {
    if (!node.dir || node.kids !== null) return;
    if (node.loading) return node.loading; /* debounce concurrent calls */
    node.loading = (async () => {
      const kids = [];
      try {
        for await (const [name, handle] of node.handle.entries()) {
          kids.push(fsaNode(name, handle, node.handle));
        }
      } catch (err) {
        node.denied = err.name === "NotAllowedError"
          ? "No permission to read"
          : String(err.message || err);
      }
      node.kids = kids;
      node.loading = null;
    })();
    return node.loading;
  },

  /* File metadata is a separate round-trip per file — only fetched on preview. */
  async loadMeta(node) {
    if (node.dir || node.meta) return;
    try {
      const file = await node.handle.getFile();
      node.meta = { size: file.size, mod: file.lastModified, type: file.type };
      node.file = file;
    } catch (err) {
      node.meta = { error: String(err.message || err) };
    }
  },

  /* The preview providers read bytes through this, so they never need to know
     whether the node came from a handle or a URL. */
  async blob(node) {
    await FSA.loadMeta(node);
    return node.file || null;
  },

  /* Optional — see ports.js. A picked folder can be written back through its
     handles; the permission prompt is the browser's own. */
  async write(node, text) {
    if (
      node.handle.requestPermission &&
      await node.handle.requestPermission({ mode: "readwrite" }) !== "granted"
    ) {
      throw new Error("No permission to write");
    }
    const w = await node.handle.createWritable();
    await w.write(text);
    await w.close();
    node.file = null; /* stale — reread on the next preview */
    node.meta = null;
  },

  async remove(node) {
    if (
      node.handle.requestPermission &&
      await node.handle.requestPermission({ mode: "readwrite" }) !== "granted"
    ) {
      throw new Error("No permission to delete");
    }
    if (!node.handle.parent) throw new Error("Cannot delete this entry");
    await node.handle.parent.removeEntry(node.name, { recursive: node.dir });
  },
};

/* ═══ adapters/preview-local.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Preview provider — in-browser, zero dependencies.

   Fills the PREVIEW port (see core/ports.js). Everything here works from the
   bytes alone, so it costs nothing in the bundle and works with no network:

     images   → object URL
     PDF      → object URL in an <iframe>; Chromium renders it natively, so a
                PDF viewer is not something this has to carry
     .desktop → the same link card the server build shows, parsed in 20 lines
     text     → escaped <pre>, whole, and coloured by core/syntax.js when
                the extension names a language it knows. TEXT_MAX is the only
                limit: what is previewed at all is previewed entire

   Rich rendering (Markdown, docx, pptx) is a *different provider*, not a
   bigger version of this one: see preview-http.js for the server-rendered
   variant, and preview-rich.js for the downloaded one.
   ═══════════════════════════════════════════════════════════════════════════ */

const IMG_RE = new RegExp(`\\.(${IMAGE_EXTENSIONS.join("|")})$`, "i");

let pvURL = null;

function vttHTML(source, mode = "transcript") {
  if (mode === "raw") return `<pre class="preview-raw">${esc(source)}</pre>`;
  const text = source.replace(/^\uFEFF/, "");
  if (!/^WEBVTT(?:\s|$)/.test(text)) {
    return '<div class="preview-error">Malformed WebVTT: missing WEBVTT header.</div>';
  }
  const cues = [];
  let seenCue = false;
  for (const block of text.split(/\r?\n\s*\r?\n/).slice(1)) {
    const lines = block.split(/\r?\n/);
    if (["NOTE", "STYLE", "REGION"].includes(lines[0]?.trim())) continue;
    const i = lines.findIndex((line) => line.includes("-->"));
    if (i < 0) {
      if (
        !seenCue && block.trim() && lines.every((line) => line.includes(":"))
      ) continue;
      if (block.trim()) {
        return '<div class="preview-error">Malformed WebVTT: cue is missing a timestamp.</div>';
      }
      continue;
    }
    const m = lines[i].trim().match(
      /^(\d{2}:\d{2}(?::\d{2})?\.\d{3})\s+-->\s+(\d{2}:\d{2}(?::\d{2})?\.\d{3})(?:\s+.*)?$/,
    );
    if (!m) {
      return '<div class="preview-error">Malformed WebVTT: invalid cue timestamp.</div>';
    }
    seenCue = true;
    let cue = lines.slice(i + 1).join("\n").trim();
    const voice = cue.match(/^<v(?:\s+([^>]+))?>([\s\S]*)$/);
    const speaker = voice?.[1]?.trim() || "";
    if (voice) cue = voice[2];
    cue = cue.replace(/<[^>]+>/g, "").trim();
    if (cue) cues.push([m[1], m[2], speaker, cue]);
  }
  if (!cues.length) {
    return '<div class="preview-empty">WebVTT file has no cues.</div>';
  }
  return `<div class="preview-transcript">${
    cues.map(([start, end, speaker, cue]) =>
      `<p class="preview-cue"><span class="preview-cue-time">${esc(start)} → ${
        esc(end)
      }</span><span class="preview-cue-text">${
        speaker ? `<strong>${esc(speaker)}:</strong> ` : ""
      }${esc(cue).replace(/\n/g, "<br>")}</span></p>`
    ).join("")
  }</div>`;
}

/* .desktop is an INI file; only Type=Link entries have anything to show. */
function desktopCard(text) {
  const e = {};
  let inEntry = false;
  for (const line of text.split(/\r?\n/)) {
    const s = line.trim();
    if (s.startsWith("[")) {
      inEntry = s === "[Desktop Entry]";
      continue;
    }
    if (!inEntry || !s || s.startsWith("#")) continue;
    const i = s.indexOf("=");
    if (i > 0) e[s.slice(0, i).trim()] = s.slice(i + 1).trim();
  }
  if (e.Type !== "Link" || !e.URL) return null;
  const url = esc(e.URL);
  return `<div class="pv-link">
      <h3>${esc(e.Name || "")}</h3>
      ${e.Comment ? `<p class="sub">${esc(e.Comment)}</p>` : ""}
      <p>🔗 <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a></p>
    </div>`;
}

const PreviewLocal = {
  revoke() {
    if (pvURL) {
      URL.revokeObjectURL(pvURL);
      pvURL = null;
    }
  },

  async render(node) {
    /* Decline an oversized text file before it is fetched, not after. The FSA
       port hands back a lazy File, so blob.size below costs nothing there — but
       HTTP.blob (adapters/http.js) does `await r.blob()`, which buffers the
       whole response, and by then a 400 MB .sql is already in memory. node.meta
       is filled by fillPreview before any provider runs, the same thing canEdit
       leans on. The blob.size test below stays: this one is only as good as the
       listing's size, and the limit should not depend on that being right. */
    if ((node.meta?.size ?? 0) > TEXT_MAX) return null;
    const blob = await FS.blob(node);
    if (!blob) return null;

    if (IMG_RE.test(node.name)) {
      pvURL = URL.createObjectURL(blob);
      return `<img class="pv-img" src="${pvURL}" alt="">`;
    }
    if (/\.pdf$/i.test(node.name)) {
      pvURL = URL.createObjectURL(blob.slice(0, blob.size, "application/pdf"));
      return `<iframe class="pv-pdf" src="${pvURL}" title="${
        esc(node.name)
      }"></iframe>`;
    }
    if (/\.html?$/i.test(node.name)) {
      pvURL = URL.createObjectURL(blob.slice(0, blob.size, "text/html"));
      return `<iframe class="pv-html" src="${pvURL}" title="${
        esc(node.name)
      }"></iframe>`;
    }
    if (/\.desktop$/i.test(node.name) && blob.size <= TEXT_MAX) {
      return desktopCard(await blob.text()) ?? null;
    }

    if (/\.vtt$/i.test(node.name)) {
      return vttHTML(await blob.text(), node.previewFormat);
    }

    if (blob.size <= TEXT_MAX) {
      let text;
      try {
        text = new TextDecoder("utf-8", { fatal: true }).decode(
          await blob.arrayBuffer(),
        );
      } catch (_) {
        return null;
      }
      if (text.includes("\0")) return null;
      /* core/syntax.js colours what it has a language for and escapes the rest;
         a plain .txt or an unknown extension takes the same path it always did.
         Colouring the whole file costs 22 ms of regex and 273 ms of DOM at the
         512 KB ceiling, measured in Chromium — once, on the click that asked
         for it. Highlighting a slice at a time would be cheaper and wrong: a
         triple-quoted string spanning the cut mis-tokenises, and syntax.js
         promises every character exactly once. */
      const lang = hlLang(node.name);
      /* A .json that parses is shown pretty-printed and foldable; one that does
         not (or a .jsonc with comments) is coloured as source like any other.
         This is the whole-file preview only. Browsing a .json as columns, the
         way core/jsonl.js does for .jsonl, wraps the FS and PREVIEW ports
         outside this provider and answers for its own virtual nodes before
         they get here — jsonHTML is a plain function it can call on a subtree. */
      const json = lang === "json" ? jsonHTML(text) : null;
      const body = json ?? (lang ? hlHTML(text, lang) : esc(text));
      return `<pre class="pv-text${json ? " pv-json" : ""}">${body}</pre>`;
    }
    return null;
  },
};

/* ═══ adapters/preview-rich.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Preview provider — rich rendering, fetched on demand.

   Markdown and .docx, to match what filemill's Python renderers produce, and
   reStructuredText, which only Python renders well. The libraries are an order
   of magnitude larger than this app, so they are not in the bundle: they are
   imported from a CDN the first time a file that needs one is previewed, and
   cached for the session.

   Source files and fenced code are not on that list. They are coloured by
   core/syntax.js, in the page, with no download and no switch to find —
   highlighting that only arrived over the network would be missing from
   exactly the offline build the app is built to be. What is left here is what
   genuinely needs a library.

   Which means this is the one thing in filemill that talks to the network, and
   the app's whole pitch is that your folder does not. So:

     · it is a setting, off-switchable, and the choice is remembered — consent
       that resets on every reload is not consent;
     · nothing about the file is ever *sent*. The request is for the library,
       not with your content;
     · every failure falls back to PreviewLocal — the raw <pre>, or nothing for
       a binary — so offline is a downgrade in fidelity, never a broken pane.

   Version pins are deliberate: "@latest" would mean a preview that renders
   differently next week, and a supply chain that can change under you.
   ═══════════════════════════════════════════════════════════════════════════ */

const offerRichToggle = (get, set) => {
  document.getElementById("s-previews").hidden = false;
  document.getElementById("s-rich").hidden = false;
  document.getElementById("s-rich-hr").hidden = false;
  const button = document.getElementById("s-rich");
  button.onclick = () => {
    set(!get());
    button.setAttribute("aria-checked", String(get()));
    render(true);
  };
  button.setAttribute("aria-checked", String(get()));
};

const CDN = {
  "markdown-it": "https://esm.sh/markdown-it@14.1.0",
  "markdown-it-footnote": "https://esm.sh/markdown-it-footnote@4.0.0",
  "markdown-it-deflist": "https://esm.sh/markdown-it-deflist@3.0.0",
  "markdown-it-task-lists": "https://esm.sh/markdown-it-task-lists@2.1.1",
  "markdown-it-anchor": "https://esm.sh/markdown-it-anchor@9.2.0",
  "mammoth": "https://esm.sh/mammoth@1.8.0",
  "pptx-vanilla-viewer":
    "https://cdn.jsdelivr.net/npm/pptx-vanilla-viewer@2.1.4/+esm",
  /* No JavaScript reStructuredText parser handles directives, tables or
     footnotes, and the one that exists emits unescaped HTML — so docutils runs
     as itself, on Pyodide. The runtime plus docutils is ~6 MB on the wire, 13 MB
     unpacked, once per session; docs/adr/0002-rst-in-browser.md has the
     figures. The release directory on jsDelivr is immutable, and docutils'
     version is fixed by that release's lock file, so one pin covers both. */
  "pyodide": "https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.mjs",
};

/* Tests point this at local stubs — there is no other way to exercise the
   loaded path without a network. */
const cdn = (name) =>
  (globalThis.FILEMILL_CDN && globalThis.FILEMILL_CDN[name]) || CDN[name];

const RICH_KEY = "filemill.rich";
const richEnabled = () => localStorage.getItem(RICH_KEY) !== "off";
const setRich = (on) => {
  localStorage.setItem(RICH_KEY, on ? "on" : "off");
  loaded.clear(); /* re-attempt after being switched on */
  pyInstance = null;
};

/* Cache the promise, not the module: two previews opened in the same tick must
   not each start a download. A rejected load is dropped so that reconnecting
   and clicking again retries, rather than being offline once and forever. */
const loaded = new Map();

function load(name) {
  if (loaded.has(name)) return loaded.get(name);
  const p = import(cdn(name))
    .then((m) => m.default || m)
    .catch((err) => {
      loaded.delete(name);
      throw err;
    });
  loaded.set(name, p);
  return p;
}

offerRichToggle(richEnabled, setRich);

const MD_RE = /\.(md|markdown)$/i;
const DOCX_RE = /\.docx$/i;
const RST_RE = /\.rst$/i;
const PPTX_RE = /\.pptx$/i;

const NOTE =
  `<p class="pv-note">Offline — showing the source. Rich rendering ` +
  `needs a one-time download.</p>`;

/* ── Markdown ────────────────────────────────────────────────────────────── */
let mdInstance = null;

async function markdown(text) {
  if (!mdInstance) {
    const [MarkdownIt, footnote, deflist, tasklists, anchor] = await Promise
      .all([
        load("markdown-it"),
        load("markdown-it-footnote"),
        load("markdown-it-deflist"),
        load("markdown-it-task-lists"),
        load("markdown-it-anchor"),
      ]);
    /* No highlight option: fences come out as <pre><code class="language-x">,
       and core/syntax.js colours them after they land — see hlFences. */
    mdInstance = new MarkdownIt({
      linkify: true,
      typographer: false,
      html: false,
    })
      .use(footnote).use(deflist).use(tasklists).use(anchor);

    /* filemill renders [[PageName]]; markdown-it has no such plugin, and the
       rule is small enough that matching it is cheaper than finding one. The
       target is resolved by the shared navigator, not by the browser, so the
       link stays inside the app. */
    mdInstance.core.ruler.push("wikilink", (state) => {
      for (const tok of state.tokens) {
        if (tok.type !== "inline") continue;
        for (const child of tok.children) {
          if (child.type !== "text" || !child.content.includes("[[")) continue;
          child.type = "html_inline";
          child.content = child.content.replace(
            /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,
            (_, target, label) =>
              `<a class="wikilink" href="#" data-wiki="${
                esc(target.trim())
              }">` +
              `${esc((label || target).trim())}</a>`,
          );
        }
      }
    });
  }
  return mdInstance.render(text);
}

/* ── reStructuredText ────────────────────────────────────────────────────── */
let pyInstance = null;

/* The interpreter is cached like mdInstance, as a promise so that two .rst
   previews in one tick share a single download; a failed boot is dropped so
   the next click retries. `raw` and file insertion are off: a document must
   not be able to inject markup or read the visitor's files. Level 5 keeps
   docutils' own error paragraphs out of the pane — the file still renders as
   far as it parses, which is how the Markdown side behaves too. */
const RST_PY = `
from docutils.core import publish_parts
publish_parts(src, writer_name="html5", settings_overrides={
    "raw_enabled": False,
    "file_insertion_enabled": False,
    "report_level": 5,
    "doctitle_xform": False,
    "initial_header_level": 1,
    "syntax_highlight": "none",
    "embed_stylesheet": False,
})["body"]
`;

async function rst(text) {
  if (!pyInstance) {
    pyInstance = load("pyodide")
      .then(async (m) => {
        const py = await m.loadPyodide({
