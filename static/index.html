          indexURL: cdn("pyodide").replace(/[^/]*$/, ""),
        });
        await py.loadPackage("docutils");
        return py;
      })
      .catch((err) => {
        pyInstance = null;
        throw err;
      });
  }
  const py = await pyInstance;
  py.globals.set("src", text);
  const html = await py.runPythonAsync(RST_PY);
  /* docutils writes `.. code-block:: x` as <pre class="code x literal-block">
     <code>; hlFences looks for <pre><code class="language-x">, the shape the
     Markdown renderers emit. Same colours for the same fence, either syntax. */
  return html.replace(
    /<pre class="code (\S+) literal-block"><code>/g,
    '<pre><code class="language-$1">',
  );
}

/* ── The provider ────────────────────────────────────────────────────────── */
const PreviewRich = {
  revoke() {
    PreviewLocal.revoke();
  },

  async render(node) {
    if (!richEnabled()) return PreviewLocal.render(node);

    if (
      !MD_RE.test(node.name) && !DOCX_RE.test(node.name) &&
      !RST_RE.test(node.name) && !PPTX_RE.test(node.name)
    ) {
      return PreviewLocal.render(node);
    }

    const blob = await FS.blob(node);
    if (!blob) return PreviewLocal.render(node);

    try {
      if (PPTX_RE.test(node.name)) {
        const { createPptxViewer } = await load("pptx-vanilla-viewer");
        const id = `pptx-${crypto.randomUUID()}`;
        queueMicrotask(async () => {
          const host = document.getElementById(id);
          if (!host) return;
          host.textContent = "Loading PowerPoint preview…";
          try {
            const viewer = createPptxViewer(host, {
              source: blob,
              editable: false,
              showToolbar: true,
              showThumbnails: true,
              onError: (message) => {
                host.textContent = `PowerPoint preview failed: ${message}`;
              },
            });
            host._pptxViewer = viewer;
          } catch (err) {
            host.textContent = `PowerPoint preview failed: ${
              err.message || err
            }`;
          }
        });
        return `<div id="${id}" class="pv-pptx" aria-live="polite">Loading PowerPoint preview…</div>`;
      }
      if (DOCX_RE.test(node.name)) {
        const mammoth = await load("mammoth");
        const { value } = await mammoth.convertToHtml(
          { arrayBuffer: await blob.arrayBuffer() },
        );
        return `<div class="pv-rich">${value}</div>`;
      }

      if (blob.size > TEXT_MAX) return PreviewLocal.render(node);
      const text = await blob.text();

      if (RST_RE.test(node.name)) {
        return `<div class="pv-rich">${await rst(text)}</div>`;
      }
      return `<div class="pv-rich">${await markdown(text)}</div>`;
    } catch (err) {
      /* Offline, blocked, or the CDN moved. The file is still readable. */
      if (PPTX_RE.test(node.name)) {
        return `<div class="preview-error">PowerPoint preview unavailable: ${
          esc(String(err.message || err))
        }</div>`;
      }
      const fallback = await PreviewLocal.render(node);
      return fallback ? NOTE + fallback : null;
    }
  },
};

const withPptxPreview = (provider) => ({
  revoke() {
    provider.revoke?.();
    PreviewRich.revoke();
  },
  render(node) {
    return PPTX_RE.test(node.name)
      ? PreviewRich.render(node)
      : provider.render(node);
  },
});

/* A wikilink resolves against the folder being browsed, not the web — so it
   selects a row in the column the file itself is in, exactly as clicking that
   row would. Only that directory is searched: walking the whole tree would mean
   reading every folder under the root to resolve one link. */
function openWikilink(target) {
  const col = path.length - 1;
  const kids = visibleKids(path[col]);
  const want = target.toLowerCase();
  const ri = kids.findIndex((k) => {
    const n = k.name.toLowerCase();
    return n === want || n === want + ".md" ||
      splitName(k.name)[0].toLowerCase() === want;
  });
  if (ri >= 0) choose(col, kids[ri]);
}

document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("a.wikilink");
  if (!a) return;
  e.preventDefault();
  openWikilink(a.dataset.wiki);
});

/* ═══ adapters/router-hash.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Router — the fragment, for the static build.

       #r=workspace&p=src/core/state.js

   A hash and not a query string, because the static build has to survive being
   opened from anywhere: a `file://` page, a bare `python3 -m http.server`, a
   gist, a USB stick. A path-shaped URL needs a server that rewrites; a query
   string needs one that ignores it. A hash needs nothing.

   `r` names the *root folder*, and it has to be there because a
   FileSystemDirectoryHandle is not a path: the URL cannot name a folder the
   browser has not already granted. It is matched against the remembered roots
   in IndexedDB, so a link only re-opens a folder you have opened before — by
   design, since the alternative would be a page that can name arbitrary
   directories on your disk. Folder *names* are what is matched, so two
   different folders with the same basename resolve to the more recent one.
   ═══════════════════════════════════════════════════════════════════════════ */

const encSeg = (s) => encodeURIComponent(s).replace(/%2F/gi, "%2F");

/* A file:// page has an opaque origin and pushState throws SecurityError on it.
   That page cannot open a folder either (see showBlocked), so there is nothing
   to address — but the test suite does mount a fake tree there, and a throw on
   every render would be fatal. Fail once, then stay quiet. */
let dead = false;

const RouterHash = {
  read() {
    const h = location.hash.replace(/^#/, "");
    if (!h) return null;
    const q = new URLSearchParams(h);
    const p = q.get("p") || "";
    return {
      root: q.get("r") || null,
      path: p.split("/").filter(Boolean).map(decodeURIComponent),
    };
  },

  write({ root, path }, replace) {
    if (dead) return;
    const q = "#r=" + encSeg(root) +
      (path.length ? "&p=" + path.map(encSeg).join("/") : "");
    if (q === location.hash) return;
    /* history.*State, not an assignment to location.hash: assigning always
       pushes, and it fires hashchange, which would loop straight back in
       through onNavigate. */
    try {
      history[replace ? "replaceState" : "pushState"](null, "", q);
    } catch (err) {
      dead = true;
    }
  },

  onNavigate(cb) {
    addEventListener("hashchange", () => cb(RouterHash.read()));
  },
};

/* ═══ adapters/storage.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Remembering folders across sessions.

   FileSystemHandle is structured-cloneable, so the picked roots survive in
   IndexedDB and the OS folder dialog is not needed twice for the same folder.
   What does NOT survive is the *permission*: Chrome usually downgrades it to
   "prompt" when the tab session ends, and requestPermission() needs a user
   gesture. So a remembered folder is either re-mounted silently (still
   'granted') or offered as a one-click button on the welcome screen.

   A record is the handle *and* the selection chain inside it:

       { handle: FileSystemDirectoryHandle, path: ["src", "core", "nav.js"] }

   The chain is a list of names rather than nodes, because a node is built from
   a read that has not happened yet when the page loads, and a name survives
   anything. It is the same list a deep link carries, so one walk restores both.
   ═══════════════════════════════════════════════════════════════════════════ */

const RECENT_MAX = 8;

/* Databases written before the chain existed hold a bare handle. Normalising on
   read is what keeps those folders in the list instead of dropping eight of
   them the first time a user loads a newer build. */
const asRoot = (r) =>
  (r && r.kind === "directory") ? { handle: r, path: [] } : r;

const idb = () =>
  new Promise((res, rej) => {
    const r = indexedDB.open("filemill", 1);
    r.onupgradeneeded = (e) => e.target.result.createObjectStore("kv");
    r.onsuccess = (e) => res(e.target.result);
    r.onerror = (e) => rej(e.target.error);
  });

const kvGet = (db, key) =>
  new Promise((res, rej) => {
    const r = db.transaction("kv", "readonly").objectStore("kv").get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });

const kvPut = (db, key, value) =>
  db.transaction("kv", "readwrite").objectStore("kv").put(value, key);

/* Move a root to the front of the list. `path` is the selection chain inside
   it; leave it out and whatever was stored stays, because picking the same
   folder again from the OS dialog must not forget where you were in it. */
async function rememberRoot(handle, path) {
  try {
    const db = await idb();
    const kept = [];
    let had = null;
    for (const r of ((await kvGet(db, "recent")) || []).map(asRoot)) {
      if (await r.handle.isSameEntry(handle)) {
        had = r; /* same folder, one entry */
      } else kept.push(r);
    }
    kvPut(
      db,
      "recent",
      [{ handle, path: path ?? had?.path ?? [] }, ...kept]
        .slice(0, RECENT_MAX),
    );
  } catch (err) {
    console.warn("could not remember folder:", err);
  }
}

async function recallRoots() {
  try {
    const db = await idb();
    return ((await kvGet(db, "recent")) || []).map(asRoot);
  } catch (err) {
    return [];
  } /* private mode, file://, … — just ask */
}

/* The chain stored for one folder, in the shape applyPath already speaks. Null
   when the folder is new, or was last left sitting on its own root — there is
   nothing to restore then, and mounting plainly is the honest result. */
async function recallView(handle) {
  for (const r of await recallRoots()) {
    if (await r.handle.isSameEntry(handle)) {
      return r.path.length ? { root: handle.name, path: r.path } : null;
    }
  }
  return null;
}

/* ═══ adapters/app-fsa.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Static build — boot, folder picker, welcome screen.

   The only file that knows this is the local-folder flavour of the app. It
   picks the adapters (fsa + preview-rich + router-hash, imported below) and
   owns the one entry point into the tree, mount(). ../entry-static.js is what
   the page loads; this is the module it ends with.
   ═══════════════════════════════════════════════════════════════════════════ */

document.getElementById("bar").insertAdjacentHTML(
  "beforeend",
  `<button class="tb" id="open" title="Open a folder on this machine">Open Folder…</button>`,
);
document.body.insertAdjacentHTML(
  "beforeend",
  `<div id="welcome"><svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.4 3.2h4.1l1.3 1.7h7.8c.6 0 1 .4 1 1v7c0 .6-.4 1-1 1H1.4c-.6 0-1-.4-1-1V4.2c0-.6.4-1-1-1z"/></svg><h1 id="w-title">Filemill</h1><p id="w-msg">Pick a folder on this machine to browse it in Miller columns. Nothing leaves the browser — the folder is read locally, on demand.</p><button class="btn" id="w-pick">Choose Folder…</button><div id="w-recent" hidden><div class="rec-head">Recently opened</div><div class="rec-list"></div></div><p class="note">Needs a Chromium-based desktop browser (File System Access API).</p></div>`,
);
const welcome = document.getElementById("welcome");

/* The load-time work sort.js, layout.js and settings.js did as classic scripts,
   in the order they used to load. */
initSort();
setSortKids(sortKids);
setActions({ choose, refreshColumn, renderCrumbs, saySt, unfoldTo });
setSortActions({ render });
setDeepLinkActions({ render, colCache });
initLayout(render);
initSettings();

/* Adapters define themselves; the app entry is what chooses. Selecting here
   rather than at the bottom of each adapter file means a page may load more
   than one of them — which the server build does — without import order
   silently deciding which wins. */
useFilesystem(withCsv(withVirtual(FSA)));
usePreview(withCsvPreview(withVirtualPreview(PreviewRich)));
/* The router is already the one place that hears "the selection changed": core
   writes the location there and nowhere else. Wrapping write() here, rather
   than adding a hook to core, keeps remembering in the only file that knows
   this build has remembered folders at all — the server build has none. */
useRouter({
  ...RouterHash,
  write(loc, replace) {
    RouterHash.write(loc, replace);
    keepView(loc);
  },
});

/* A deep link read at startup, held until a root is mounted that can satisfy
   it — the URL names a folder, but a folder is not browsable until the browser
   has granted it. */
let pendingLoc = null;
const setPendingLoc = (loc) => pendingLoc = loc;

/* ── Where the user was, per folder ─────────────────────────────────────────
   Saved against the mounted root and restored on the way back in. `mounted` is
   set only once a root is fully mounted: a save fired mid-mount would store the
   bare root and overwrite the very chain the mount is about to restore. */
let mounted = null, pendingView = null, viewTimer = null, keptAt = null;

/* Debounced, because walking a column with ↓ held is one location change per
   keystroke, and an IndexedDB write per keystroke is the O(entries) mistake in
   a different costume. Unchanged locations return before touching the timer:
   render() also runs on resize and on the font load, and rescheduling on those
   would let a busy page starve the write it is waiting to make. */
function keepView(loc) {
  if (!mounted || !loc) return;
  const at = loc.path.join("/");
  if (at === keptAt) return;
  keptAt = at;
  pendingView = { handle: mounted, path: loc.path };
  clearTimeout(viewTimer);
  viewTimer = setTimeout(flushView, 400);
}

/* Also flushed on the way out. A tab closed 100 ms after the last click would
   otherwise lose that click, and "it forgot the last thing I did" is the
   failure people actually notice. */
function flushView() {
  clearTimeout(viewTimer);
  const p = pendingView;
  pendingView = null;
  if (p) rememberRoot(p.handle, p.path);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushView();
});

async function mount(handle, loc) {
  const node = FS.node(handle.name, handle);
  mounted = null;
  keptAt = null;
  welcome.hidden = true;
  await mountRoot(node, handle.name + " — Filemill");
  document.title = handle.name + " — Filemill";
  render();
  await FS.ensureLoaded(node);

  /* A link in the address bar beats the remembered chain: the user followed it
     just now, where the chain is only where they happened to stop last time.
     applyPath walks as far as the names still exist and stops, so a folder
     deleted since the last visit lands them at the deepest part that is real
     rather than on a selection that is not. */
  const want = loc ?? takePending(handle.name) ?? await recallView(handle);
  if (want && want.path.length) await applyPath(want.path);
  else render();
  mounted = handle;
  startRouting();
}

/* A pending link only applies to the root it named — mounting some other folder
   must not try to walk that folder's path into it. */
function takePending(rootName) {
  const p = pendingLoc;
  pendingLoc = null;
  return p && (!p.root || p.root === rootName) ? p : null;
}

async function pickFolder() {
  if (!window.showDirectoryPicker) return showBlocked("unsupported");
  try {
    const handle = await window.showDirectoryPicker({
      mode: "read",
      id: "filemill",
    });
    await rememberRoot(handle);
    await mount(handle);
  } catch (err) {
    if (err.name === "AbortError") return;
    /* Chrome refuses the picker on an opaque origin — i.e. a file:// page */
    if (err.name === "SecurityError") return showBlocked("file");
    console.error(err);
  }
}

/* Opening a remembered folder. 'granted' mounts straight away; anything else
   needs requestPermission(), which is only allowed from this click. */
async function openRemembered(root) {
  const perm = await root.handle.queryPermission({ mode: "read" });
  if (
    perm === "granted" ||
    await root.handle.requestPermission({ mode: "read" }) === "granted"
  ) {
    return mount(root.handle);
  }
}

function renderRecents(roots) {
  const box = document.getElementById("w-recent");
  const list = box.querySelector(".rec-list");
  list.textContent = "";
  roots.forEach((r) => {
    const b = document.createElement("button");
    b.className = "rec";
    b.innerHTML =
      `<svg viewBox="0 0 16 16" aria-hidden="true">${FOLDER_PATH}</svg>`;
    b.appendChild(document.createTextNode(r.handle.name));
    /* Say where the click will land. The chain is the point of the button, and
       a folder that reopens three columns deep is a surprise worth spending
       one line of the welcome screen on. */
    if (r.path.length) {
      const where = document.createElement("span");
      where.className = "rec-where";
      where.textContent = "› " + r.path.join(" › ");
      b.appendChild(where);
    }
    b.onclick = () => openRemembered(r);
    list.appendChild(b);
  });
  box.hidden = !roots.length;
}

/* Both failure modes end at the welcome screen, since there is nothing to show
   without a folder. Keep the wording actionable — the fix differs per case. */
function showBlocked(why) {
  welcome.hidden = false;
  document.getElementById("w-pick").hidden = why === "unsupported";
  document.getElementById("w-recent").hidden = true;
  document.getElementById("w-msg").innerHTML = why === "unsupported"
    ? "This browser has no File System Access API, so local folders cannot be opened. " +
      "Try Chrome, Edge or another Chromium-based desktop browser."
    : "Chrome blocks folder access on <code>file://</code> pages. Serve this file over " +
      "localhost instead:<br><code>python3 -m http.server -d " +
      "&lt;folder containing index.html&gt;</code><br>then open " +
      "<code>http://localhost:8000/index.html</code>.";
}

document.getElementById("open").onclick = pickFolder;
document.getElementById("w-pick").onclick = pickFolder;

(async function start() {
  if (!window.showDirectoryPicker) return showBlocked("unsupported");
  if (location.protocol === "file:") return showBlocked("file");

  pendingLoc = ROUTER.read();
  const roots = await recallRoots();
  if (!roots.length) return;

  /* A link names its root, so prefer that folder over the most recent one —
     otherwise reopening a bookmark would silently browse the wrong tree. */
  const wanted = pendingLoc?.root
    ? roots.find((r) => r.handle.name === pendingLoc.root)
    : null;
  const first = wanted || roots[0];

  /* queryPermission needs no gesture, so a folder still granted from an earlier
     visit opens with no dialog at all — and mount() puts the user back on the
     chain it stored, so the whole return trip costs no clicks */
  if (await first.handle.queryPermission({ mode: "read" }) === "granted") {
    return mount(first.handle);
  }
  renderRecents(roots);
})();

document.fonts.ready.then(() => render(true));

/* ═══ core/debug.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Test surface.

   The browser tests in static/ and server/tests/ reach app internals as page
   globals — page.evaluate("sel"), "mount(__local())", "setSort(…)". Module
   scope hides them, so each entry module republishes the names the tests read,
   as live getters. Nothing in the app itself goes through here; the surface
   goes away when the static tests move under pytest (TASKS.md [25]).
   ═══════════════════════════════════════════════════════════════════════════ */

/* Each value is a getter, or a property descriptor when a test also assigns. */
function expose(bindings) {
  for (const [name, b] of Object.entries(bindings)) {
    const desc = typeof b === "function" ? { get: b } : b;
    Object.defineProperty(globalThis, name, { ...desc, configurable: true });
  }
}

function exposeCore() {
  expose({
    sel: () => sel,
    path: () => path,
    focusCol: () => focusCol,
    widths: () => widths,
    folded: () => folded,
    pvToken: () => pvToken,
    state: () => state,
    root: () => root,
    finder: () => finder,
    stage: () => stage,
    strip: () => strip,
    welcome: () => document.getElementById("welcome"),
    gear: () => gear,
    FS: () => FS,
    PREVIEW: () => PREVIEW,
    ROUTER: () => ROUTER,
    render: () => render,
    colCache: () => colCache,
    refreshColumn: () => refreshColumn,
    applyPath: () => applyPath,
    setSort: () => setSort,
    loadSort: () => loadSort,
    ensureMeta: () => ensureMeta,
    visibleKids: () => visibleKids,
    previewTarget: () => previewTarget,
    stripSpan: () => stripSpan,
    foldUnit: () => foldUnit,
    range: () => range,
    taSearch: () => taSearch,
    TA_IDLE: () => TA_IDLE,
  });
}

/* ═══ entry-static.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Static edition — the one module the page loads.

   core/ is the shared UI and knows nothing about where its nodes come from;
   adapters/ chooses. This file names the adapters of the local-folder flavour
   and the app module that wires them (app-fsa.js), which is the only module
   that runs anything at load time. entry-server.js is the counterpart.

   Import order is evaluation order. state.js first: it pulls in shell.js (the
   markup every other module queries) and, through the core cycle, the rest.
   static/build-index.py walks this graph and inlines it in the same order.
   ═══════════════════════════════════════════════════════════════════════════ */


/* Test surface — see core/debug.js. */

exposeCore();
expose({
  mount: () => mount,
  FSA: () => FSA,
  recallRoots: () => recallRoots,
  recallView: () => recallView,
  rememberRoot: () => rememberRoot,
  pendingLoc: { get: () => pendingLoc, set: setPendingLoc },
});
