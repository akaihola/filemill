<!DOCTYPE html>
<html lang="en" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Filemill</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   FILEMILL — Miller columns over a real local directory tree.
   Design tokens. Everything downstream is derived from these.
   ═══════════════════════════════════════════════════════════════════════════ */
@font-face {
  font-family: "seti";
  src: url("../vendor/seti.woff")
    format("woff"); /* build inlines this as base64 */
  font-display: block;
}

:root {
  --font:
    -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue",
    sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, monospace;

  --fs-row: 12px;
  --fs-head: 12px;
  --fs-meta: 11px;

  /* density-driven */
  --row-h: 21px;
  --row-gap: 1px;
  --head-h: 26px;
  --col-pad: 4px; /* inset gutter each side of a row */
  --gutter: 10px; /* space between columns — where the trail lives */
  --radius: 5px;
  --spine-w: 34px;

  /* light palette */
  --accent: #2f6df6;
  --accent-weak: color-mix(in srgb, var(--accent) 13%, transparent);
  --accent-soft: color-mix(in srgb, var(--accent) 30%, transparent);
  --accent-ink: color-mix(in srgb, var(--accent) 88%, #000 12%);

  --chrome: #e7e7ec; /* window / gutter background */
  --surface: #ffffff; /* focused column */
  --surface-2: #fbfbfd; /* preview */
  --ink: #16171a;
  --ink-2: #55575e; /* secondary text */
  --ink-3: #8b8d96; /* tertiary / counts */
  --hairline: rgba(0, 0, 0, 0.085);
  --hairline-2: rgba(0, 0, 0, 0.14);
  --hover: rgba(0, 0, 0, 0.045);
  --shadow-col: 0 0 0 0.5px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.05);
  --recede: #000; /* what ancestors fade toward */
  --recede-amt: 3.2%; /* per-level recession */
}

:root[data-density="comfortable"] {
  --row-h: 26px;
  --head-h: 30px;
  --fs-row: 13px;
  --radius: 7px;
  --col-pad: 5px;
  --gutter: 13px;
}

:root[data-theme="dark"] {
  --accent: #5b8dff;
  --accent-ink: color-mix(in srgb, var(--accent) 92%, #fff 8%);
  --chrome: #1b1d21;
  --surface: #26292e;
  --surface-2: #22252a;
  --ink: #e9eaee;
  --ink-2: #a4a8b2;
  --ink-3: #71757f;
  --hairline: rgba(255, 255, 255, 0.075);
  --hairline-2: rgba(255, 255, 255, 0.13);
  --hover: rgba(255, 255, 255, 0.06);
  --shadow-col: 0 0 0 0.5px rgba(0, 0, 0, 0.5), 0 1px 4px rgba(0, 0, 0, 0.35);
  --recede: #000;
  --recede-amt: 4.5%;
}

* {
  box-sizing: border-box;
}
html, body {
  height: 100%;
}
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-row);
  color: var(--ink);
  background: var(--chrome);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── App shell ─────────────────────────────────────────────────────────── */
#shell {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ── Breadcrumb / toolbar ──────────────────────────────────────────────── */
#bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 2px;
  height: 36px;
  padding: 0 8px 0 10px;
  background: color-mix(in srgb, var(--chrome) 70%, var(--surface));
  border-bottom: 1px solid var(--hairline);
  font-size: var(--fs-head);
}
#crumbs {
  display: flex;
  align-items: center;
  gap: 1px;
  min-width: 0;
  overflow: hidden;
}
#search-form {
  position: relative;
  margin-left: 8px;
}
#search-bar {
  width: min(240px, 28vw);
  height: 25px;
  padding: 3px 8px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  font: inherit;
}
#search-results {
  position: absolute;
  top: 31px;
  left: 0;
  z-index: 50;
  width: min(420px, 80vw);
  padding: 5px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 7px;
  box-shadow: 0 5px 18px #0002;
}
.search-list {
  display: grid;
  gap: 2px;
}
.search-result {
  display: grid;
  gap: 2px;
  padding: 5px 7px;
  text-align: left;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: 4px;
  font: inherit;
  cursor: pointer;
}
.search-result:hover, .search-result:focus {
  background: var(--hover);
}
.search-path {
  color: var(--accent);
}
.search-context {
  overflow: hidden;
  color: var(--ink-2);
  text-overflow: ellipsis;
  white-space: nowrap;
}
@media (max-width: 620px) {
  #search-bar {
    width: 125px;
  }
}
.crumb {
  padding: 3px 7px;
  border-radius: 5px;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
}
.crumb:hover {
  background: var(--hover);
  color: var(--ink);
}
.crumb.here {
  color: var(--ink);
  font-weight: 590;
}
.crumb-sep {
  color: var(--ink-3);
  opacity: 0.55;
  user-select: none;
}
.spacer {
  flex: 1;
}

/* Shown only by the server build, while a local folder has replaced the served
   tree — the one state where the address bar cannot describe what you see. */
#local-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-right: 6px;
  padding: 2px 4px 2px 7px;
  border-radius: 11px;
  white-space: nowrap;
  font-size: var(--fs-meta);
  color: var(--ink-2);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
}
#local-badge[hidden] {
  display: none;
}
#local-badge svg {
  width: 12px;
  height: 12px;
  fill: var(--accent);
}
#local-badge button {
  font: inherit;
  line-height: 1;
  color: var(--ink-3);
  cursor: pointer;
  background: transparent;
  border: 0;
  border-radius: 50%;
  padding: 2px 4px;
}
#local-badge button:hover {
  background: var(--hover);
  color: var(--ink);
}

/* ── Toolbar buttons ───────────────────────────────────────────────────── */
.tb {
  font: inherit;
  font-size: var(--fs-head);
  line-height: 1;
  color: var(--ink-2);
  background: transparent;
  border: 0;
  border-radius: 6px;
  height: 24px;
  padding: 0 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.tb:hover, .tb[aria-expanded="true"] {
  background: var(--hover);
  color: var(--ink);
}
.tb-ico {
  width: 14px;
  height: 14px;
  fill: currentColor;
  opacity: 0.8;
}
#gear {
  width: 26px;
  padding: 0;
  justify-content: center;
  font-size: 14px;
}
#settings {
  position: absolute;
  top: 34px;
  right: 8px;
  z-index: 40;
  min-width: 210px;
  padding: 5px;
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--hairline);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
}
#settings[hidden] {
  display: none;
}
#settings .grp {
  padding: 6px 9px 3px;
  font-size: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-3);
}
#settings button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  font: inherit;
  font-size: var(--fs-head);
  text-align: left;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: 6px;
  padding: 5px 9px;
  cursor: pointer;
}
#settings button:hover {
  background: var(--hover);
}
#settings button .tick {
  width: 13px;
  color: var(--accent);
  opacity: 0;
}
#settings button[aria-checked="true"] .tick {
  opacity: 1;
}
#settings hr {
  border: 0;
  border-top: 1px solid var(--hairline);
  margin: 5px 4px;
}
#settings hr[hidden], #settings button[hidden] {
  display: none;
}
#settings .hint {
  margin-left: auto;
  padding-left: 12px;
  color: var(--ink-3);
  font-size: 10px;
}
#settings .ver {
  padding: 2px 9px 5px;
  color: var(--ink-3);
  font-size: var(--fs-head);
}

/* ═══════════════════════════════════════════════════════════════════════════
   Horizontal scroll = condensing control.
   #finder scrolls; #rail supplies the scroll range; #stage sticks to the
   viewport so nothing actually translates — the scroll position is read as a
   0–100% dial that folds columns from the left.
   ═══════════════════════════════════════════════════════════════════════════ */
#finder {
  flex: 1;
  min-height: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--hairline-2) transparent;
}
/* layout() moves the dial by setting scrollLeft; scroll-behavior makes that one
   assignment glide, and applyScroll paints the fold from the scroll events it
   fires — the exact motion a hand scroll produces, with no JS animation. */
@media (prefers-reduced-motion: no-preference) {
  #finder {
    scroll-behavior: smooth;
  }
}
#finder::-webkit-scrollbar {
  height: 9px;
}
#finder::-webkit-scrollbar-thumb {
  background: var(--hairline-2);
  border-radius: 5px;
  border: 2px solid transparent;
  background-clip: content-box;
}
#rail {
  height: 100%;
}
#stage {
  position: sticky;
  left: 0;
  height: 100%;
  width: var(--stage-w, 100%);
  overflow: hidden;
}
#strip {
  display: flex;
  align-items: stretch;
  height: 100%;
  gap: var(--gutter);
  padding: var(--gutter);
  /* overflow the stage when the columns don't fit, stretch to it when they do
     — the latter is what lets #preview's flex-grow claim the spare space */
  width: max-content;
  min-width: 100%;
  will-change: transform;
}
.pv-fullscreen #bar, .pv-fullscreen #status {
  display: none;
}
.pv-head {
  gap: 8px;
}
.pv-actions {
  display: flex;
  gap: 5px;
  margin-left: auto;
}
.pv-action, #pv-view, #pv-fullscreen {
  font: inherit;
  font-size: var(--fs-meta);
  color: var(--ink-2);
  padding: 3px 8px;
  border: 1px solid var(--hairline);
  border-radius: 5px;
  background: none;
  cursor: pointer;
  text-decoration: none;
}
.pv-action:hover, #pv-view:hover, #pv-fullscreen:hover {
  background: var(--hover);
}
.pv-action:focus-visible, #pv-view:focus-visible, #pv-fullscreen:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* the trail overlay is painted between columns */
#trail {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: visible;
}
#trail path {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linecap: round;
}
#trail path.thread {
  stroke: var(--accent-soft);
}

/* ── A column ──────────────────────────────────────────────────────────── */
.col {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-radius: 10px;
  background: var(--surface);
  box-shadow: var(--shadow-col);
  transition: background-color
    0.18s; /* NOT width: folding tracks the scroll 1:1 */
  --fold: 0;
}
/* Depth recession: ancestors sink toward the chrome, focus stays bright. */
.col[data-depth="1"] {
  background: color-mix(
    in srgb,
    var(--surface) calc(100% - 1 * var(--recede-amt)),
    var(--recede)
  );
}
.col[data-depth="2"] {
  background: color-mix(
    in srgb,
    var(--surface) calc(100% - 2 * var(--recede-amt)),
    var(--recede)
  );
}
.col[data-depth="3"] {
  background: color-mix(
    in srgb,
    var(--surface) calc(100% - 3 * var(--recede-amt)),
    var(--recede)
  );
}
.col[data-depth="4"] {
  background: color-mix(
    in srgb,
    var(--surface) calc(100% - 4 * var(--recede-amt)),
    var(--recede)
  );
}
.col[data-depth="5"] {
  background: color-mix(
    in srgb,
    var(--surface) calc(100% - 5 * var(--recede-amt)),
    var(--recede)
  );
}

/* Column header — the thing macOS Finder is missing. */
.col-head {
  flex: 0 0 auto;
  height: var(--head-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 9px;
  border-bottom: 1px solid var(--hairline);
  border-radius: 10px 10px 0 0;
  font-size: var(--fs-head);
  font-weight: 590;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
}
.col-head .name {
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}
.col-head .name > span {
  direction: ltr;
  unicode-bidi: embed;
}
.col-head .count {
  margin-left: auto;
  font-size: var(--fs-meta);
  font-weight: 450;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
/* ⟳ sits in the header of every column but only shows on the one being read or
   pointed at: a button on all seven at once is noise, and the key does the same
   job without one. `visibility` rather than `display` so the header never
   re-measures when it appears — a width change here would relay out the rows. */
.col-head .rf {
  all: unset;
  visibility: hidden;
  cursor: pointer;
  margin-right: -3px;
  padding: 0 3px;
  border-radius: 4px;
  font-size: 12px;
  line-height: 1;
  color: var(--ink-3);
}
.col.focus .col-head .rf, .col:hover .col-head .rf {
  visibility: visible;
}
.col-head .rf:hover {
  color: var(--accent);
  background: var(--hairline);
}
.col.busy .col-head .rf {
  visibility: visible;
  color: var(--accent);
  animation: rf-spin 0.7s linear infinite;
}
@keyframes rf-spin {
  to {
    transform: rotate(360deg);
  }
}
/* No rule hides this while a column folds, and that is deliberate. `folding` is
   not a transient animation state: layout.js sets it on column `folded`, so at
   rest — nothing scrolled — it sits on the root column permanently. Hiding the
   button there hid it on the root for ever, and on whichever column the dial
   was mid-fold on. A spine already has `display: none` on its whole header, and
   a folding header carries an opacity the button inherits, so both cases are
   handled without naming either. */

/* Ordering by size or date cannot begin until every row has been read, and that
   is the one thing in this app that takes a visible moment. The column keeps
   showing its names in name order meanwhile and spins beside the count, so a
   wait is never mistaken for a sort that did nothing. `::before` on the count,
   because the count is already there — an element that appears would re-measure
   the header and relay out every row underneath it. */
.col.sorting .col-head .count::before {
  content: "";
  display: inline-block;
  vertical-align: -1px;
  width: 9px;
  height: 9px;
  margin-right: 5px;
  border-radius: 50%;
  border: 1.5px solid var(--hairline-2);
  border-top-color: var(--accent);
  animation: spin 0.7s linear infinite;
}

.col.focus .col-head {
  color: var(--ink);
}
.col.focus .col-head::after {
  content: "";
  position: absolute;
  left: 9px;
  right: 9px;
  top: calc(var(--head-h) - 2px);
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}

/* Scroll body + edge fade so a long list never looks truncated by accident */
.col-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--col-pad) 0;
  scrollbar-width: thin;
  scrollbar-color: var(--hairline-2) transparent;
}
.col-body::-webkit-scrollbar {
  width: 8px;
}
.col-body::-webkit-scrollbar-thumb {
  background: var(--hairline-2);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: content-box;
}
.col::after {
  /* bottom scroll fade */
  content: "";
  position: absolute;
  left: 1px;
  right: 1px;
  bottom: 1px;
  height: 22px;
  border-radius: 0 0 10px 10px;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(to top, var(--surface), transparent);
  transition: opacity 0.15s;
}
.col.scrollable-down::after {
  opacity: 0.95;
}

/* a directory whose entries are still being read, or that we may not read */
.col-note {
  padding: 10px 12px;
  color: var(--ink-3);
  font-size: var(--fs-meta);
  display: flex;
  align-items: center;
  gap: 7px;
}
.spinner {
  flex: 0 0 auto;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1.5px solid var(--hairline-2);
  border-top-color: var(--accent);
  animation: spin 0.7s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ── Rows ──────────────────────────────────────────────────────────────── */
.row {
  display: flex;
  align-items: center;
  gap: 7px;
  height: var(--row-h);
  margin: var(--row-gap) var(--col-pad);
  padding: 0 6px 0 6px;
  border-radius: var(--radius);
  cursor: default;
  user-select: none;
  white-space: nowrap;
  border: 1px solid transparent;
  position: relative;
}
.row .label {
  display: flex;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.row .label .stem {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .label .dim {
  flex: 0 0 auto;
}
.row .label .dim {
  color: var(--ink-3);
} /* extension is de-emphasised */
.row .chev {
  flex: 0 0 auto;
  color: var(--ink-3);
  font-size: 11px;
  opacity: 0.7;
  transform: translateY(-0.5px);
}
.row.dotfile {
  opacity: 0.5;
}
/* A directory can hold tens of thousands of entries, and every forced layout
   would otherwise walk all of them. Rows have a fixed height, so off-screen
   ones can be skipped entirely without disturbing the scroll geometry. */
.row {
  content-visibility: auto;
  contain-intrinsic-size: auto var(--row-h);
}
.row:hover:not(.sel) {
  background: var(--hover);
}

/* ── Icons: Seti glyph for files, drawn folder for directories ─────────── */
.ico {
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  line-height: 1;
}
.ico.seti {
  font-family: "seti";
  font-size: 14px;
}
.ico.dir svg {
  width: 14px;
  height: 14px;
  fill: var(--ink-3);
}

/* Three distinct selection states — all legible, unlike Finder's grey-out. */
/* 1. FOCUS column: solid accent — "you are here". */
.col.focus .row.sel {
  background: var(--accent);
  color: #fff;
}
.col.focus .row.sel .chev,
.col.focus .row.sel .label .dim {
  color: rgba(255, 255, 255, 0.72);
}
.col.focus .row.sel .ico.seti {
  color: #fff !important;
}
.col.focus .row.sel .ico.dir svg {
  fill: #fff;
}

/* 2. ANCESTOR columns: tinted pill — "the trail you walked". */
.col.ancestor .row.sel {
  background: var(--accent-weak);
  border-color: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 560;
}
.col.ancestor .row.sel .chev {
  color: var(--accent-soft);
}
.col.ancestor .row.sel .ico.dir svg {
  fill: var(--accent);
}

/* 3. DESCENDANT columns: ghost pill — "remembered, not active". */
.col.descendant .row.sel {
  background: transparent;
  border-color: var(--hairline-2);
  border-style: dashed;
  color: var(--ink-2);
}

/* keyboard cursor ring, independent of selection */
.row.cursor {
  box-shadow: 0 0 0 2px var(--accent), 0 0 0 4px var(--accent-weak);
}
.col.focus .row.cursor.sel {
  box-shadow: none;
}

/* ── Folding: continuous, driven straight off the scroll dial ──────────── */
/* --fold runs 0→1 across the column's own step of the dial. Width is
   interpolated in JS; the crossfade below rides the same number, so the
   column narrows and turns into its spine in one continuous motion. */
.col.spine {
  width: var(--spine-w) !important;
  cursor: pointer;
}
.col.spine .col-head, .col.spine .col-body {
  display: none;
}
.col.folding .col-head, .col.folding .col-body {
  opacity: clamp(0, calc(1.6 - var(--fold) * 2), 1);
}
.spine-label {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 9px 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}
.col.spine .spine-label {
  opacity: 1;
}
.col.folding .spine-label {
  opacity: clamp(0, calc(var(--fold) * 2 - 1), 1);
}
/* the chosen child stays visible even when its column is folded away */
.spine-label .dot {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent-weak);
  box-shadow: inset 0 0 0 1px var(--accent-soft);
}
.spine-label .txt {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-size: var(--fs-meta);
  color: var(--ink-2);
  letter-spacing: 0.2px;

/* ── Preview pane ──────────────────────────────────────────────────────── */
/* grow into spare space, never shrink below the target reading width */
#preview {
  flex: 1 0 var(--preview-w, 520px);
  border-radius: 10px;
  background: var(--surface-2);
  box-shadow: var(--shadow-col);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
@media (max-width: 600px) {

  }
}
@media (max-width: 600px) and (orientation: portrait) {
  .pv-fullscreen #preview {
    touch-action: pan-y;
  }
}
#preview .pv-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 22px 26px;
  container-type: size;
} /* what .pv-html's 100cqh resolves against */
.pv-hero {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--hairline);
}
.pv-fullscreen #strip {
  gap: 0;

}
.pv-fullscreen #strip > .col, .pv-fullscreen #trail {

}
.pv-fullscreen #preview {
  flex: 1 1 auto;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.pv-fullscreen #preview .pv-body {
  padding: 0;
}
.pv-hero .ico {
  width: 42px;
  height: 42px;
  flex-basis: 42px;
}
.pv-hero .ico.seti {
  font-size: 38px;
}
.pv-hero .ico.dir svg {
  width: 38px;
  height: 38px;
}
.pv-hero h2 {
  margin: 0 0 3px;
  font-size: 16px;
  font-weight: 600;
  word-break: break-all;
}
.pv-hero .sub {
  color: var(--ink-3);
  font-size: var(--fs-meta);
}
.pv-body p {
  color: var(--ink-2);
  line-height: 1.65;
  max-width: 62ch;
}
.pv-body code {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--hover);
  padding: 1px 5px;
  border-radius: 4px;
}
.pv-empty {
  flex: 1;
  display: grid;
  place-content: center;
  text-align: center;
  color: var(--ink-3);
  gap: 6px;
}
.pv-empty .glyph {
  font-size: 34px;
  opacity: 0.35;
}
/* file contents */
.pv-text {
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--ink-2);
  white-space: pre-wrap;
  word-break: break-word;
  /* never wrap before column 88 (border-box, so add the 14 px paddings and
     2 px so an integer-rounded box cannot fall short): a zoomed-in pane
     scrolls .pv-body sideways instead, and previewTarget() asks for the
     same width in px */
  min-width: calc(88ch + 30px);
  margin: 0 0 18px;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--hover);
}

/* Syntax highlighting — the spans core/syntax.js emits. Four classes is the
   whole vocabulary, so the palette is four variables and a theme moves one of
   them without touching the rules. Both sets are checked against the surface
   they land on (--hover over --surface-2), because a preview that is only
   legible in one theme is a preview that is broken in the other. */
:root {
  --hl-com: #6e7781;
  --hl-str: #0a3069;
  --hl-num: #0550ae;
  --hl-kw: #cf222e;
}
:root[data-theme="dark"] {
  --hl-com: #8b949e;
  --hl-str: #a5d6ff;
  --hl-num: #79c0ff;
  --hl-kw: #ff7b72;
}
.hl-com {
  color: var(--hl-com);
}
.hl-str {
  color: var(--hl-str);
}
.hl-num {
  color: var(--hl-num);
}
.hl-kw {
  color: var(--hl-kw);
}
/* Foldable JSON — the <details> tree core/syntax.js emits for a parsed file.
   The marker hangs in the <pre>'s own padding so folded and unfolded lines
   keep the same indent; a closed node says what it hides. */
.pv-json summary {
  cursor: pointer;
  list-style: none;
  position: relative;
}
.pv-json summary::-webkit-details-marker {
  display: none;
}
.pv-json summary::before {
  content: "▾";
  position: absolute;
  left: -1.1em;
  color: var(--ink-3);
}
.pv-json details:not([open]) > summary::before {
  content: "▸";
}
.pv-json details:not([open]) > summary::after {
  content: " … " attr(data-n) " " attr(data-close);
  color: var(--ink-3);
}
/* edit mode — a textarea in the same footprint as .pv-text */
#pv-edit, .pv-edit-bar button {

  background: none;

}

  margin-bottom: 3px;
}

  line-height: 1.55;

}

}

  padding: 12px 14px;

  border-radius: 0;

.pv-rich img {

#status {

  height: 24px;

  align-items: center;
  gap: 14px;
  padding: 0 12px;

    gap: 8px;
  }

    display: none;
  }

  }

  padding: 1px 4px;

}

  color: var(--ink-2);
}

/* The path is the copy target, so it has to look like one — and it has to stay
   selectable, because selecting it by hand is the fallback when the clipboard
   API is refused. Bounded width keeps a deep path from pushing the key hints
   off the strip; the full text is still in the DOM, so a fallback selection
   copies all of it even when the display ellipsises. */
#st-path {
  max-width: 46%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
#st-path:hover {
  color: var(--ink-2);
  text-decoration: underline;
  text-underline-offset: 2px;
}

}

:root[data-theme="dark"] #st-refresh.bad {

}

<!-- The page is built by ui/core/shell.js — one copy of the chrome for both the
     static build and the server build. See ../ui/adapters/README.md.

     ui/core/ is the shared UI and knows nothing about where its nodes come
     from; ui/adapters/ chooses. The one module below names this edition's
     adapters and imports the rest; ../ui/entry-server.js is what the server
     edition's page loads instead. build-index.py inlines the whole graph. -->
<script type="module">
/* ═══ core/shell.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   The chrome — top bar, stage, status strip, welcome screen.

   In JavaScript rather than in the HTML file because there are two HTML files
   (a static one and one the server emits) and this markup has to be the same
   in both. A shared *file* would need a build step or a fetch; the static build
   can afford neither, since it has to keep running unbuilt from src/ and, once
   bundled, from a file:// page with no network at all.

   So: one page structure, emitted before anything queries it. Every id below is
   part of the contract core/ relies on — state.js takes its element handles the
   moment it loads, which is why this script comes first.
   ═══════════════════════════════════════════════════════════════════════════ */
document.body.insertAdjacentHTML(
  "afterbegin",
  `
<div id="shell">
  <nav id="bar" aria-label="File navigation">
    <div id="crumbs"></div>
    <form id="search-form" role="search">
      <label class="sr-only" for="search-bar">Search file contents</label>
      <input id="search-bar" type="search" placeholder="Search files…"
             autocomplete="off" aria-controls="search-results">
      <div id="search-results" role="status" aria-live="polite" hidden></div>
    </form>
    <div class="spacer"></div>
    <button class="tb" id="gear" aria-expanded="false" title="Settings">⚙</button>
    <div id="settings" hidden>
      <div class="grp">View</div>
      <button id="s-dot"     role="menuitemcheckbox" aria-checked="false"><span class="tick">✓</span>Show dotfiles</button>
      <button id="s-density" role="menuitemcheckbox" aria-checked="true"><span class="tick">✓</span>Compact rows</button>
      <hr>
      <!-- The hints are the point of this group: sorting by size or date has to
           read every file in the folder, and the menu is where that price can
           be shown before it is paid. Name asks for nothing and is the default. -->
      <div class="grp">Sort by</div>
      <button id="s-sort-name"  role="menuitemradio" aria-checked="true"><span class="tick">✓</span>Name</button>
      <button id="s-sort-size"  role="menuitemradio" aria-checked="false"><span class="tick">✓</span>Size<span class="hint">reads every file</span></button>
      <button id="s-sort-mtime" role="menuitemradio" aria-checked="false"><span class="tick">✓</span>Modified<span class="hint">reads every file</span></button>
      <button id="s-sort-desc"  role="menuitemcheckbox" aria-checked="false"><span class="tick">✓</span>Descending</button>
      <hr>
      <div class="grp" id="s-previews" hidden>Previews</div>
      <button id="s-rich" role="menuitemcheckbox" aria-checked="true" hidden><span class="tick">✓</span>Rich previews<span class="hint">downloads a renderer (13 MB for reStructuredText)</span></button>
      <hr id="s-rich-hr" hidden>
      <div class="grp">Appearance</div>
      <button id="s-theme"   role="menuitemcheckbox" aria-checked="false"><span class="tick">✓</span>Dark theme</button>
      <hr>
      <!-- The hash rides in as data-commit on <html> — the server sets it when
           its checkout has one; the static build has no repository, so the
           version stands alone. -->
      <div class="grp">About</div>
      <div class="ver">Filemill 0.1.0${
    document.documentElement.dataset.commit
      ? ` · ${document.documentElement.dataset.commit}`
      : ""
  }</div>
    </div>
  </nav>

  <div id="finder">
    <div id="rail">
      <div id="stage">
        <svg id="trail"></svg>
        <div id="strip"><!-- columns + preview injected here --></div>
      </div>
    </div>
  </div>

  <div id="status">
    <span id="st-path" title="Click to copy this path"></span>
    <span id="st-copy"></span>
    <div class="spacer"></div>
    <span id="st-find"></span>
    <span id="st-sort"></span>
    <span id="st-refresh"></span>
    <span id="st-fold"></span>
    <span class="status-hints">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>→</kbd> open</span>
      <span><kbd>←</kbd> back</span>
      <span><kbd>a…z</kbd> find</span>
      <span><kbd>F5</kbd> refresh</span>
      <span><kbd id="kbd-copy">⌘C</kbd> copy path</span>
    </span>
    <span class="status-fold"><kbd>⇧</kbd>+wheel fold</span>
  </div>
</div>

`,
);

/* Nothing to export: the page structure is the product. The empty export
   marks the file as a module, which is what lets the entry import it for
   its effect alone. */

/* ═══ core/state.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════════════════ */

const root = document.documentElement;
const finder = document.getElementById("finder");
const rail = document.getElementById("rail");
const stage = document.getElementById("stage");
const strip = document.getElementById("strip");
const trail = document.getElementById("trail");

let path = []; // node chain, [0] = root
let sel = []; // per-column selected name
let focusCol = 0;
let widths = []; // natural width per column
let folded = 0; // columns currently folded
let pvToken = 0; // guards async preview fills
let pvFullscreen = false;
/* Module bindings are read-only for importers, so the files that used to
   assign these directly go through here. */
function setState(patch) {
  if ("path" in patch) path = patch.path;
  if ("sel" in patch) sel = patch.sel;
  if ("focusCol" in patch) focusCol = patch.focusCol;
  if ("widths" in patch) widths = patch.widths;
  if ("folded" in patch) folded = patch.folded;
  if ("pvFullscreen" in patch) pvFullscreen = patch.pvFullscreen;
}
const nextPvToken = () => ++pvToken;
const state = {
  dotfiles: root.dataset.hidden === "show",
  sort: { key: "name", desc: false },
};
let sortOrder = (kids) => kids;
const setSortKids = (value) => sortOrder = value;

const GUTTER = () =>
  parseInt(getComputedStyle(root).getPropertyValue("--gutter"));
const SPINE = () =>
  parseInt(getComputedStyle(root).getPropertyValue("--spine-w"));

const COL_MIN = 148; // Keep columns wide enough for readable rows and controls.
const COL_MAX = 380; // Fit long page titles while folding columns outside focus.
const BYTE_BASE = 1024; // File sizes use binary units.
const KB_DECIMAL_LIMIT = 10; // Small KB values keep one decimal place.
const KB_DECIMAL_DIGITS = 1; // One decimal keeps small sizes readable.
const KB_DIGITS = 0; // Larger KB values do not need fractional precision.
const MB_DECIMAL_DIGITS = 1; // MB values retain one decimal for useful precision.
const GB_DECIMAL_DIGITS = 2; // GB values retain two decimals for useful precision.
const DATE_PART_DIGITS = "2-digit"; // Clock fields align consistently in the metadata line.
const CODE_COLUMNS = 88; // Preview text targets an 88-character reading width.
const CODE_HORIZONTAL_PADDING = 82; // Preview padding is 30px plus 52px.
const PREVIEW_MAX_WIDTH = 760; // Keep the preview from becoming too wide to read.
const PREVIEW_MIN_RATIO = 0.45; // Preserve nearly half the stage for preview content.
const EMPTY_PREVIEW_WIDTH = 300; // Keep the empty preview stable before a file is selected.
const HEADER_HORIZONTAL_PADDING = 34; // Reserve space for the column heading chrome.
const COLUMN_HORIZONTAL_PADDING = 58; // Reserve space for row padding and scrollbar.
const CODE_FONT_SIZE = 11.5; // Match the compact monospace preview typography.

/* One filtered copy per call, ordered by core/sort.js. Every column build, every
   width measurement and every path walk comes through here, which is what keeps
   the rows and a restored chain agreeing on what row 4 is. */
const visibleKids = (node) =>
  ((kids) => node.ordered ? kids : sortOrder(kids))(
    (node.kids || []).filter((k) => state.dotfiles || !k.name.startsWith(".")),
  );

const rowIndex = (node, name) =>
  visibleKids(node).findIndex((k) => k.name === name);

const fmtSize = (b) =>
  b < BYTE_BASE ? `${b} B` : b < BYTE_BASE ** 2
    ? `${
      (b / BYTE_BASE).toFixed(
        b < BYTE_BASE * KB_DECIMAL_LIMIT ? KB_DECIMAL_DIGITS : KB_DIGITS,
      )
    } KB`
    : b < BYTE_BASE ** 3
    ? `${(b / BYTE_BASE ** 2).toFixed(MB_DECIMAL_DIGITS)} MB`
    : `${(b / BYTE_BASE ** 3).toFixed(GB_DECIMAL_DIGITS)} GB`;

const fmtDate = (ms) =>
  new Date(ms).toLocaleString(undefined, {
    day: "numeric",
    month: "short",
    year: "numeric",
    hour: DATE_PART_DIGITS,
    minute: DATE_PART_DIGITS,
  });

const splitName = (name) => {
  const i = name.lastIndexOf(".");
  return (i > 0) ? [name.slice(0, i), name.slice(i)] : [name, ""];
};

const previewNode = () => {
  const last = path[path.length - 1], s = sel[path.length - 1];
  const n = s && (last.kids || []).find((k) => k.name === s);
  return (n && !n.dir) ? n : null;
};

const selectedNode = () => {
  const last = path[path.length - 1], s = sel[path.length - 1];
  return s && (last.kids || []).find((k) => k.name === s) || null;
};

/* 88 columns of .pv-text plus its and .pv-body's horizontal padding (30 + 52),
   measured from the real monospace font so it agrees with the CSS min-width */
const codeMin = () =>
  codeMin._w ||= (() => {
    const c = document.createElement("canvas").getContext("2d");
    const cs = getComputedStyle(root);
    c.font = `${CODE_FONT_SIZE}px ${cs.getPropertyValue("--mono")}`;
    return Math.ceil(c.measureText("0").width * CODE_COLUMNS) +
      CODE_HORIZONTAL_PADDING;
  })();

/* target reading width for the preview — the thing scrolling tries to protect.
   Never wider than the stage itself: a phone cannot show 88 columns, and a
   pane that runs past the right edge is clipped, not scrollable — so there
   the pane fits and .pv-body pans over the code instead. */
const previewTarget = () =>
  previewNode()
    ? Math.min(
      PREVIEW_MAX_WIDTH,
      stage.clientWidth,
      Math.max(codeMin(), Math.round(stage.clientWidth * PREVIEW_MIN_RATIO)),
    )
    : EMPTY_PREVIEW_WIDTH;

function measure(node) {
  /* content-driven width, clamped — no manual resizing, no wasted space */
  const c = (measure._c ||= document.createElement("canvas").getContext("2d"));
  const cs = getComputedStyle(root);
  c.font = `${cs.getPropertyValue("--fs-row").trim()} ${
    cs.getPropertyValue("--font")
  }`;
  let w = 0;
  for (const k of visibleKids(node)) {
    w = Math.max(w, c.measureText(k.name).width);
  }
  c.font = `600 ${cs.getPropertyValue("--fs-head").trim()} ${
    cs.getPropertyValue("--font")
  }`;
  w = Math.max(w, c.measureText(node.name).width + HEADER_HORIZONTAL_PADDING);
  return Math.min(
    COL_MAX,
    Math.max(COL_MIN, Math.ceil(w) + COLUMN_HORIZONTAL_PADDING),
  );
}

/* ═══ core/ports.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Ports — the three seams between the shared UI and whatever is behind it.

   Everything in core/ is source-agnostic: it knows about nodes, columns and
   keystrokes, never about the File System Access API, HTTP, or a URL scheme.
   The three objects below are what an adapter fills in. Pick a different set
   and the same UI browses a server instead of a local folder.

   ── FS ─ the filesystem ────────────────────────────────────────────────────
   FS.node(name, ...args) → Node creates the adapter's root or child node. The
   core passes the arguments declared by the adapter's node factory and does
   not inspect them.

   Every node has these core fields:
       name       string; display name and path segment
       dir        boolean; true when the node can have children
       kids       null for an unread directory; [] for a loaded empty or
                  unreadable directory; [Node…] for loaded children; undefined
                  for a file or leaf
       denied     string when loading failed; shown instead of directory rows
       meta       {size, mod, type} for known file metadata, {virtual: true}
                  for virtual entries, or {error: string} when metadata failed;
                  absent until loadMeta runs
       loading    Promise while an adapter load is active; otherwise null/absent
       metaDone   boolean UI scratch: every loaded file child was asked for meta
       metaLoading Promise while the core metadata sweep is active; UI scratch
       metaPending number of metadata requests left in that sweep; UI scratch
       metaSwept  {n, ms} summary of the last metadata sweep; UI scratch

   Existing adapter or virtual-filesystem fields:
       handle     File System Access API handle
       parent     parent File System Access API handle, when available
       file       cached File from handle.getFile()
       rel        server root-relative path
       vpath      virtual path inside rel (JSON key, table, or row)
       ordered    boolean; preserve adapter child order when true
       icon       string; explicit icon glyph
       page       one-based current server listing page
       pages      total server listing pages
       total      total server listing entries
       previewFormat string; requested preview format
       csv        boolean; this node is a CSV virtual directory
       jsonl      boolean; this node is a JSONL virtual directory
       json       boolean; this node is a JSON virtual directory or value
       headers    parsed CSV column names
       csvEmpty   boolean; parsed CSV has no records
       csvError   boolean; CSV parsing/loading failed
       value      parsed JSON value for a virtual node
       record     parsed CSV, JSONL, or JSON table-row value
       jsonError  string; JSON parsing/loading error

     ensureLoaded(node) → Promise   fills node.kids (idempotent, debounced)
     loadMeta(node)     → Promise   fills node.meta (or records {error}); may
                                    be a no-op when the listing has metadata
     blob(node)         → Promise<Blob|null> returns file bytes for preview, or
                                    null when the file cannot be read
   write(node, text)  → Promise   optional; overwrite the file with `text`.
                                    A port without it is read-only — the
                                    preview pane then offers no Edit action.
   remove(node)       → Promise   optional; delete a selected real file or
                                    directory.

   loadMeta is called once per selected file, and once per *row* when the user
   sorts a column by size or by modification time — see core/sort.js. A port
   whose listing already carries the metadata pays nothing for that sort; one
   that does not pays a round-trip per row, which is why name is the default
   order and the only one that never calls this. Record a failure on the node
   (`node.meta = {error}`) rather than rejecting, the way both adapters here do.

   ── PREVIEW ─ the preview body ─────────────────────────────────────────────
     render(node) → Promise<string|null>
         HTML for the preview body, or null for "no inline preview". The pane's
         chrome — header, hero, size/modified list — is core's, and so is the
         staleness guard: a provider may take as long as it likes.
     revoke()  → void                optional; release object URLs

   ── ROUTER ─ the address bar ───────────────────────────────────────────────
     read()          → {root, path:[names…]} | null    the location right now
     write(state, replace) → void                      reflect state, no reload;
                                    use replaceState when replace is true,
                                    pushState otherwise
     onNavigate(cb)  → void                            back/forward pressed
     Set to null to run with no URL syncing at all.

   RouterPath.base is the trailing-slash base URL used by the path router. It
   comes from the current script's data-base attribute, or "/", and is used to
   strip/add the server mount prefix. It is not part of router state.
   ═══════════════════════════════════════════════════════════════════════════ */
let FS = null, PREVIEW = null, ROUTER = null;

const useFilesystem = (a) => {
  FS = a;
};
const usePreview = (p) => {
  PREVIEW = p;
};
const useRouter = (r) => {
  ROUTER = r;
};

/* ═══ core/icons.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Icons — Seti UI font (MIT), extension map generated by build-seti-map.py.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Seti has glyphs for these but mapping.less never binds them to an extension. */
const SUPP = {
  nix: ["e019", "#519aba"],
  db: ["e022", "#dd4b78"],
  sqlite: ["e022", "#dd4b78"],
  lock: ["e05d", "#7fae42"],
  desktop: ["e019", "#6d8086"],
};
const FOLDER_PATH =
  '<path d="M1.4 3.2h4.1l1.3 1.7h7.8c.6 0 1 .4 1 1v7c0 .6-.4 1-1 1H1.4c-.6 0-1-.4-1-1V4.2c0-.6.4-1 1-1z"/>';
const FOLDER_SVG = `<svg viewBox="0 0 16 16">${FOLDER_PATH}</svg>`;

function iconHTML(node) {
  /* An adapter may name its own glyph — a virtual filesystem's tables and rows
     are not files and have no extension to look up. */
  if (node.icon) return `<span class="ico glyph">${esc(node.icon)}</span>`;
  if (node.dir) return `<span class="ico dir">${FOLDER_SVG}</span>`;
  const lower = node.name.toLowerCase(), ext = lower.split(".").pop();
  const e = SETI.name[lower] || SETI.ext[ext] || SUPP[ext] || SETI.default;
  const color = (root.dataset.theme === "light" && SETI.light[ext]) || e[1];
  return `<span class="ico seti" style="color:${color}">&#x${e[0]};</span>`;
}

const esc = (s) =>
  s.replace(
    /[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]),
  );

/* ═══ core/syntax.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Syntax highlighting — in the browser, so one copy serves both builds.

   The Python side can already colour source with Pygments, and does for its
   own pages. The shared UI deliberately does not use it: a preview that is
   coloured only when a Python process is behind it would have to be written
   twice — once here for the single file, once there for the served page.
   Colouring the text in the browser instead means both builds run *this*
   file, and a folder reached through "Open local folder…" is coloured on the
   server build too, though the server has never seen a byte of it.

   This is not a parser. Four token classes — comment, string, number, keyword
   — one regular expression per language, and the leftmost match wins, which is
   what keeps a `#` inside a string out of the comment class with no state to
   carry from one token to the next. That is enough to read a file by and well
   short of a language front end: what it gets wrong is mis-coloured, never
   mangled, because every character of the input is escaped and emitted exactly
   once — see hlHTML.

   A language is one line in HL_LANGS. An extension that is not listed previews
   as plain text, the way every file did before this existed. SVG is absent on
   purpose: the pane has something better than source for it.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Written as plain strings rather than literals because they are assembled:
   a regex literal cannot be pasted into another one without going through its
   .source anyway, and doubling the backslashes once here is the smaller cost. */
const HL_NUM =
  "\\b(?:0[xXbBoO][0-9a-fA-F_]+|\\d[\\d_]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)\\b";

/* A quoted run ends at the first unescaped quote of the same kind; `\\[\\s\\S]`
   rather than `\\.` so a backslash before a newline does not end the string. */
const HL_STR = "\"(?:\\\\[\\s\\S]|[^\"\\\\])*\"|'(?:\\\\[\\s\\S]|[^'\\\\])*'";
const HL_TICK = "`(?:\\\\[\\s\\S]|[^`\\\\])*`|" + HL_STR; /* + JS template */
const HL_TRIPLE = "\"\"\"[\\s\\S]*?\"\"\"|'''[\\s\\S]*?'''|" +
  HL_STR; /* + Python */

const HL_SLASH = "//[^\\n]*|/\\*[\\s\\S]*?\\*/";
const HL_HASH = "#[^\\n]*";
const HL_DASH = "--[^\\n]*";
const HL_BLOCK = "/\\*[\\s\\S]*?\\*/";

const hlWords = (s) => "\\b(?:" + s.trim().split(/\s+/).join("|") + ")\\b";

const K_JS =
  `as async await break case catch class const continue debugger default delete do
  else export extends false finally for from function if import in instanceof let new null of
  return static super switch this throw true try typeof undefined var void while with yield`;
const K_TS = K_JS +
  ` abstract declare enum implements interface is keyof namespace never
  private protected public readonly type unknown satisfies`;
const K_PY =
  `and as assert async await break class continue def del elif else except False
  finally for from global if import in is lambda None nonlocal not or pass raise return self
  True try while with yield`;
const K_C =
  `auto break bool case char const continue default do double else enum extern false
  float for goto if inline int long NULL register return short signed sizeof static struct
  switch true typedef union unsigned void volatile while`;
const K_CPP = K_C +
  ` catch class constexpr delete explicit friend mutable namespace new
  noexcept nullptr operator override private protected public template this throw try typename
  using virtual`;
const K_SQL =
  `add all alter and as asc begin between by case check column commit constraint
  count create cross default delete desc distinct drop else end exists foreign from full group
  having in index inner insert into is join key left like limit max min not null offset on or
  order outer primary references returning right rollback select set sum table then transaction
  union unique update values view when where with`;

/* One entry per language; `k` is a finished pattern so that a language whose
   keywords are not words — a TeX macro, a CSS at-rule, an XML tag — can say so
   without a second mechanism. `n: false` turns the number class off. */
const HL_SPECS = {
  markdown: { c: HL_HASH, s: HL_TICK, k: hlWords("true false") },
  js: { c: HL_SLASH, s: HL_TICK, k: hlWords(K_JS) },
  ts: { c: HL_SLASH, s: HL_TICK, k: hlWords(K_TS) },
  py: { c: HL_HASH, s: HL_TRIPLE, k: hlWords(K_PY) },
  c: { c: HL_SLASH, s: HL_STR, k: hlWords(K_C) },
  cpp: { c: HL_SLASH, s: HL_STR, k: hlWords(K_CPP) },
  cs: {
    c: HL_SLASH,
    s: HL_STR,
    k: hlWords(
      K_CPP + ` base checked decimal event foreach
           get in interface internal is lock object out params readonly ref sealed set string
           unchecked unsafe var where yield`,
    ),
  },
  java: {
    c: HL_SLASH,
    s: HL_STR,
    k: hlWords(
      K_C + ` abstract assert catch class extends
           final finally implements import instanceof interface native new package private
           protected public super synchronized this throw throws transient try var`,
    ),
  },
  kt: {
    c: HL_SLASH,
    s: HL_STR,
    k: hlWords(`as break by class companion const continue
           data do else enum false for fun if import in infix init inline interface internal is
           lateinit null object open operator out override package private protected public
           reified return sealed super suspend this throw true try typealias val var vararg when
           where while`),
  },
  go: {
    c: HL_SLASH,
    s: HL_TICK,
    k: hlWords(`break case chan const continue default defer
           else fallthrough false for func go goto if import interface map nil package range
           return select struct switch true type var`),
  },
  rs: {
    c: HL_SLASH,
    s: HL_STR,
    k: hlWords(`as async await break const continue crate dyn
           else enum extern false fn for if impl in let loop match mod move mut pub ref return
           self Self static struct super trait true type unsafe use where while`),
  },
  swift: {
    c: HL_SLASH,
    s: HL_STR,
    k: hlWords(`as associatedtype async await break case catch
           class continue default defer deinit do else enum extension fallthrough false
           fileprivate final for func guard if import in init internal is lazy let mutating nil
           open operator private protocol public repeat rethrows return self Self static struct
           subscript super switch throw throws true try typealias var weak where while`),
  },
  php: {
    c: HL_SLASH + "|" + HL_HASH,
    s: HL_STR,
    k: hlWords(`abstract and array as break case
           catch class clone const continue declare default do echo else elseif empty enum
           extends false final finally fn for foreach function global if implements include
           instanceof interface isset list match namespace new null or print private protected
           public readonly require return static switch throw trait true try unset use var
           while yield`),
  },
  rb: {
    c: HL_HASH,
    s: HL_STR,
    k: hlWords(`alias and begin break case class def defined
           do else elsif end ensure false for if in module next nil not or redo require rescue
           retry return self super then true undef unless until when while yield`),
  },
  pl: {
    c: HL_HASH,
    s: HL_STR,
    k: hlWords(`and bless defined do else elsif eq foreach ge
           gt if last le local lt my ne next no not or our package print qw redo ref require
           return sub undef unless until use while`),
  },
  sh: {
    c: HL_HASH,
    s: HL_STR,
    k: hlWords(`alias break case cd continue declare do done
           elif else esac eval exec exit export fi for function if in local read readonly return
           select set shift source then trap unset until while`),
  },
  lua: {
    c: "--\\[\\[[\\s\\S]*?\\]\\]|" + HL_DASH,
    s: HL_STR,
    k: hlWords(`and break do else
           elseif end false for function goto if in local nil not or repeat return then true
           until while`),
  },
  r: {
    c: HL_HASH,
    s: HL_STR,
    k: hlWords(`break else FALSE for function if in Inf NA
           NaN next NULL repeat return TRUE while`),
  },
  sql: { c: HL_DASH + "|" + HL_BLOCK, s: HL_STR, k: hlWords(K_SQL), i: true },
  nix: {
    c: HL_HASH + "|" + HL_BLOCK,
    s: HL_TRIPLE,
    k: hlWords(`assert builtins else false if
           import in inherit let null or rec then true with`),
  },
  json: { c: HL_SLASH, s: HL_STR, k: hlWords("true false null") },
  yaml: { c: HL_HASH, s: HL_STR, k: hlWords("true false null yes no on off") },
  toml: { c: HL_HASH, s: HL_TRIPLE, k: hlWords("true false") },
  ini: {
    c: HL_HASH + "|;[^\\n]*",
    s: HL_STR,
    k: hlWords("true false yes no on off"),
  },
  css: { c: HL_BLOCK, s: HL_STR, k: "@[a-zA-Z-]+" },
  xml: { c: "<!--[\\s\\S]*?-->", s: HL_STR, k: "</?[A-Za-z_][\\w.:-]*" },
  tex: { c: "%[^\\n]*", n: false, k: "\\\\[A-Za-z@]+" },
};

/* Extensions that are the same language under another name. */
const HL_ALIAS = {
  md: "markdown",
  markdown: "markdown",
  html: "xml",
  htm: "xml",
  mjs: "js",
  cjs: "js",
  jsx: "js",
  tsx: "ts",
  h: "c",
  hpp: "cpp",
  cc: "cpp",
  cxx: "cpp",
  bash: "sh",
  zsh: "sh",
  fish: "sh",
  yml: "yaml",
  jsonc: "json",
  cfg: "ini",
  conf: "ini",
  scss: "css",
  less: "css",
  gitignore: "sh",
  env: "sh",
  /* what a Markdown fence calls the language, when that is not an extension */
  python: "py",
  javascript: "js",
  typescript: "ts",
  shell: "sh",
  rust: "rs",
  ruby: "rb",
};

/* Comment, then string, then number, then keyword. The order only settles ties
   at one position — `exec` takes the leftmost match either way, which is what
   puts a quote inside a comment in the comment and not in a string of its own. */
const HL_LANGS = Object.fromEntries(
  Object.entries(HL_SPECS).map(([key, sp]) => {
    const alts = [];
    if (sp.c) alts.push(`(?<com>${sp.c})`);
    if (sp.s) alts.push(`(?<str>${sp.s})`);
    if (sp.n !== false) alts.push(`(?<num>${HL_NUM})`);
    if (sp.k) alts.push(`(?<kw>${sp.k})`);
    return [key, new RegExp(alts.join("|"), sp.i ? "gi" : "g")];
  }),
);

/* The language for a file name, or null for "no highlighting known". Starting
   at index 0 so a dotfile is its own extension: .gitignore is a shell-comment
   file and has nothing else to go on. */
function hlLang(name) {
  const i = name.lastIndexOf(".");
  if (i < 0) return null;
  const ext = name.slice(i + 1).toLowerCase();
  const key = HL_ALIAS[ext] || ext;
  return key in HL_LANGS ? key : null;
}

/* Escaped HTML for `text`, with the recognised tokens wrapped in spans. Every
   character reaches the output exactly once: the gap before a match is escaped
   and copied, the match itself is escaped inside its span, and the tail after
   the last match is escaped and copied. Nothing here interpolates unescaped
   input, which is what makes the output safe to assign to innerHTML. */
function hlHTML(text, key) {
  const re = HL_LANGS[key];
  let out = "", last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(text)) !== null) {
    /* No alternative can match the empty string today; the guard is what keeps
       that from becoming an infinite loop if one ever does. */
    if (!m[0]) {
      re.lastIndex++;
      continue;
    }
    const cls = Object.keys(m.groups).find((g) => m.groups[g] !== undefined);
    out += esc(text.slice(last, m.index)) +
      `<span class="hl-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(text.slice(last));
}

/* Pretty-printed, foldable HTML for a JSON document, or null when `text` is
   not JSON — the caller then colours it as source instead. Objects and arrays
   become <details open>, so folding is the browser's: no handlers, and nothing
   for either build to wire. Inside a pre-wrap <pre> a newline that precedes a
   block is swallowed and one that follows it draws a blank line, so every text
   line ends in "\n" and no run of text begins with one. */
function jsonHTML(text) {
  let doc;
  try {
    doc = JSON.parse(text);
  } catch {
    return null;
  }
  const scalar = (v) =>
    v === null || typeof v === "boolean"
      ? `<span class="hl-kw">${v}</span>`
      : typeof v === "number"
      ? `<span class="hl-num">${v}</span>`
      : `<span class="hl-str">${esc(JSON.stringify(v))}</span>`;
  const node = (v, pad, head, tail) => {
    if (typeof v !== "object" || v === null) {
      return `${pad}${head}${scalar(v)}${tail}\n`;
    }
    const arr = Array.isArray(v);
    const keys = arr ? v.map((_, i) => i) : Object.keys(v);
    const [open, close] = arr ? ["[", "]"] : ["{", "}"];
    if (!keys.length) return `${pad}${head}${open}${close}${tail}\n`;
    let out =
      `<details open><summary data-n="${keys.length}" data-close="${close}${tail}">` +
      `${pad}${head}${open}</summary>`;
    keys.forEach((k, i) => {
      out += node(
        v[k],
        pad + "  ",
        arr ? "" : `${esc(JSON.stringify(k))}: `,
        i < keys.length - 1 ? "," : "",
      );
    });
    return out + `${pad}${close}${tail}</details>`;
  };
  /* Nesting deep enough to exhaust the stack is still valid JSON; it is shown
     as source, the same as anything else this cannot fold. */
  try {
    return node(doc, "", "", "");
  } catch {
    return null;
  }
}

/* Colour the fenced code inside a rendered Markdown fragment. Both markdown-it
   and markdown-it-py emit <pre><code class="language-x"> with no highlighter
   configured, so this one function is what makes "fenced code is coloured" true
   in both builds. Only code nodes are touched: paragraphs and their soft line
   breaks stay exactly as the renderer left them. */
function hlFences(host) {
  for (const code of host.querySelectorAll('pre > code[class*="language-"]')) {
    const m = /(?:^|\s)language-(\S+)/.exec(code.className);
    const key = m && hlLang("x." + m[1]);
    if (key) code.innerHTML = hlHTML(code.textContent, key);
  }
}

/* ═══ core/sort.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Sort order — name, size or modification time, ascending or descending.

   The three keys do not cost the same, and that asymmetry is the whole design.

   A listing already carries the names, so sorting by name reads what the column
   is holding: no fetch, no wait, no code below `sortKids` runs at all. It is the
   default for that reason.

   Size and modification time are not in a File System Access API listing.
   `entries()` yields a name and a handle; a size costs one `getFile()` per row.
   Ordering 3 000 entries by size therefore means 3 000 reads before the first
   row can be placed — the sweep this file exists to manage. It runs when the
   user picks one of the two keys that needs it, on the directories on screen,
   once each.

   One sweep serves both metadata keys: `getFile()` hands back the size and the
   mtime together, so switching from size to modified re-sorts what is already
   in hand and fetches nothing.

   Nothing here knows where metadata comes from. `FS.loadMeta` does, which is
   what makes this shared: the server build's listing carries size and mtime
   already, so its sweep finds nothing to fetch and returns on one `if`. The
   same option costs the server build a comparison and the static build a
   syscall per row.
   ═══════════════════════════════════════════════════════════════════════════ */
let repaint;
const setSortActions = ({ render }) => repaint = render;

const SORT_KEYS = ["name", "size", "mtime"];
const SORT_FIELD = { size: "size", mtime: "mod" }; /* node.meta field per key */
const SORT_LABEL = { name: "name", size: "size", mtime: "modified" };

const sortNeedsMeta = () => state.sort.key !== "name";

/* One collator, reused. `"a".localeCompare(b, undefined, {numeric: true})` has
   to resolve those options on every call, and this comparator runs n log n
   times per column build — about 35 000 times at 3 000 entries. */
const NAME_COLLATOR = new Intl.Collator(undefined, { numeric: true });
const byName = (a, b) => NAME_COLLATOR.compare(a.name, b.name);

/* The number to order on, or null for "this row has none". A file the port
   could not open carries `meta.error`; a row inside a database carries
   `meta.virtual` and no size at all. Both are honestly unknown. */
const sortValue = (k, field) => {
  const v = k.meta && !k.meta.error ? k.meta[field] : undefined;
  return typeof v === "number" ? v : null;
};

/* Directories first, then the chosen key, then the name to break ties.
   `kids` is already the filtered copy visibleKids made, so sorting it in place
   never touches node.kids.

   Directories are never ordered by size or time. Neither port can give a
   directory either number: the File System Access API has no `getFile()` for a
   directory handle, and the server build's listing sends metadata for files
   only. A folder ordered by an invented 0 would sit at one end of every size
   sort and mean nothing there, so folders keep the one order that is real for
   them.

   A file whose metadata could not be read sorts last, in name order, in *both*
   directions. Sorting by size descending asks "what is biggest here"; a file
   the app could not open is not the answer, and putting one at the top is how a
   permission error gets read as a result. Last either way keeps the end the
   user is looking at meaningful. The row is never dropped — an unreadable file
   is still a file in that folder, and hiding the rows it failed to stat would
   make the app lie about the directory. */
function sortKids(kids) {
  const { key, desc } = state.sort;
  const dir = desc ? -1 : 1;
  const field = SORT_FIELD[key];
  return kids.sort((a, b) => {
    const kind = !!b.dir - !!a.dir;
    if (kind) return kind;
    if (field && !a.dir) {
      const av = sortValue(a, field), bv = sortValue(b, field);
      if (av === null || bv === null) {
        if (av !== bv) return av === null ? 1 : -1; /* unknown sinks */
      } else if (av !== bv) {
        return (av < bv ? -1 : 1) * dir;
      }
    }
    return byName(a, b) * (field ? 1 : dir);
  });
}

/* ── The sweep ──────────────────────────────────────────────────────────────
   One sweep per directory, one in-flight promise held on the node, one writer
   of the metadata — the shape `FS.ensureLoaded` already has for `node.kids`, so
   a second render during a sweep joins the one running instead of starting a
   rival. `metaDone` is the counterpart of `kids !== null`: this directory has
   been asked, and asking again would be 3 000 syscalls for an answer already in
   memory. */
function ensureMeta(node) {
  if (node.metaLoading) return node.metaLoading;
  const kids = node.kids;
  const todo = kids.filter((k) => !k.dir && !k.meta);
  /* Nothing to fetch: the listing carried it (the server build), or a preview
     already did. Settle it here, before columnFor runs, so a column with no
     sweep to run is built once in the right order rather than built and
     rebuilt. */
  if (!todo.length) {
    node.metaDone = true;
    return null;
  }

  /* Files still to read in *this* column. The strip sums it across the columns
     sweeping at once, so the number it shows is the number of getFile() calls
     outstanding and nothing else. */
  node.metaPending = todo.length;
  node.metaLoading = (async () => {
    const t0 = performance.now();
    await Promise.all(todo.map((k) =>
      FS.loadMeta(k)
        /* The port promises to *fill* node.meta, not that it never rejects. One
         rejection escaping here would leave metaLoading set and metaDone false
         for good, and the column would spin at the user until the tab closed.
         Recording the error on the row puts it in the same bucket
         FSA.loadMeta already uses for a file it could not open, which is the
         bucket sortValue reads as "unknown". */
        .catch((err) => {
          k.meta = { error: String((err && err.message) || err) };
        })
        /* One status write per row would cost more than the sweep it reports.
         Every 64th is an update per ~20 ms at the rates measured here, which is
         faster than anyone reads. */
        .then(() => {
          if (--node.metaPending > 0 && node.metaPending % 64 === 0) {
            sortSay(sortStatus());
          }
        })
    ));
    node.metaSwept = { n: todo.length, ms: Math.round(performance.now() - t0) };
    /* A refresh replaces node.kids wholesale. A sweep that started on the old
       array has just filled objects nobody can see, and marking the *new* list
       done would leave it ordered by whatever its rows happened to carry. */
    if (node.kids === kids) node.metaDone = true;
    node.metaLoading = null;
  })();
  return node.metaLoading;
}

/* Called from render(), so no navigation path has to remember to ask: whatever
   is on screen gets the metadata the current sort needs, exactly once. Sorting
   by name needs none, so the default never reaches `ensureMeta` at all — the
   expensive path is entered by the option that asked for it and by nothing
   else. */
function sweepMeta(node) {
  if (
    !FS || !node.dir || node.kids === null || node.metaDone ||
    node.metaLoading ||
    !sortNeedsMeta()
  ) return;
  const p = ensureMeta(node);
  if (!p) return; /* answered without fetching */
  p.then(() => {
    /* The second half of the guard choose() uses on its own reads: a sweep can
       outlive the column that started it, and re-rendering for a directory that
       is no longer open would reorder nothing and cost a rebuild. The metadata
       it collected is kept either way — it is a fact about those files, and
       stepping back into the folder finds it there.

       Dropping the repaint is safe rather than lossy because columnFor treats
       `metaDone` like `kidsRef`: any later render rebuilds a column whose DOM
       predates its sweep. Nothing can be left showing an order it no longer
       has. */
    if (!path.includes(node)) return;
    repaint(true);
  });
}

/* ── What the strip says ────────────────────────────────────────────────────
   A sort that reads 3 000 files takes a visible moment, and a column that sits
   there in name order while it happens looks like a sort that did nothing. */
const sortSay = (msg) => {
  const el = document.getElementById("st-sort");
  if (el) el.textContent = msg;
};

/* Written by render(), and again by the sweep as it counts down. Silent on the
   default, name ascending: a strip that always says something says nothing.

   While a sweep runs it shows the files still to read, summed over every column
   sweeping at once, because one sort can start several. When it is over it names
   the deepest column that was swept — the folder the user just stepped into is
   the one they are asking about, and a per-column figure beats a total that
   double-counts sweeps which overlapped. */
function sortStatus() {
  const { key, desc } = state.sort;
  /* `metaLoading` decides, not the count, because the count reaches 0 a
     microtask before the sweep resolves. Deciding on the count would let the
     strip report a finished sort while the column beside it still spins, and
     the two are describing the same thing. */
  if (path.some((x) => x.metaLoading)) {
    const left = path.reduce(
      (n, x) => n + (x.metaLoading ? x.metaPending : 0),
      0,
    );
    return `⇅ ${SORT_LABEL[key]} — reading ${Math.max(left, 1)} files…`;
  }
  if (key === "name" && !desc) return "";
  const deepest = sortNeedsMeta() &&
    [...path].reverse().find((n) => n.metaSwept && n.metaSwept.n);
  return `⇅ ${SORT_LABEL[key]} ${desc ? "↓" : "↑"}` +
    (deepest
      ? ` · ${deepest.name}: ${deepest.metaSwept.n} files read in ` +
        `${deepest.metaSwept.ms} ms`
      : "");
}

/* ── Remembering it ─────────────────────────────────────────────────────────
   localStorage, not the per-folder record in IndexedDB. The sort is a property
   of how a person reads a list, not of the folder they are reading — the same
   argument that already keeps dotfiles, density and the rich-preview switch out
   of that record. It is also the only store both builds have: the server build
   serves this file and has no remembered folders at all. And the record offers
   nowhere to hang it: `keepView` fires from `ROUTER.write`, which core calls
   when the *location* changes, and choosing a sort moves nobody.

   A remembered size sort does mean a mount can start a sweep the user did not
   ask for in this session. They did ask for it, last session, and the column
   says so while it reads. */
const SORT_STORE = "filemill.sort";

function loadSort() {
  try {
    const [key, dir] = String(localStorage.getItem(SORT_STORE) || "").split(
      ":",
    );
    if (SORT_KEYS.includes(key)) state.sort = { key, desc: dir === "desc" };
  } catch (err) {
    /* private mode, or an opaque file:// origin — keep the default */
  }
}

function setSort(key, desc) {
  state.sort = { key, desc };
  try {
    localStorage.setItem(SORT_STORE, `${key}:${desc ? "desc" : "asc"}`);
  } catch (err) {
    /* the sort still applies; it just will not survive a reload */
  }
  syncSortMenu();
  /* cacheSig carries the sort, so this drops every cached column and rebuilds
     it in the new order — the same route the dotfile and density switches take
     for the same reason. */
  repaint(true);
}

function syncSortMenu() {
  for (const k of SORT_KEYS) {
    const b = document.getElementById(`s-sort-${k}`);
    if (b) b.setAttribute("aria-checked", String(state.sort.key === k));
  }
  const d = document.getElementById("s-sort-desc");
  if (d) d.setAttribute("aria-checked", String(state.sort.desc));
}

function initSort() {
  loadSort();
  syncSortMenu();
}

/* ═══ core/dom.js ═══ */
const set = (obj, key, value) => {
  if (obj[key] !== value) obj[key] = value;
};

const setVar = (el, name, value) => {
  if (el.style.getPropertyValue(name) !== value) {
    el.style.setProperty(name, value);
  }
};

/* ═══ core/trail.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   The trail: an elbow from each selected row into the next column's header.
   The vertical run sits on the centre line of the gutter between the columns.
   ═══════════════════════════════════════════════════════════════════════════ */

function paintTrail() {
  const fr = stage.getBoundingClientRect();
  trail.setAttribute("viewBox", `0 0 ${fr.width} ${fr.height}`);
  trail.style.width = fr.width + "px";
  trail.style.height = fr.height + "px";
  let out = "";

  /* a column past the crossfade midpoint anchors on its spine icon, not its rows */
  const asSpine = (el) =>
    el.classList.contains("spine") || +(el.dataset.fold || 0) > 0.5;

  const cols = [...strip.querySelectorAll(".col")];
  cols.forEach((col, i) => {
    const next = cols[i + 1] || document.getElementById("preview");
    if (!next) return;
    const cr = col.getBoundingClientRect(), nr = next.getBoundingClientRect();

    /* start: right edge of the selected pill, or the spine's icon when folded */
    let x1, y1;
    if (asSpine(col)) {
      const dot = col.querySelector(".dot").getBoundingClientRect();
      x1 = cr.right - fr.left;
      y1 = dot.top + dot.height / 2 - fr.top;
    } else {
      const selRow = col.querySelector(".row.sel");
      if (!selRow) return;
      const rr = selRow.getBoundingClientRect();
      const br = col.querySelector(".col-body").getBoundingClientRect();
      const cy = rr.top + rr.height / 2;
      if (cy < br.top + 2 || cy > br.bottom - 2) {
        return; /* scrolled out of view */
      }
      x1 = rr.right - fr.left;
      y1 = cy - fr.top;
    }
    if (x1 < 0) {
      return; /* origin has slid off the left edge — no dangling hook */
    }

    /* end: the next column's header — or its spine icon when that one is folded */
    const anchor = asSpine(next)
      ? next.querySelector(".dot")
      : next.querySelector(".col-head");
    const ar = anchor && anchor.getBoundingClientRect();
    const x2 = nr.left - fr.left;
    const y2 = ar ? ar.top + ar.height / 2 - fr.top : nr.top + 15 - fr.top;

    /* the vertical run bisects the gutter, not the pill-to-column span */
    const mx = (cr.right + nr.left) / 2 - fr.left;
    const r = Math.min(
      6,
      Math.abs(y2 - y1) / 2,
      Math.abs(mx - x1),
      Math.abs(x2 - mx),
    );
    const s = Math.sign(y2 - y1) || 1;
    const dp = Math.abs(y2 - y1) < 1
      ? `M${x1},${y1} L${x2},${y2}`
      : `M${x1},${y1} L${mx - r},${y1} Q${mx},${y1} ${mx},${y1 + s * r}` +
        ` L${mx},${y2 - s * r} Q${mx},${y2} ${mx + r},${y2} L${x2},${y2}`;

    out += `<path class="${
      +col.dataset.i === focusCol ? "" : "thread"
    }" d="${dp}"/>`;
  });
  trail.innerHTML = out;
}

/* ═══ core/layout.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Layout + the scroll dial

   scrollLeft is not a translation — it is a 0–100% condensing dial:
     0%       every column unfolded; preview overflows off the right edge
     k·unit   the leftmost k columns folded to spines   (unit = 99% / ncols)
     99%      every column folded; preview fills what is left
     99–100%  the spine strip itself slides away; at 100% the preview is alone
   ═══════════════════════════════════════════════════════════════════════════ */

function stripSpan(k) {
  /* width of the column strip with k folded */
  const g = GUTTER(), n = path.length;
  const cols = widths.reduce((a, w, i) => a + (i < k ? SPINE() : w), 0);
  return cols + g * (n + 1); /* padding either side + inter-column gaps */
}
const FOLD_RANGE = 0.99; // Reserve the final one percent for sliding the spine strip.
const MIN_SCROLL_RANGE = 1; // Keep division and scroll arithmetic valid before layout settles.
const BOUNDARY_SLACK = 0.5; // Absorb rounding that can otherwise land one column short.
const FULL_FOLD_THRESHOLD = 0.99; // Treat the dial's first 99 percent as column folding.
const TAIL_RANGE = 0.01; // The final one percent slides the folded strip away.
const foldUnit = () => FOLD_RANGE / path.length;
const range = () => Math.max(MIN_SCROLL_RANGE, stripSpan(0) - GUTTER());

function layout(keepScroll) {
  const stageW = finder.clientWidth;
  setVar(root, "--stage-w", stageW + "px");
  setVar(root, "--preview-w", previewTarget() + "px");
  rail.style.width = (stageW + range()) + "px";

  if (!keepScroll) {
    /* default: the least folding that still gives the preview its full width.
       ?layout=compressed-columns asks for every column folded instead, which is
       the dial at 99% and the one thing the HTMX shell could never do. */
    let k = 0;
    while (k < path.length && stripSpan(k) + previewTarget() > stageW) k++;
    /* Fold more when the new contents need it, but never past the focused
       column: that is the one under the user's finger, and the column to its
       right is what opening it just produced — answering a tap by hiding
       either is not condensing, it is discarding the answer. What is left of
       focus has been walked past and may condense; folding further than this
       is a user action: scroll, spine, ←. */
    k = Math.min(focusCol, Math.max(k, folded));
    if (root.dataset.layout === "compressed-columns") k = path.length;
    finder.scrollLeft = Math.round(k * foldUnit() * range());
  }
  applyScroll();
}

function applyScroll() {
  if (!path.length) return;
  /* The dial is the only thing that may move the strip, and #stage is where
     that gets decided: overflow hidden stops a finger, not a programmatic
     scroll. Now that the strip may be wider than the stage — a column right of
     focus peeks past the edge instead of folding — anything that scrolls an
     element into view drags every column out through the left edge, and the
     dial writes #finder, so nothing would put them back. revealRow keeps the
     app's own row reveals from doing it; this undoes whatever else did, at the
     next repaint. */
  if (stage.scrollLeft) stage.scrollLeft = 0;
  const max = Math.max(MIN_SCROLL_RANGE, rail.clientWidth - finder.clientWidth);
  const p = Math.min(1, finder.scrollLeft / max);
  const n = path.length;

  const { raw, t } = foldFromScroll(max);
  const { focusLeft, focusRight } = applyWidths(raw, t);
  const pan = panFocus(raw, focusLeft, focusRight);
  slideTail(p, pan, n);

  document.getElementById("st-fold").textContent = folded
    ? `${folded}/${n} folded`
    : "";
  paintTrail();
}

function foldFromScroll(max) {
  /* Half a pixel of slack, in pixels: layout() and unfoldTo() write
     round(k·unit·range), which can fall up to 0.5 px short of the boundary. A
     fixed 0.002 units was only 0.3 px once seven columns made a unit 160 px
     wide, and a landing read one column short paints the column ← just
     reached as a spine, with folded === focusCol so the next ← never scrolls. */
  const raw = Math.min(1, (finder.scrollLeft + BOUNDARY_SLACK) / max) /
    foldUnit();
  setState({ folded: Math.min(path.length, Math.floor(raw)) });
  /* how far into folding the next column is — 0 = full width, 1 = a spine */
  const t = Math.min(1, Math.max(0, raw - folded));
  return { raw, t };
}

function applyWidths(raw, t) {
  const g = GUTTER(), sp = SPINE(), n = path.length;
  let x = g, focusLeft = 0, focusRight = 0;
  [...strip.querySelectorAll(".col")].forEach((col, i) => {
    col.classList.toggle("spine", i < folded);
    col.classList.toggle("folding", i === folded && folded < n);
    const w = i < folded
      ? sp
      : i === folded
      ? Math.round(widths[i] + (sp - widths[i]) * t)
      : widths[i];
    if (i === focusCol) [focusLeft, focusRight] = [x, x + w];
    x += w + g;
    if (i < folded) {
      set(col.style, "width", "");
      return;
    }
    set(col.dataset, "fold", String(i === folded ? t : 0));
    setVar(col, "--fold", col.dataset.fold); /* custom props need setProperty */
    set(col.style, "width", w + "px");
  });
  return { focusLeft, focusRight };
}

function panFocus(raw, focusLeft, focusRight) {
  const g = GUTTER();
  const reach = Math.min(1, Math.max(0, raw - focusCol + 1));
  const pan = reach *
    Math.min(
      Math.max(0, focusRight - finder.clientWidth),
      Math.max(0, focusLeft - g),
    );
  return pan;
}

function slideTail(p, pan, n) {
  const sp = SPINE(), g = GUTTER();
  const tail = p > FULL_FOLD_THRESHOLD
    ? (p - FULL_FOLD_THRESHOLD) / TAIL_RANGE
    : 0;
  const shift = tail * n * (sp + g) + pan;
  set(strip.style, "minWidth", (finder.clientWidth + shift) + "px");
  set(strip.style, "transform", `translateX(${-shift}px)`);
}

/* Keep a row visible without letting it move the strip.

   scrollIntoView() is the obvious call and the wrong one here: it scrolls
   whichever ancestor brings the row into view, and now that a column can reach
   past the viewport that ancestor is #stage. Measured at 390 px on a chain
   seven deep: one keystroke moved it 28 px, and a walk in left it at 141 with
   the first three columns dragged off the left edge — for good, because the
   dial writes #finder and nothing writes #stage back. A row only ever needs
   its own column to scroll, and that is vertical. The arithmetic below is
   `block: "nearest"`: nothing if the row is already inside, otherwise the
   shorter of the two edges — the same numbers scrollIntoView produced. */
function revealRow(row) {
  const body = row.parentElement; /* .col-body scrolls */
  const r = row.getBoundingClientRect(), b = body.getBoundingClientRect();
  if (r.top < b.top) body.scrollTop += r.top - b.top;
  else if (r.bottom > b.bottom) body.scrollTop += r.bottom - b.bottom;
}

function initLayout(render) {
  finder.addEventListener("scroll", applyScroll, { passive: true });
  addEventListener("resize", () => render());
}

/* ═══ core/deeplink.js ═══ */
/* ═══════════════════════════════════════════════════════════════════════════
   Deep links — turning the selection into a path and back.

   Shared verbatim between the static build and the server build; only the
   ROUTER differs (a hash in one, a real URL path in the other). Everything
   here speaks in *names below the root*:

       path = [workspace, src, core]      →   ["src", "core", "state.js"]
       sel  = ["src", "core", "state.js"]

   The last segment is the selection in the deepest open column, which is the
   thing the address bar should name — a file when a file is selected, and the
   directory itself when one is open with nothing chosen inside it.
   ═══════════════════════════════════════════════════════════════════════════ */

/* render() runs on resize and on every keystroke, so writing the URL from it is
   only safe if an unchanged location is left alone — otherwise Back fills up
   with duplicates. applying is the re-entrancy guard: a URL being *read* must
   not be immediately re-written from the half-built state it produces. */
let applying = false;
let renderPage, colCache;
const setDeepLinkActions = (
  actions,
) => ({ renderPage, colCache } = actions);

function currentPath() {
  const names = path.slice(1).map((p) => p.name);
  const leaf = sel[path.length - 1];
  if (leaf !== undefined) names.push(leaf);
  return names;
}

/* Walking a column with ↑/↓ is one selection change per keystroke — pushing a
